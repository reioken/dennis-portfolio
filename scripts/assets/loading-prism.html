<!doctype html><html><head><style>
html,body{margin:0;width:64px;height:64px;background:transparent}
.stage{position:absolute;inset:0;perspective:240px}
.cube{position:absolute;left:20px;top:20px;width:24px;height:24px;transform-style:preserve-3d;animation:turn 4800ms linear infinite}
.cube>i{position:absolute;inset:0;box-sizing:border-box;border:1px solid #d5d4e1b0;background:linear-gradient(135deg,#e2d4c3de,#8f94aec9 35%,#282c3ae8 70%,#b9cfd2ba);backface-visibility:hidden;animation:assemble 2400ms ease-in-out infinite}
.cube>i::after{content:'';position:absolute;inset:4px;border:1px solid #f1e6ff36;background:linear-gradient(135deg,#f2e8e01f,transparent 65%)}
.cube>i:nth-child(2){--y:90deg}.cube>i:nth-child(3){--y:180deg}.cube>i:nth-child(4){--y:270deg}.cube>i:nth-child(5){--x:90deg}.cube>i:nth-child(6){--x:-90deg}
@keyframes turn{from{transform:rotateX(-24deg) rotateY(38deg) rotateZ(-8deg) rotate3d(.55,1,.25,0turn)}to{transform:rotateX(-24deg) rotateY(38deg) rotateZ(-8deg) rotate3d(.55,1,.25,1turn)}}
@keyframes assemble{0%,100%{transform:rotateY(var(--y,0deg)) rotateX(var(--x,0deg)) translateZ(12px)}50%{transform:rotateY(var(--y,0deg)) rotateX(var(--x,0deg)) translateZ(17px)}}
</style></head><body><div class="stage"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></body></html>
