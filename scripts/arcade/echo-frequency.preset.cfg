; Godot 4.7 Web export preset for Echo Frequency. scripts/export-arcade.mjs appends this
; temporarily to the game's export_presets.cfg, renumbers [preset.0] to the next free
; index and replaces __EXPORT_PATH__ with the absolute output path. Comment lines are
; stripped before appending.
;
; Filters mirror the game's own "Windows Desktop" preset so the web .pck carries the same
; resources. Key names are the ones Godot 4.3+ writes for platform="Web"; unknown keys are
; ignored by Godot, missing keys fall back to platform defaults.
;
; variant/thread_support=false    -> single-threaded template (web_nothreads_release.zip),
;                                    no COOP/COEP headers needed on the arcade page.
; variant/extensions_support=false -> no GDExtension (the game has none), avoids web_dlink_*.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.txt,*.md"
exclude_filter="tests/*,tools/*,assets/models/temp_stuhl/*"
export_path="__EXPORT_PATH__"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
