function rockFree(x, y, R, pad) {
  if (x < R + 200 || y < R + 200 || x > W - R - 200 || y > H - R - 200 || hyp(x - W / 2, y - H / 2) < R + 220) return false;

function genRocks() { // 5 walls of 4 rocks with 40px gaps (small bodies only) + 5 loose boulders; 200px lanes elsewhere; centre kept clear for the pen
  let tries = 0;
  while (G.rocks.length < 20 && tries++ < 3000) {
    const a = rnd() * TAU, ca = Math.cos(a), sa = Math.sin(a), wall = []; let x = rr(200, W - 200), y = rr(200, H - 200), ok = true;
    for (let i = 0; i < 4 && ok; i++) {

// ───────────── player verbs: vacuum / spit / digest / gulp / hurt ─────────────
const vacRange = () => (G.p.r * 4 + 20) * G.mut.range;

function spit() {
