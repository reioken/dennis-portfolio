'use strict';
// ================= DATA =================
const GAMEID='hoseline',FONT='"Segoe UI Variable Display","Segoe UI",ui-rounded,system-ui,sans-serif';
const TW=40,TH=30,T=20,WW=TW*T,WH=TH*T,N=TW*TH;
const ROAD=0,WOOD=1,BRICK=2,OIL=3,GRASS=4;
// house palette: player cyan/white, danger red, reward gold, safe green, scenery greys/browns

const MATS=[ // spread = chance/s to ignite each orthogonal neighbour, burn = seconds until ash
 {name:'ROAD', spread:0,   burn:0, col:C.road},
 {name:'WOOD', spread:0.10,burn:10,col:'#86694a'},
 {name:'BRICK',spread:0.04,burn:16,col:'#6b7385'},
 {name:'OIL DEPOT',spread:0.25,burn:6,col:'#3a3650',blast:2},
 {name:'PARK', spread:0.06,burn:5, col:'#2f4a38'}];

const CFG={speed:150,truckSpeed:220,hose:200,range:120,cone:34,tankMax:140,useRate:8,refill:35,hydrantR:70,
 enterR:40,enterT:1.0,sprayT:0.6,wetT:10,recoil:25,loseAt:0.35,winT:350,tutT:45,goldAsh:0.2,
 ignMul:1,ignLate:2.5,ignLateRamp:300,ignFarBias:0.45,warnT:3,upgEvery:75,caHz:10,
 ember:0.012,emberR:3,windPush:2,spreadMul:0.9,cannonR:110};
// HARD = the old bot-tuned numbers (shorter hose, slower knock-down, faster ignitions, stronger embers)
const HARD={hose:180,cone:30,tankMax:100,refill:25,hydrantR:60,enterR:30,enterT:0.6,sprayT:0.7,wetT:8,recoil:40,

try{new URLSearchParams(location.search).forEach((v,k)=>{if(k==='hard')urlHard=v!=='0';else if(k in CFG&&isFinite(+v))URLCFG[k]=+v})}catch(e){}
// run structure: 5 NIGHTS, each on a freshly generated town (ash resets, tank refills, upgrades carry over).
// len = relative length (scaled so the whole run lasts winT), ign = seconds between ignitions at the start / end of the night.

 {name:'DRY WIND',    len:60,ign:[10,7.5], ember:true, bolt:0,   twin:false,intro:'NEW: WIND - burning tiles throw EMBERS downwind, even across roads. Check the WIND arrow up top.'},
 {name:'STORM FRONT', len:65,ign:[8,6],   ember:true, bolt:0.35,twin:false,intro:'NEW: LIGHTNING - a red cross marks a strike that lights 5 tiles at once. Soak it before it lands!'},
 {name:'FIRESTORM',   len:65,ign:[7.5,5.5], ember:true, bolt:0.3, twin:true, intro:'NEW: fires now start in PAIRS. Park the truck centrally and take the bigger one first.'},
 {name:'THE REFINERY',len:80,ign:[9,7], ember:true, bolt:0.25,twin:true, refinery:true,finale:true,windPush:2,emberMul:1.5,

const ENDLESS={name:'ENDLESS',ign:[9.5,9.5],ember:true,bolt:0.3,twin:true,windPush:1.5,emberMul:1.2,intro:'The fires keep coming, faster every night. How long can you hold?'};
// upgrades: one data row + one rule hook each. play:true = changes HOW you play
const UPGRADES=[
 {id:'hose',  icon:'hose',  name:'LONGER HOSE',   desc:'+60 hose length',                      why:'Move the truck less often.',            apply:s=>{s.hose+=60}},
 {id:'tank',  icon:'drop',  name:'BIGGER TANK',   desc:'+60 tank capacity',                    why:'Longer fights far from hydrants.',      apply:s=>{s.tankMax+=60;G.tank+=60}},
 {id:'cone',  icon:'cone',  name:'WIDE NOZZLE',   desc:'+14 degrees of spray cone',            why:'Hit more tiles with each sweep.',       apply:s=>{s.cone+=14}},
 {id:'range', icon:'jet',   name:'HIGH PRESSURE', desc:'+40 spray range',                      why:'Reach deep inside big blocks.',         apply:s=>{s.range+=40}},
 {id:'quick', icon:'boot',  name:'QUICK BOOTS',   desc:'Get in / out of the truck 2x faster',  why:'Re-parking stops costing you fires.',   once:true,apply:s=>{s.enterT*=0.5}},
 {id:'foam',  icon:'foam',  name:'FOAM',          desc:'Soaked tiles stay wet for 25s',        why:'Firebreaks that actually hold.',        once:true,apply:s=>{s.wetT=25}},
 {id:'hydr',  icon:'link',  name:'LONG COUPLING', desc:'Hydrant rings are 2x bigger',          why:'Refill from almost anywhere.',          once:true,apply:s=>{s.hydrantR*=2}},
 {id:'mist',  icon:'halo',  name:'MIST HALO',     desc:'Tiles next to you get soaked as you walk',why:'Walk a block edge to firebreak it.', once:true,play:true,apply:s=>{s.mist=1}},
 {id:'cannon',icon:'gun',   name:'DECK CANNON',   desc:'Parked truck sprays the nearest fire by itself',why:'Park ON the fire: two hoses.', once:true,play:true,apply:s=>{s.cannon=1}},
 {id:'splash',icon:'splash',name:'SPLASH DOWN',   desc:'Finishing a fire soaks everything around it',why:'Clean kills stop re-ignition.',   once:true,apply:s=>{s.splash=1}},
 {id:'over',  icon:'gauge', name:'OVERPRESSURE',  desc:'Douse 2x faster, but use 60% more water',why:'Fast kills - if you watch the TANK.', once:true,play:true,apply:s=>{s.sprayT*=0.5;s.useRate*=1.6}},
 {id:'tyres', icon:'tyre',  name:'OFF-ROAD TYRES',desc:'Truck can drive over parks and ash',   why:'Shortcuts straight through burnt blocks.',once:true,play:true,apply:s=>{s.offroad=1}},
 {id:'spot',  icon:'eye',   name:'SPOTTER',       desc:'+3s fire warnings, +25 for each one you soak in time',why:'Stop fires before they start.',once:true,play:true,apply:s=>{s.warnT+=3;s.spot=1}},
 {id:'dare',  icon:'dice',  name:'DOUBLE OR NOTHING',desc:'No upgrade now. Next night burns 40% hotter - then pick TWO',why:'Risk now, reward later.',play:true,apply:s=>{G.dare=true}}];

// ================= STATE / UTIL =================
let G=null,best=0,bestMedal='',wins=0,muted=false;
const UI={screen:'start',hard:urlHard,seen:{},t0:0,press:null,disp:0};
const I={ax:0,ay:0,up:false,down:false,left:false,right:false,spray:false,e:false,mx:0,my:0,sx:-1,sy:-1,md:false};
try{best=+localStorage.getItem('proto_'+GAMEID+'_best')||0;bestMedal=localStorage.getItem('proto_'+GAMEID+'_medal')||'';wins=+localStorage.getItem('proto_'+GAMEID+'_wins')||0;muted=localStorage.getItem('proto_mute')==='1'}catch(e){}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=n=>Math.floor(G.rnd()*n), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,k)=>a+(b-a)*k;
const nowMs=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
const mmss=t=>Math.floor(t/60)+':'+('0'+Math.floor(t%60)).slice(-2);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function setInput(o){Object.assign(I,o)}
function setScreen(n){if(UI.screen!==n){UI.screen=n;UI.t0=nowMs();UI.press=null}}
function tip(id,txt,until,once){if(once){if(UI.seen[id])return;UI.seen[id]=1}G.tip={txt,t:0,max:until?25:6,until}}

// ================= MAP GEN =================
function roadLines(n){const a=[];let c=1+ri(3);while(c<n-2){a.push(c);c+=6+ri(3)}return a}
function gaps(lines,n){const g=[];let s=0;for(const c of lines){if(c>s)g.push([s,c-1]);s=c+2}if(s<n)g.push([s,n-1]);return g}
function genMap(refinery){
 const xs=roadLines(TW),ys=roadLines(TH),m=G.mat;G.roadX=xs;G.roadY=ys;
 m.fill(WOOD);G.reg.fill(0);G.nearOil.fill(0);
 for(const c of xs)for(let y=0;y<TH;y++){m[y*TW+c]=ROAD;m[y*TW+c+1]=ROAD}
 for(const r of ys)for(let x=0;x<TW;x++){m[r*TW+x]=ROAD;m[(r+1)*TW+x]=ROAD}
 const blocks=[];
 for(const [x0,x1] of gaps(xs,TW))for(const [y0,y1] of gaps(ys,TH)){
  const b={x0,x1,y0,y1,w:x1-x0+1,h:y1-y0+1,id:blocks.length};blocks.push(b);
  const vert=b.w>=b.h,len=vert?b.w:b.h,cut=len>2?1+ri(len-1):len,mA=G.rnd()<0.6?WOOD:BRICK,mB=G.rnd()<0.6?WOOD:BRICK;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){m[y*TW+x]=((vert?x-x0:y-y0)<cut)?mA:mB;G.reg[y*TW+x]=b.id}
 }
 G.regBurn=new Array(blocks.length).fill(0);
 const big=shuffle(blocks.filter(b=>b.w>=3&&b.h>=3)),nPark=refinery?1:2+ri(2),nOil=refinery?big.length-1:3+ri(2);
 big.slice(0,nPark).forEach(b=>{for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++)m[y*TW+x]=GRASS});
 big.slice(nPark,nPark+nOil).forEach(b=>{const x=b.x0+ri(b.w-1),y=b.y0+ri(b.h-1);m[y*TW+x]=m[y*TW+x+1]=m[(y+1)*TW+x]=m[(y+1)*TW+x+1]=OIL;
  if(refinery&&b.w>=5&&b.h>=5&&G.rnd()<0.6){const x2=x<b.x0+2?b.x1-1:b.x0,y2=y<b.y0+2?b.y1-1:b.y0;m[y2*TW+x2]=m[y2*TW+x2+1]=m[(y2+1)*TW+x2]=m[(y2+1)*TW+x2+1]=OIL}}); // refinery: a second depot in the big blocks
 G.flam=0;for(let i=0;i<N;i++)if(m[i]!==ROAD)G.flam++;
 for(let i=0;i<N;i++)if(m[i]===OIL){const x=i%TW,y=i/TW|0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<TW&&ny<TH)G.nearOil[ny*TW+nx]=1}}
 // truck at the intersection nearest the centre
 const near=(a,v)=>a.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p);
 G.truck={x:(near(xs,TW/2-1)+1)*T,y:(near(ys,TH/2-1)+1)*T,a:0};
 G.p={x:G.truck.x+18,y:G.truck.y,r:5};
 // hydrants on road edges, spread out; the first one is always next to the starting intersection (home base)
 const cand=[];for(let i=0;i<N;i++){if(m[i]!==ROAD)continue;const x=i%TW,y=i/TW|0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<TW&&ny<TH&&m[ny*TW+nx]!==ROAD){cand.push({x:(x+.5)*T+dx*7,y:(y+.5)*T+dy*7,tile:i});break}}}
 let home=null,hd=1e9;for(const c of cand){const d=Math.hypot(c.x-G.truck.x,c.y-G.truck.y);if(d<hd){hd=d;home=c}}
 if(home)G.hydrants.push(home);
 const want=4+ri(2);let minD=12*T;
 for(let tries=0;G.hydrants.length<want&&tries<600;tries++){const c=cand[ri(cand.length)];if(tries%150===149)minD*=0.7;
  if(G.hydrants.every(h=>Math.hypot(h.x-c.x,h.y-c.y)>=minD))G.hydrants.push(c)}
}

// ================= RUN =================
function startRun(seed,hard){
 seed=(seed==null?Math.floor(Math.random()*2147483647):seed)>>>0;if(hard!=null)UI.hard=!!hard;
 G={seed,rnd:mulberry(seed),hard:UI.hard,t:0,over:false,won:false,winAsh:0,score:0,bonus:0,ext:0,clusters:0,newBest:false,stage:0,
  mat:new Uint8Array(N),st:new Uint8Array(N),burn:new Float32Array(N),wet:new Float32Array(N),water:new Float32Array(N),reg:new Int16Array(N),nearOil:new Uint8Array(N),
  regBurn:[],flam:0,ash:0,farAsh:0,burning:0,hydrants:[],warns:[],parts:[],floats:[],pops:[],cl:[],alert:null,roadX:[],roadY:[],
  s:Object.assign({},CFG,UI.hard?HARD:{},URLCFG),tank:0,mode:'foot',trans:0,aim:0,spraying:false,hitFire:false,refilling:null,cannonAt:-1,
  ignT:1e9,nextUpg:1e9,upg:null,picksLeft:0,pickTitle:'',taken:{},caAcc:0,shake:0,tut:0,tutAt:0,freeze:false,dare:false,wind:0,
  dryT:0,blasts:0,lastBlast:-9,fizz:0,tip:null,stageLog:[],night:1,sg:STAGES[0],nightT0:0,nightLen:0};
 G.nightLen=nightLenOf(0);G.tank=G.s.tankMax;G.wind=G.rnd()*6.283;UI.disp=0;
 genMap(false);G.flam0=G.flam;G.ashRun=0;return G;
}
function begin(){startRun(null);setScreen('play')}
const nightLenOf=k=>STAGES[k].len*G.s.winT/TOTAL_LEN;
// the ASH budget is shared by the whole run: every night's ash counts against 35% of one town (flam0)
const ashPct=()=>(G.ashRun+G.ash)/G.flam0;
// a new night = a freshly generated town: fires, wetness and warnings reset, the tank is refilled, ash budget, upgrades and score carry over
function newNight(sg,len){
 G.sg=sg;G.night++;G.nightT0=G.t;G.nightLen=len;G.ashRun+=G.ash;G.st.fill(0);G.burn.fill(0);G.wet.fill(0);G.water.fill(0);
 G.hydrants=[];G.warns=[];G.parts=[];G.floats=[];G.pops=[];G.cl=[];G.alert=null;G.ash=0;G.farAsh=0;G.burning=0;G.blasts=0;G.lastBlast=-9;G.dryT=0;
 G.wind=G.rnd()*6.283;G.caAcc=0;G.cannonAt=-1;G.refilling=null;G.mode='foot';G.trans=0;G.spraying=false;G.tut=4;G.freeze=false;G.ignT=4;
 genMap(!!sg.refinery);G.tank=G.s.tankMax;}
function endlessNight(){newNight(Object.assign({},ENDLESS,{name:'NIGHT '+(G.night+1),refinery:G.night%2===1}),G.s.upgEvery);G.nextUpg=G.t+G.s.upgEvery}
function ignite(i){
 if(G.st[i]!==0||G.mat[i]===ROAD)return;
 G.st[i]=1;G.burn[i]=0;G.water[i]=0;G.wet[i]=0;G.burning++;G.regBurn[G.reg[i]]++;
 const b=MATS[G.mat[i]].blast;
 if(b){const x=i%TW,y=i/TW|0;G.shake=0.3;if(G.t-G.lastBlast>1){G.blasts++;G.lastBlast=G.t;A.boom();
   tip('oil','OIL DEPOT exploded! Depots blast fire 2 tiles out - spray a depot BEFORE flames reach it (wet tiles cannot ignite).',null,true)}
  for(let dy=-b;dy<=b;dy++)for(let dx=-b;dx<=b;dx++){const nx=x+dx,ny=y+dy;
   if(dx*dx+dy*dy<=b*b&&nx>=0&&ny>=0&&nx<TW&&ny<TH&&G.wet[ny*TW+nx]<=0)ignite(ny*TW+nx)}}
}
function extinguish(i){
 G.st[i]=0;G.burn[i]=0;G.water[i]=0;G.wet[i]=G.s.wetT;G.burning--;G.ext++;
 const x=(i%TW+.5)*T,y=((i/TW|0)+.5)*T;G.pops.push({x,y,t:0});
 for(let k=0;k<3;k++)G.parts.push({x,y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,life:.35,max:.35,type:3});
 if(--G.regBurn[G.reg[i]]===0){G.clusters++;G.floats.push({x,y,txt:'+50 FIRE OUT',t:1.4,col:C.gold});A.ding(G.clusters);
  if(G.s.splash){const tx=i%TW,ty=i/TW|0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=tx+dx,ny=ty+dy;if(nx>=0&&ny>=0&&nx<TW&&ny<TH){const j=ny*TW+nx;if(G.st[j]===0&&G.mat[j]!==ROAD)G.wet[j]=Math.max(G.wet[j],G.s.wetT)}}}}
}
function caTick(h){
 const {mat,st,burn,wet}=G,rnd=G.rnd,fresh=[],s=G.s,reach=s.hose+s.range,tr=G.truck;
 const sg=G.sg,ember=sg.ember&&G.tut>=4,mul=s.spreadMul*(G.tut<4?0.5:1),eRate=s.ember*(sg.emberMul||1),push=s.windPush*(sg.windPush||1);
 const tryI=(j,p)=>{if(st[j]===0&&mat[j]!==ROAD&&wet[j]<=0&&rnd()<p)fresh.push(j)};
 for(let i=0;i<N;i++){
  if(wet[i]>0)wet[i]-=h;
  if(st[i]!==1||G.freeze)continue;
  const m=MATS[mat[i]];burn[i]+=h;const x=i%TW,y=i/TW|0;
  if(burn[i]>=m.burn){st[i]=2;G.burning--;G.ash++;G.regBurn[G.reg[i]]--;if(Math.hypot((x+.5)*T-tr.x,(y+.5)*T-tr.y)>reach)G.farAsh++;continue}
  const p=m.spread*h*mul;
  if(ember&&rnd()<eRate*h*burn[i]/m.burn){const ex=x+Math.round(Math.cos(G.wind)*push+(rnd()*2-1)*s.emberR),ey=y+Math.round(Math.sin(G.wind)*push+(rnd()*2-1)*s.emberR);
   if(ex>=0&&ey>=0&&ex<TW&&ey<TH){const j=ey*TW+ex;if(st[j]===0&&mat[j]!==ROAD&&wet[j]<=0){fresh.push(j);G.parts.push({x:(x+.5)*T,y:(y+.5)*T,vx:(ex-x)*T/0.5,vy:(ey-y)*T/0.5,life:.5,max:.5,type:2})}}}
  if(x>0)tryI(i-1,p);if(x<TW-1)tryI(i+1,p);if(y>0)tryI(i-TW,p);if(y<TH-1)tryI(i+TW,p);
 }
 for(const j of fresh)ignite(j);

}
// fire clusters (one per city block): size, bounding box, and whether the truck's hose can reach them
function computeClusters(){
 const st=G.st,reach=G.s.hose+G.s.range,tr=G.truck,m={};
 for(let i=0;i<N;i++)if(st[i]===1){const r=G.reg[i],x=i%TW,y=i/TW|0;let c=m[r];if(!c)c=m[r]={r,n:0,x0:x,y0:y,x1:x,y1:y,d:1e9};
  c.n++;if(x<c.x0)c.x0=x;if(x>c.x1)c.x1=x;if(y<c.y0)c.y0=y;if(y>c.y1)c.y1=y;const d=Math.hypot((x+.5)*T-tr.x,(y+.5)*T-tr.y);if(d<c.d)c.d=d}
 const list=Object.values(m);for(const c of list){c.far=c.d>reach-8;c.cx=(c.x0+c.x1+1)/2*T;c.cy=(c.y0+c.y1+1)/2*T}
 list.sort((a,b)=>b.n*(b.far?2:1)-a.n*(a.far?2:1));G.cl=list;G.alert=list[0]||null;
}
function free(x,y,r,ok){
 for(let a=-1;a<=1;a+=2)for(let b=-1;b<=1;b+=2){const tx=Math.floor((x+a*r)/T),ty=Math.floor((y+b*r)/T);
  if(tx<0||ty<0||tx>=TW||ty>=TH||!ok(ty*TW+tx))return false}
 return true;
}
const walkOK=i=>G.mat[i]===ROAD||G.mat[i]===GRASS||G.st[i]===2, driveOK=i=>G.mat[i]===ROAD||(G.s.offroad&&(G.st[i]===2||(G.mat[i]===GRASS&&G.st[i]!==1)));
function slide(o,mx,my,r,ok){if(mx&&free(o.x+mx,o.y,r,ok))o.x+=mx;if(my&&free(o.x,o.y+my,r,ok))o.y+=my}
function offerUpgrades(picks,title){
 const last=!G.won&&G.stage>=STAGES.length-1;
 G.upg=shuffle(UPGRADES.filter(u=>!(u.once&&G.taken[u.id])&&!(u.id==='dare'&&(last||picks>1)))).slice(0,3);
 G.picksLeft=picks||1;G.pickTitle=title||'';I.spray=false;setScreen('pick');
 tip('pick','',null,true);G.tip=null}
function applyUpgrade(u){u.apply(G.s);G.taken[u.id]=(G.taken[u.id]||0)+1}
function choose(i){if(!G||!G.upg||!G.upg[i])return;const u=G.upg[i];applyUpgrade(u);A.pick();G.picksLeft--;
 if(G.picksLeft>0&&G.upg.length>1){G.upg.splice(i,1);return}
 G.upg=null;setScreen('play');tip('night'+G.night,'NIGHT '+G.night+' - '+G.sg.name+'.  '+(G.won?'New town, full tank. ':'')+G.sg.intro)}
function tutTile(dmin,dmax,mats){const tr=G.truck,c=[];
 for(const mm of mats){for(let i=0;i<N;i++){if(G.mat[i]!==mm||G.st[i]!==0||G.nearOil[i])continue;const x=i%TW,y=i/TW|0,d=Math.hypot((x+.5)*T-tr.x,(y+.5)*T-tr.y);if(d<dmin||d>dmax)continue;
   if((x>0&&G.mat[i-1]===ROAD)||(x<TW-1&&G.mat[i+1]===ROAD)||(y>0&&G.mat[i-TW]===ROAD)||(y<TH-1&&G.mat[i+TW]===ROAD))c.push(i)}if(c.length)break}
 return c.length?c[ri(c.length)]:-1}
function ignInterval(){const s=G.s,sg=G.sg;let v;

function spray(dt){

 if(m===WOOD){ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(x+6,y,1.5,T);ctx.fillRect(x+13,y,1.5,T)}
 else if(m===BRICK){ctx.fillStyle='rgba(0,0,0,0.28)';ctx.fillRect(x,y+6,T,1.5);ctx.fillRect(x,y+13,T,1.5)}
 else if(m===OIL){ctx.strokeStyle=C.red;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+10,y+3);ctx.lineTo(x+17,y+10);ctx.lineTo(x+10,y+17);ctx.lineTo(x+3,y+10);ctx.closePath();ctx.stroke()}
 else if(m===GRASS){ctx.fillStyle='rgba(157,255,138,0.2)';ctx.fillRect(x+4,y+5,2,2);ctx.fillRect(x+13,y+11,2,2);ctx.fillRect(x+8,y+15,2,2)}}
function drawAsh(x,y){ctx.fillStyle=C.ash;ctx.fillRect(x,y,T,T);ctx.fillStyle='rgba(170,179,197,0.25)';ctx.fillRect(x+5,y+6,2,2);ctx.fillRect(x+12,y+12,2,2)}
function drawFire(x,y,k,now,seed,lookX,lookY,eyes){const fl=0.5+0.5*Math.sin(now*17+seed*7.31)*Math.sin(now*7+seed*1.7);
 ctx.globalAlpha=0.6+0.4*k;ctx.fillStyle=C.red;ctx.fillRect(x,y,T,T);
 const q=(7+9*k)*(0.85+0.15*fl);ctx.globalAlpha=0.95;ctx.fillStyle='rgb(255,'+(140+50*fl|0)+',60)';ctx.fillRect(x+T/2-q/2,y+T/2-q/2+1,q,q);ctx.globalAlpha=1;
 if(eyes){const a=Math.atan2(lookY-(y+10),lookX-(x+10)),ox=Math.cos(a)*1.2,oy=Math.sin(a)*1.2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+6.5,y+9,2.6,0,7);ctx.arc(x+13.5,y+9,2.6,0,7);ctx.fill();
  ctx.fillStyle='#3a0d16';ctx.beginPath();ctx.arc(x+6.5+ox,y+9+oy,1.3,0,7);ctx.arc(x+13.5+ox,y+9+oy,1.3,0,7);ctx.fill()}}
function drawHydrant(x,y,R,hot,now){ctx.strokeStyle='rgba(157,255,138,'+(hot?0.75:0.32)+')';ctx.lineWidth=hot?2:1.2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.stroke();ctx.setLineDash([]);
 if(hot)glow(C.green,10+4*Math.sin(now*5));ctx.fillStyle=C.green;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();noGlow();ctx.strokeStyle='#0b0d12';ctx.lineWidth=1.5;ctx.stroke();
 ctx.fillStyle='#0b0d12';ctx.fillRect(x-1.5,y-4.5,3,9);ctx.fillRect(x-4.5,y-1.5,9,3)}
function drawTruck(x,y,a,driving,now){ctx.save();ctx.translate(x,y);ctx.rotate(a);glow(driving?C.cyan:C.truck,driving?14:8);
 rr(-17,-10,34,20,4);ctx.fillStyle=C.truck;ctx.fill();noGlow();ctx.lineWidth=1.5;ctx.strokeStyle=driving?C.cyan:'#fff';ctx.stroke();
 ctx.fillStyle='#c9a552';ctx.fillRect(6,-9,9,18);ctx.fillStyle='#1b2230';ctx.fillRect(10,-7,4,14); // cab + windshield
 ctx.strokeStyle='#8c7440';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-14,-3);ctx.lineTo(3,-3);ctx.moveTo(-14,3);ctx.lineTo(3,3);for(let k=-12;k<=2;k+=4){ctx.moveTo(k,-3);ctx.lineTo(k,3)}ctx.stroke(); // ladder
 const bl=driving&&Math.sin(now*12)>0;ctx.fillStyle=bl?C.cyan:'#fff';ctx.fillRect(3,-8,2.5,5);ctx.fillStyle=bl?'#fff':C.cyan;ctx.fillRect(3,3,2.5,5);ctx.restore()}
function drawPlayer(x,y,a,now){const b=1+0.05*Math.sin(now*3);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(b,b);glow(C.cyan,12);
 ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,4.5,8,0,0,7);ctx.fill();noGlow();ctx.strokeStyle='#0b0d12';ctx.lineWidth=1;ctx.stroke(); // shoulders
 ctx.fillStyle='#cfd6e2';ctx.fillRect(3,-1.5,9,3); // nozzle
 ctx.fillStyle=C.cyan;ctx.beginPath();ctx.arc(0,0,4.6,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-4,-1,8,2);ctx.restore()} // helmet + crest
function drawCone(x,y,a,half,R,on){ctx.fillStyle=on?'rgba(124,245,255,0.30)':'rgba(124,245,255,0.09)';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,R,a-half,a+half);ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(124,245,255,'+(on?0.8:0.4)+')';ctx.lineWidth=1;ctx.stroke()}
function arrow(x,y,a,size,col){ctx.save();ctx.translate(x,y);ctx.rotate(a);glow(col,10);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(size,0);ctx.lineTo(-size*0.5,-size*0.75);ctx.lineTo(-size*0.15,0);ctx.lineTo(-size*0.5,size*0.75);ctx.closePath();ctx.fill();noGlow();ctx.restore()}
function drawMedal(x,y,r,rank){const col={gold:C.gold,silver:'#d5dbe8',bronze:'#d08a55'}[rank];
 if(!col){ctx.setLineDash([4,4]);ctx.strokeStyle='#4a556e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r*0.8,0,7);ctx.stroke();ctx.setLineDash([]);return}
 ctx.fillStyle='#3d6f9e';ctx.beginPath();ctx.moveTo(x-r*0.55,y+r*0.3);ctx.lineTo(x-r*0.8,y+r*1.5);ctx.lineTo(x-r*0.3,y+r*1.2);ctx.lineTo(x,y+r*1.5);ctx.lineTo(x+r*0.3,y+r*1.2);ctx.lineTo(x+r*0.8,y+r*1.5);ctx.lineTo(x+r*0.55,y+r*0.3);ctx.fill();
 glow(col,14);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();noGlow();ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=r*0.12;ctx.beginPath();ctx.arc(x,y,r*0.78,0,7);ctx.stroke();
 ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();for(let k=0;k<10;k++){const a=-1.5708+k*0.6283,q=(k%2?0.24:0.55)*r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath();ctx.fill()}
function drawIcon(kind,x,y,r,col){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle='#0d111b';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke();
 ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.lineCap='round';const q=r*0.5;ctx.beginPath();
 if(kind==='hose'){ctx.arc(0,0,q,0.6,5.6);ctx.stroke();ctx.beginPath();ctx.arc(0,0,q*0.45,0,7);ctx.stroke()}
 else if(kind==='drop'){ctx.moveTo(0,-q*1.2);ctx.quadraticCurveTo(q*1.2,q*0.4,0,q);ctx.quadraticCurveTo(-q*1.2,q*0.4,0,-q*1.2);ctx.fill()}
 else if(kind==='cone'){ctx.moveTo(-q,0);ctx.arc(-q,0,q*2,-0.6,0.6);ctx.closePath();ctx.fill()}
 else if(kind==='jet'){ctx.moveTo(-q*1.2,0);ctx.arc(-q*1.2,0,q*2.4,-0.2,0.2);ctx.closePath();ctx.fill()}
 else if(kind==='boot'){for(const o of [-q*0.6,q*0.3]){ctx.moveTo(o-q*0.3,-q*0.7);ctx.lineTo(o+q*0.4,0);ctx.lineTo(o-q*0.3,q*0.7)}ctx.stroke()}
 else if(kind==='foam'){ctx.arc(-q*0.5,q*0.3,q*0.5,0,7);ctx.fill();ctx.beginPath();ctx.arc(q*0.4,q*0.2,q*0.6,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-q*0.5,q*0.45,0,7);ctx.fill()}
 else if(kind==='link'){ctx.arc(-q*0.45,0,q*0.6,0,7);ctx.stroke();ctx.beginPath();ctx.arc(q*0.45,0,q*0.6,0,7);ctx.stroke()}
 else if(kind==='halo'){ctx.arc(0,0,q*0.35,0,7);ctx.fill();ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(0,0,q,0,7);ctx.stroke();ctx.setLineDash([])}
 else if(kind==='gun'){ctx.fillRect(-q,-q*0.1,q*1.3,q*0.8);ctx.moveTo(-q*0.2,0);ctx.lineTo(q*1.1,-q*0.9);ctx.stroke()}
 else if(kind==='splash'){ctx.arc(0,0,q*0.75,0,7);ctx.stroke();for(let k=0;k<6;k++){ctx.beginPath();ctx.arc(Math.cos(k*1.047)*q*1.25,Math.sin(k*1.047)*q*1.25,1.6,0,7);ctx.fill()}}
 else if(kind==='gauge'){ctx.arc(0,q*0.3,q,3.14,6.28);ctx.stroke();ctx.beginPath();ctx.moveTo(0,q*0.3);ctx.lineTo(q*0.6,-q*0.5);ctx.stroke()}
 else if(kind==='tyre'){ctx.lineWidth=5;ctx.arc(0,0,q*0.8,0,7);ctx.stroke()}
 else if(kind==='eye'){ctx.moveTo(-q*1.2,0);ctx.quadraticCurveTo(0,-q*1.2,q*1.2,0);ctx.quadraticCurveTo(0,q*1.2,-q*1.2,0);ctx.stroke();ctx.beginPath();ctx.arc(0,0,q*0.35,0,7);ctx.fill()}
 else{rr(-q,-q,q*2,q*2,4);ctx.stroke();for(const [a,b] of [[-0.45,-0.45],[0.45,0.45],[0,0]]){ctx.beginPath();ctx.arc(a*q,b*q,1.8,0,7);ctx.fill()}}
 ctx.restore()}

 // building drop shadows (raised = blocked)

 // tile grid + raised outlines on building edges
 ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=TW;x++){ctx.moveTo(x*T,0);ctx.lineTo(x*T,WH)}for(let y=0;y<=TH;y++){ctx.moveTo(0,y*T);ctx.lineTo(WW,y*T)}ctx.stroke();
 ctx.strokeStyle='rgba(232,237,247,0.6)';ctx.lineWidth=1.6;ctx.beginPath();
 for(let i=0;i<N;i++){if(!solid(i))continue;const tx_=i%TW,ty=i/TW|0,x=tx_*T,y=ty*T;
  if(ty===0||!solid(i-TW)){ctx.moveTo(x,y);ctx.lineTo(x+T,y)}if(ty===TH-1||!solid(i+TW)){ctx.moveTo(x,y+T);ctx.lineTo(x+T,y+T)}

 ctx.stroke();
 // ignition telegraphs (red = danger). spark = ring + !, lightning = red cross of 5 tiles
 for(const w of G.warns){const x=(w.i%TW+.5)*T,y=((w.i/TW|0)+.5)*T,k=1-w.t/w.max,pl=0.5+0.5*Math.sin(now*14);
  if(w.bolt){ctx.fillStyle='rgba(255,93,115,'+(0.2+0.3*k+0.15*pl)+')';for(const j of w.tiles)ctx.fillRect((j%TW)*T+1,(j/TW|0)*T+1,T-2,T-2)}
  glow(C.red,10);ctx.strokeStyle='rgba(255,93,115,'+(0.6+0.4*pl)+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,(w.bolt?34:24)*(1-k)+7,0,7);ctx.stroke();noGlow();

  if(w.tut)label(x,y-34,'FIRE STARTING',C.red,true);else if(w.bolt&&(UI.seen.boltN=(UI.seen.boltN||0)+0.01)<4)label(x,y-44,'LIGHTNING',C.red)}
 // hydrants (green = safe / refill) with their range rings
 const low=G.tank<s.tankMax*0.35;let nh=null,nd=1e9;for(const h of G.hydrants){const d=Math.hypot(h.x-tr.x,h.y-tr.y);if(d<nd){nd=d;nh=h}}
 for(const h of G.hydrants)drawHydrant(h.x,h.y,s.hydrantR,low||G.refilling===h,now);
 if(low&&nh&&!G.refilling)label(nh.x,nh.y+20,'REFILL HERE',C.green,true);
 if(G.refilling&&G.tank<s.tankMax){ctx.strokeStyle=C.green;ctx.lineWidth=2.5;ctx.setLineDash([5,4]);ctx.lineDashOffset=-now*40;ctx.beginPath();ctx.moveTo(G.refilling.x,G.refilling.y);ctx.lineTo(tr.x,tr.y);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0;
  label(tr.x,tr.y+26,'REFILLING',C.green,true)}
 // THE TETHER: dashed hose-reach ring around the truck, faint outer ring = how far the spray gets
 ctx.strokeStyle='rgba(124,245,255,0.7)';ctx.lineWidth=1.8;ctx.setLineDash([9,7]);ctx.beginPath();ctx.arc(tr.x,tr.y,s.hose,0,7);ctx.stroke();
 ctx.strokeStyle='rgba(124,245,255,0.22)';ctx.lineWidth=1.2;ctx.setLineDash([2,7]);ctx.beginPath();ctx.arc(tr.x,tr.y,s.hose+s.range,0,7);ctx.stroke();ctx.setLineDash([]);
 {const ra=G.alert?Math.atan2(G.alert.cy-tr.y,G.alert.cx-tr.x)+Math.PI:-Math.PI/2;label(clamp(tr.x+Math.cos(ra)*s.hose,40,WW-40),clamp(tr.y+Math.sin(ra)*s.hose,14,WH-14),'HOSE REACH',C.cyan)} // sits on the ring, on the side away from the biggest fire

 rr(OX,OY,WW*S,WH*S,14*U);ctx.lineWidth=danger>0?3:1;ctx.strokeStyle=danger>0?'rgba(255,93,115,'+(0.5+0.4*Math.sin(now*6))*danger+')':C.line;if(danger===0)glow('rgba(124,245,255,0.35)',12);ctx.stroke();noGlow();

// ================= INPUT / MAIN LOOP =================
function act(id){A.click();
 if(id==='play'||id==='retry')begin();else if(id==='resume'){if(UI.screen==='help')setScreen(G.upg?'pick':G.over?'over':'play')}
 else if(id==='normal')UI.hard=false;else if(id==='hard')UI.hard=true;else if(id==='menu')location.href='index.html';
 else if(id==='endless'){if(UI.screen==='win'){endlessNight();setScreen('play');tip('endless','ENDLESS: a fresh town every '+G.s.upgEvery+'s with an upgrade in between. Fires come faster each night.')}}
 else if(/^pick\d$/.test(id))choose(+id.slice(4))}
function toggleHelp(){if(UI.screen==='help')act('resume');else if(UI.screen==='play'||UI.screen==='pick'){I.spray=false;setScreen('help')}}
const KEYS={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
window.addEventListener('keydown',e=>{A.init();const k=KEYS[e.code];if(k){I[k]=true;if(e.preventDefault)e.preventDefault()}
 if(e.repeat)return;const c=e.code;
 if(c==='KeyE')I.e=UI.screen==='play';else if(c==='KeyR')begin();else if(c==='Escape')location.href='index.html';
 else if(c==='KeyH')toggleHelp();else if(c==='KeyM')A.setMute(!muted);
 else if(c==='KeyT'&&UI.screen==='start')UI.hard=!UI.hard;
 else if(c==='Enter'||c==='Space'){if(e.preventDefault)e.preventDefault();if(UI.screen==='start')act('play');else if(UI.screen==='help')act('resume');else if(UI.screen==='win'&&c==='Enter')act('endless')}
 else if(/^Digit[123]$/.test(c)&&UI.screen==='pick')choose(+c.slice(5)-1)});
window.addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)I[k]=false});
function mouse(e){I.sx=e.clientX;I.sy=e.clientY;I.mx=(e.clientX-OX)/S;I.my=(e.clientY-OY)/S}
const hit=()=>{for(const b of BTN)if(I.sx>=b.x&&I.sx<=b.x+b.w&&I.sy>=b.y&&I.sy<=b.y+b.h)return b.id;return null};
window.addEventListener('mousemove',mouse);
window.addEventListener('mousedown',e=>{A.init();mouse(e);if(e.button!==0)return;if(UI.screen==='play')I.spray=true;else UI.press=hit()});
window.addEventListener('mouseup',e=>{if(e.button!==0)return;mouse(e);I.spray=false;const id=hit();if(UI.screen!=='play'&&id&&id===UI.press)act(id);UI.press=null});
window.addEventListener('contextmenu',e=>e.preventDefault&&e.preventDefault());
window.addEventListener('blur',()=>{I.up=I.down=I.left=I.right=I.spray=false});
window.addEventListener('resize',resize);
let last=0;
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;update(dt);render();A.frame();requestAnimationFrame(frame)}
window.HL={startRun,begin,setInput,update,render,applyUpgrade,offerUpgrades,choose,act,toggleHelp,setScreen,medalRank,cause,walkOK,driveOK,newNight,endlessNight,CFG,HARD,MATS,STAGES,ENDLESS,UPGRADES,UI,I,T,TW,TH,get G(){return G}};
resize();startRun();requestAnimationFrame(frame);
