 for(let y=0;y<hgt+16;y++)for(let x=0;x<GW;x++){const nx=Math.abs(x-80)/68,ny=y/hgt;
  if(nx*nx*nx+ny*ny*ny+(nS(x*0.06,y*0.06)-0.5)*0.8<1)rock[y*GW+x]=1}

 for(let i=0;i<N;i++)if(rock[i]){tmp[i]=nO((i%GW)*f,((i/GW)|0)*f*1.15);vals.push(tmp[i])}

  const nB=noise(seed+555),bt=st.fin?0.54:0.5;for(let i=0;i<N;i++)if(rock[i]&&!ore[i]&&!kind[i]&&dist[i]>=2&&dist[i]<=4&&nB((i%GW)*0.07,((i/GW)|0)*0.07)>bt)brit[i]=1}
 if(st.hard){const nH=noise(seed+333),nM=noise(seed+444);for(let i=0;i<N;i++)if(rock[i]&&!ore[i]&&!brit[i]){const x=i%GW,y=(i/GW)|0;

 for(let k=0,tries=0;k<st.gas&&tries<400;tries++){const x=(20+Math.random()*120)|0,y=(12+Math.random()*(hgt-20))|0,i=y*GW+x;

  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){let sum=0;for(let d=-R;d<=R;d++){const xx=x+d;if(xx>=0&&xx<GW)sum+=a[y*GW+xx]}b[y*GW+x]=sum/(2*R+1)}

 G.slabPts=0;G.slabDisp=0;G.cuts=G.maxCuts=m.cuts+G.up.cut;G.cores=m.cores+2*G.up.core;G.wedge=G.up.wedge?1:0;G.refunds=G.up.refund?2:0;
 G.armed=false;G.finish=false;G.settle=0;G.cur=null;G.metTold=false;G.giveUpT=0;G.needCheck=false;G.sl={destroyed:0,rubble:0,whiffs:0};G.tut=null;slabDirty=true;

// ---------- the verb: simulate, preview, commit ----------
function simCut(x0,y0,x1,y1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
