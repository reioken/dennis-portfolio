<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Dice Siege</title>
<style>html,body{margin:0;height:100%;background:#0b0d12;background:radial-gradient(ellipse at 50% 45%,#121726 0%,#0b0d12 75%);overflow:hidden}
canvas{display:block;margin:0 auto;touch-action:none;user-select:none}</style></head>
<body><canvas id="c" width="960" height="720"></canvas>
<script>
(()=>{'use strict';
// ================= DATA (tuned with dicesiege_resume_test.js: handicapped bot L1 ~100% L2 ~85% L3 ~43% run-win ~12%) =================
const GAMEID='dicesiege';
const CFG={rows:10,target:30,hp:6,gunCost:3,cap:12,startEnergy:3,killRes:3,jam:[7,4],maxRerolls:3,
  robot:1,tgtDmg:1,ocCap:18,ocGen:1,cheapLab:1,salvage:2,baitRes:3,baitRow:9,jamDmg:2,plating:2,
  bossHp:14,bossKnock:3,bossRes:3,bossBreach:2,bossGrow:3,shieldUp:0,fieldDiv:3};
const MODES={normal:{label:'NORMAL',hull:7,labCost:5,turns:12,hpGain:1,repair:3},
             hard:{label:'HARD',hull:5,labCost:5,turns:12,hpGain:2,repair:2}};
const ROOMS=['GUN','GEN','LAB','GEN','GUN'];
const RNAME={GUN:'GUN',GEN:'GENERATOR',LAB:'LAB',SHIELD:'SHIELD'};
// invader types: one data row each; flags are read by resolve()
const TYPES={
  g:{name:'GRUNT',rule:'drops die - 1 rows',col:'#ff5d73'},
  a:{name:'ARMOURED',rule:'1st hit each turn is halved',col:'#e04560',armour:1},
  j:{name:'JUMPER',rule:'+1 extra row on EVEN dice',col:'#ff7a5c',jump:1},
  s:{name:'SPLITTER',rule:'killed: leaves a Splitling',col:'#ff5d9a',split:1},
  m:{name:'SPLITLING',rule:'half-HP leftover, same row',col:'#ff8fb5',small:1},
  p:{name:'SAPPER',rule:'descends: you lose 1 energy',col:'#f2506e',sap:1},
  B:{name:'MOTHERSHIP',rule:'2 columns, breach = -2 hull',col:'#d93a55',boss:1}};
// campaign: each level = one siege. start: one letter per column ('Bb' = boss + its second column)
const LEVELS=[
  {name:'FIRST CONTACT',target:32,hp:6,start:'ggggg',pool:'g'},
  {name:'IRON SHELLS',target:36,hp:6,start:'gagag',pool:'gga',intro:'a'},
  {name:'LEAPERS',target:40,hp:7,start:'jgagj',pool:'gaj',intro:'j'},
  {name:'THE SWARM',target:44,hp:7,start:'sgjas',pool:'gajs',intro:'s'},
  {name:'THE MOTHERSHIP',target:52,hp:9,turns:2,start:'jBbsa',pool:'gajs',intro:'B',boss:1}];
function levelDef(L){if(L<=5)return LEVELS[L-1];const k=L-5;
  return{name:'ENDLESS WAVE '+k,target:48+4*k,hp:9+k,start:'pjsap',pool:'gajsp',intro:k===1?'p':null};}
// upgrades: data row + one hook each (hooks live in resolve/startLevel/flip). play:1 = changes HOW you play
const UPS={
  robot:{name:'ROBOT DIE',icon:'robot',play:1,fx:'A spare +'+CFG.robot+' die you add to any gun or generator each turn. Moves no invader.',why:'Free strength with zero descent.'},
  shield:{name:'SHIELD ROOM',icon:'shield',play:1,fx:'Right generator also blocks half its die (rounded down) of descent in the columns beside it.',why:'Lets a big die sit in the lab safely.'},
  targeting:{name:'TARGETING',icon:'target',play:1,fx:'Guns can hit ANY column and deal +'+CFG.tgtDmg+' damage.',why:'Snipe whichever invader is lowest.'},
  precision:{name:'PRECISION',icon:'one',play:1,fx:'Dice showing 1 or 2 act with strength 3 (they still descend by their face).',why:'Low dice stop being dead weight.'},
  flip:{name:'GRAVITY FLIP',icon:'flip',play:1,fx:'Once per turn flip a die to its opposite face: 1-6, 2-5, 3-4. [F]',why:'Turn a useless 1 into a 6, or a scary 6 into a 1.'},
  jamnet:{name:'JAM NET',icon:'net',play:1,fx:'An invader landing on a JAM row also takes '+CFG.jamDmg+' damage.',why:'Steer invaders onto jam rows to hurt them.'},
  bait:{name:'BAIT BEACON',icon:'bait',play:1,fx:'RISKY: invaders arrive '+(CFG.rows-CFG.baitRow)+' row lower, but every kill gives +'+CFG.baitRes+' research.',why:'Danger now, faster wins later.'},
  overcharge:{name:'OVERCHARGE',icon:'bolt',fx:'Energy cap '+CFG.cap+' -> '+CFG.ocCap+'. Generators give +'+CFG.ocGen+' energy.',why:'Bank energy for double-fire turns.'},
  cheaplab:{name:'CHEAP LAB',icon:'flask',fx:'Lab costs '+CFG.cheapLab+' less energy.',why:'The lab fires more often.'},
  salvage:{name:'SALVAGE',icon:'gear',fx:'Every kill gives +'+CFG.salvage+' research.',why:'Guns become a second lab.'},
  fieldlab:{name:'FIELD LAB',icon:'flask2',fx:'Left generator also gives research = a third of its die (rounded down).',why:'Research even when the lab is starved.'},
  trickle:{name:'RESERVE CELL',icon:'cell',fx:'+1 energy at the start of every turn.',why:'Fewer "no energy" turns.'},
  plating:{name:'HULL PLATING',icon:'plate',fx:'+'+CFG.plating+' max hull, and repair '+CFG.plating+' now.',why:'Room for two more mistakes.'}};
let S=null,scr='start',mode='normal',help=false,tut=null,muted=false;
const LS={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}};
muted=LS.get('proto_mute')==='1';

// ================= PURE GAME LOGIC =================
function rnd(){S.rs=(S.rs+0x6D2B79F5)|0;let t=Math.imul(S.rs^S.rs>>>15,1|S.rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function hash4(a,b,c,d){let h=(a^Math.imul(b+1,0x9E3779B1)^Math.imul(c+1,0x85EBCA6B)^Math.imul(d+1,0xC2B2AE35))|0;h=Math.imul(h^h>>>16,0x45d9f3b);h=Math.imul(h^h>>>13,0x45d9f3b);return(h^h>>>16)>>>0;}
const spawnType=(s,c,n)=>s.pool[hash4(s.seed,s.level,c,n)%s.pool.length];   // pure, so the preview never lies
const unitOf=(inv,c)=>inv[c].link!=null?inv[c].link:c;
function gunTargets(s,c){return s.ups.targeting?[0,1,2,3,4]:[c-1,c,c+1].filter(x=>x>=0&&x<5);}
const strength=(s,d)=>(s.ups.precision&&d<3)?3:d;
// resolve: pure. vals[c]=die in column c (0=empty), targets[c]=gun target column or null, robotCol.
function resolve(s,vals,targets,robotCol,lite){
  const r={energy:s.energy,research:s.research,hull:s.hull,rerolls:s.rerolls,inv:s.inv.map(v=>({...v})),kills:0,breaches:0,hullLoss:0,dmg:0,labOk:0,labFail:0,noPower:0,steps:[]};
  const fresh=[0,0,0,0,0],hit=[0,0,0,0,0],block=[0,0,0,0,0];
  if(s.ups.trickle)r.energy=Math.min(s.cap,r.energy+1);r.e0=r.energy;
  const shieldBlk=d=>Math.floor((d+CFG.shieldUp)/2);
  s.rooms.forEach((rm,c)=>{if(rm==='SHIELD'&&vals[c])for(const a of[c-1,c+1])if(a>=0&&a<5)block[a]+=shieldBlk(vals[c]);});
  const respawn=(v,c)=>{v.n++;v.type=spawnType(s,c,v.n);v.maxHp=s.baseHp+s.hpGain*v.n;v.hp=v.maxHp;v.row=s.spawnRow;};
  const kill=(u,ev)=>{const v=r.inv[u],T=TYPES[v.type];fresh[u]=1;r.kills++;
    let res=CFG.killRes+(s.ups.salvage?CFG.salvage:0)+(s.ups.bait?CFG.baitRes:0);
    if(T.boss){res+=CFG.bossRes;v.row=Math.min(CFG.rows,v.row+CFG.bossKnock);v.maxHp+=CFG.bossGrow;v.hp=v.maxHp;ev.knock=true;}
    else if(T.split){v.type='m';v.maxHp=Math.ceil(v.maxHp/2);v.hp=v.maxHp;ev.split=true;}
    else respawn(v,u);
    r.research+=res;ev.killRes=(ev.killRes||0)+res;};
  for(let c=0;c<5;c++){
    const d=vals[c],room=s.rooms[c],u=unitOf(r.inv,c),v=r.inv[u];
    const ev={c,d,room,ok:true,from:v.row,to:v.row,n:0,eBefore:r.energy,u};
    if(d){
      const p=strength(s,d)+(robotCol===c&&room!=='LAB'?CFG.robot:0);
      if(room==='GEN'||room==='SHIELD'){const b=r.energy;r.energy=Math.min(s.cap,r.energy+p+(s.ups.overcharge?CFG.ocGen:0));ev.gain=r.energy-b;ev.capped=r.energy===s.cap&&ev.gain<p;
        if(room==='SHIELD')ev.blk=shieldBlk(d);
        if(s.ups.fieldlab&&c===1){ev.res=Math.floor(p/CFG.fieldDiv);r.research+=ev.res;}}
      else if(room==='LAB'){ev.cost=s.labCost;if(r.energy>=s.labCost){r.energy-=s.labCost;r.research+=p;ev.gain=p;r.labOk++;}else{ev.ok=false;r.labFail++;r.noPower++;}}
      else if(room==='GUN'){ev.cost=CFG.gunCost;
        if(r.energy>=CFG.gunCost){r.energy-=CFG.gunCost;
          const opts=gunTargets(s,c);let t=targets?targets[c]:null;
          if(t==null||!opts.includes(t))t=opts.reduce((a,b)=>{const A=r.inv[unitOf(r.inv,a)],B=r.inv[unitOf(r.inv,b)];return B.row<A.row||(B.row===A.row&&B.hp<A.hp)?b:a;});
          const tu=unitOf(r.inv,t),tv=r.inv[tu];let q=p+(s.ups.targeting?CFG.tgtDmg:0);
          if(TYPES[tv.type].armour&&!hit[tu]){q=Math.ceil(q/2);ev.halved=true;}hit[tu]=1;
          ev.tgt=t;ev.tu=tu;ev.dmg=Math.min(q,tv.hp);ev.tgtRow=tv.row;r.dmg+=ev.dmg;tv.hp-=q;
          if(tv.hp<=0){ev.kill=true;kill(tu,ev);}
        }else{ev.ok=false;r.noPower++;}
      }
      if(fresh[u])ev.skipped=true;
      else{let base=TYPES[v.type].boss?Math.floor((d-1)/2):d-1;if(TYPES[v.type].jump&&d%2===0){base++;ev.jumped=true;}
        const n=Math.max(0,base-block[c]);ev.blocked=base-n;ev.n=n;v.row-=n;ev.to=v.row;
        if(n>0&&TYPES[v.type].sap&&r.energy>0){r.energy--;ev.sap=true;}
        if(n>0&&v.row>0&&CFG.jam.includes(v.row)){r.rerolls=Math.min(CFG.maxRerolls,r.rerolls+1);ev.jam=true;
          if(s.ups.jamnet){v.hp-=CFG.jamDmg;ev.jamDmg=CFG.jamDmg;if(v.hp<=0){ev.jamKill=true;kill(u,ev);}}}
        if(v.row<=0){const loss=TYPES[v.type].boss?CFG.bossBreach:1;r.hull-=loss;r.hullLoss+=loss;r.breaches++;ev.breach=loss;
          if(TYPES[v.type].boss)v.row=CFG.rows;else respawn(v,u);}}
    }
    ev.eAfter=r.energy;
    if(!lite){ev.snap={energy:r.energy,research:r.research,hull:r.hull,rerolls:r.rerolls,inv:r.inv.map(v=>({...v}))};r.steps.push(ev);}
  }
  return r;
}
function startRun(seed,level,ups,opts){
  opts=opts||{};if(opts.mode)mode=opts.mode;const M=MODES[mode];
  S={seed:seed>>>0,rs:seed>>>0,ups:Object.assign({},ups||{}),mode,level:1,score:0,cleared:0,kills:0,totalRes:0,endless:false,maxHull:M.hull,hull:M.hull,seen:{},lost:null};
  if(S.ups.plating){S.maxHull+=CFG.plating;S.hull=S.maxHull;}
  tut=opts.tut?{step:0,die:0,col:1}:null;scr='game';help=false;tip=null;overT=0;dScore=0;
  startLevel(level||1);return S;
}
function startLevel(L){
  const D=levelDef(L),M=MODES[S.mode],u=S.ups;S.level=L;S.def=D;S.rooms=ROOMS.slice();if(u.shield)S.rooms[3]='SHIELD';
  S.cap=u.overcharge?CFG.ocCap:CFG.cap;S.labCost=M.labCost-(u.cheaplab?CFG.cheapLab:0);
  S.target=D.target+(CFG.target-30);S.maxTurns=M.turns+(D.turns||0);S.baseHp=D.hp+(CFG.hp-6);S.hpGain=M.hpGain;
  S.spawnRow=u.bait?CFG.baitRow:CFG.rows;S.pool=D.pool;
  S.energy=CFG.startEnergy;S.research=0;S.rerolls=0;S.turn=1;S.offer=[];S.brCols=[0,0,0,0,0];S.labOk=0;S.labFail=0;
  S.inv=[...D.start].map((t,c)=>t==='b'?{link:c-1}:t==='B'?{type:t,row:CFG.rows,hp:CFG.bossHp,maxHp:CFG.bossHp,n:0}:{type:t,row:S.spawnRow,hp:S.baseHp,maxHp:S.baseHp,n:0});
  disp=S.inv.map(v=>v.row||CFG.rows);hold=[0,0,0,0,0];anim=null;fx=[];dRes=0;dEn=S.energy;overT=0;
  if(D.intro&&!tut)setTip('NEW: '+TYPES[D.intro].name+' - '+(D.intro==='B'?'spans 2 columns; each die moves it (die-1)/2 rows. Break its plating (HP) to knock it back 3 rows. A breach costs 2 hull.':TYPES[D.intro].rule+'.'));
  newTurn();
}
function newTurn(){
  S.dice=[0,0,0,0,0].map(()=>1+Math.floor(rnd()*6));if(tut&&S.turn===1)S.dice=[5,6,2,4,1];
  S.place=[-1,-1,-1,-1,-1];S.targets=[null,null,null,null,null];S.robotCol=-1;S.done=[0,0,0,0,0];S.flipUsed=false;S.phase='place';
  sel=null;drag=null;rollT=.5;sfx.rattle();
  if(!S.seen.red&&S.inv.some(v=>v.row!=null&&v.row<=3)){S.seen.red=1;setTip('RED ZONE: an invader is 3 rows or less from your base. Give its column a LOW die, or kill it - a killed invader skips its descent.');sfx.alarm();}
}
const vals=pl=>(pl||S.place).map(i=>i<0?0:S.dice[i]);
function setPlacement(perm,targets,robotCol){S.place=perm.slice();S.targets=targets?targets.slice():[null,null,null,null,null];S.robotCol=(S.ups.robot&&robotCol!=null)?robotCol:-1;}
function reroll(i){if(!S||S.phase!=='place'||S.rerolls<=0||i==null||i<0||i>4||tut)return false;S.rerolls--;S.dice[i]=1+Math.floor(rnd()*6);sfx.rattle();rollT=.3;rollI=i;return true;}
function flip(i){if(!S||S.phase!=='place'||!S.ups.flip||S.flipUsed||i==null||i<0||i>4)return false;S.flipUsed=true;S.dice[i]=7-S.dice[i];sfx.clack();return true;}
function applySnap(p){S.energy=p.energy;S.research=p.research;S.hull=p.hull;S.rerolls=p.rerolls;S.inv=p.inv.map(v=>({...v}));}
function endTurn(instant){
  if(!S||S.phase!=='place'||S.place.includes(-1)||help)return false;
  const res=resolve(S,vals(),S.targets,S.robotCol);
  S.kills+=res.kills;S.labOk+=res.labOk;S.labFail+=res.labFail;res.steps.forEach(e=>{if(e.breach)S.brCols[e.c]++;});
  if(res.noPower&&!S.seen.nopower){S.seen.nopower=1;S.tipNext='NO ENERGY: a room went dark. Rooms fire LEFT to RIGHT - a generator only powers rooms to its right this turn. Leftover energy carries over.';}
  if(res.rerolls>S.rerolls&&!S.seen.jam){S.seen.jam=1;S.tipNext='REROLL TOKEN earned (invader landed on a JAM row). Click a die, then press X to reroll it.';}
  if(tut){tut=null;LS.set('proto_'+GAMEID+'_tut','1');S.tipNext='Nice! Click an invader to aim a nearby gun at it. A KILLED invader skips its descent that turn.';}
  if(tip&&!S.tipNext)tip=null;
  if(instant){applySnap(res);finishTurn();}else{S.phase='resolve';anim={res,i:0,t:.15};sel=null;}
  return true;
}
function finishTurn(){
  anim=null;if(S.tipNext){setTip(S.tipNext);S.tipNext=null;}
  if(S.hull<=0)return lose('hull');
  if(S.research>=S.target)return clearLevel();
  S.turn++;if(S.turn>S.maxTurns)return lose('time');
  newTurn();
}
function medalFor(n){return n>=5?'gold':n>=3?'silver':n>=1?'bronze':'';}
const RANK={'':0,bronze:1,silver:2,gold:3};
function persist(){const b=+LS.get('proto_'+GAMEID+'_best')||0;if(S.score>b)LS.set('proto_'+GAMEID+'_best',S.score);
  const m=medalFor(S.cleared),o=LS.get('proto_'+GAMEID+'_medal')||'';if(RANK[m]>(RANK[o]||0))LS.set('proto_'+GAMEID+'_medal',m);}
function clearLevel(){
  const left=S.maxTurns-S.turn;S.gain={base:100,turns:left*10,hull:S.hull*10,res:S.research};
  S.score+=100+left*10+S.hull*10+S.research;S.totalRes+=S.research;S.cleared=Math.max(S.cleared,S.level);overT=0;tip=null;
  if(S.level===5&&!S.endless){S.phase='victory';LS.set('proto_'+GAMEID+'_wins',(+LS.get('proto_'+GAMEID+'_wins')||0)+1);sfx.win();}
  else{S.phase='cleared';makeOffer();sfx.clear();}
  persist();
}
function makeOffer(){const pool=Object.keys(UPS).filter(k=>!S.ups[k]);S.offer=[];
  while(S.offer.length<3&&pool.length)S.offer.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
  if(!S.seen.pick){S.seen.pick=1;}}
function lose(why){
  S.phase='lost';S.score+=S.research;S.totalRes+=S.research;overT=0;tip=null;sfx.lose();
  const worst=S.brCols.indexOf(Math.max(...S.brCols)),short=S.target-S.research;
  if(why==='hull')S.lost={head:'HULL BREACHED',cause:'Invaders broke through '+S.brCols.reduce((a,b)=>a+b,0)+' times this siege - most often in column '+(worst+1)+' (the '+RNAME[S.rooms[worst]].toLowerCase()+').',
    tip:'Watch for the red BREACH warning before you end the turn. Give red-zone columns a 1 or 2, or shoot that invader: a killed invader skips its descent.'};
  else S.lost={head:S.def.boss?'THE MOTHERSHIP FIRED':'THE MOTHERSHIP LANDED',cause:'Time ran out at '+S.research+'/'+S.target+' research ('+short+' short). Your lab fired on '+S.labOk+' of '+(S.labOk+S.labFail)+' attempts.',
    tip:S.labFail>=2?'The lab went dark '+S.labFail+' times. Put a 4+ on the LEFT generator so the lab has '+S.labCost+' energy when its turn comes.':'Put your biggest die in the lab whenever the energy preview says OK - and remember each kill is worth +'+CFG.killRes+' research too.'};
  persist();
}
function keepGoing(){if(!S||S.phase!=='victory')return;S.endless=true;S.phase='cleared';overT=0;makeOffer();}
function chooseUpgrade(k){
  if(!S||S.phase!=='cleared')return;const M=MODES[S.mode];
  if(k==='repair')S.hull=S.maxHull;
  else{if(k==null||!S.offer[k]){if(S.offer.length)return;}else{const u=S.offer[k];S.ups[u]=true;if(u==='plating'){S.maxHull+=CFG.plating;S.hull+=CFG.plating;}}
    S.hull=Math.min(S.maxHull,S.hull+M.repair);}
  sfx.pick();startLevel(S.level+1);
}

// ================= AUDIO (soft synth, master gain, M = mute) =================
let AC=null,MG=null,NB=null;
function initAudio(){if(AC)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;try{AC=new A();MG=AC.createGain();MG.gain.value=muted?0:.5;MG.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function setMute(m){muted=m;LS.set('proto_mute',m?'1':'0');if(MG)MG.gain.value=m?0:.5;}
function tone(f,dur,type,vol,f2,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),a=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  a.gain.setValueAtTime(.0001,t);a.gain.linearRampToValueAtTime(vol||.1,t+.012);a.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(a);a.connect(MG);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol,freq,delay){if(!AC||!NB)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();
  s.buffer=NB;f.type='lowpass';f.frequency.value=freq||800;a.gain.setValueAtTime(vol||.1,t);a.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(a);a.connect(MG);s.start(t);s.stop(t+dur+.02);}
const PENTA=[523,587,659,784,880,1047,1175,1319];
const sfx={
  rattle(){for(let i=0;i<6;i++)noise(.03,.08,2500,i*.06+Math.random()*.02);},
  clack(){noise(.06,.16,1400);tone(330,.08,'triangle',.06,220);},
  pick(){tone(784,.06,'sine',.06);},
  hum(d){tone(196,.3,'triangle',.08,196+d*33);},
  zap(d){tone(1175,.16,'triangle',.07,392);noise(.08,.06,3000);},
  boom(){noise(.3,.22,500);tone(110,.3,'sine',.12,55);},
  chime(n){for(let i=0;i<Math.min(3,1+Math.floor(n/2));i++)tone(PENTA[Math.min(7,i*2+Math.floor(n/2))],.3,'sine',.08,0,i*.07);},
  fail(){tone(196,.18,'triangle',.07,147);},
  thunk(n){tone(140-n*8,.14+n*.03,'sine',.08+n*.015,50);},
  jam(){tone(880,.1,'sine',.07,1319);},
  alarm(){for(let i=0;i<2;i++)tone(440,.16,'triangle',.05,415,.3+i*.28);},
  breach(){noise(.5,.25,350);tone(147,.5,'triangle',.14,55);},
  clear(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'sine',.09,0,i*.09));},
  win(){[523,659,784,1047,1319,1568].forEach((f,i)=>{tone(f,.5,'sine',.09,0,i*.11);tone(f/2,.5,'triangle',.05,0,i*.11);});},
  lose(){[392,349,294,262].forEach((f,i)=>tone(f,.5,'sine',.07,0,i*.22));}
};

// ================= VIEW STATE / LAYOUT =================

function setTip(s){tip={s,t:0};}

  const c=S.place.indexOf(i);return c>=0?{x:CX(c)+(CW-DS)/2-14,y:RY+34,s:DS}:{x:BX+16+i*66,y:TRY,s:DS};
}

// ================= INPUT =================
function pos(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height};}
const inside=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function place(i,c){if(S.phase!=='place'||c<0)return;
  if(tut&&tut.step===0&&!(i===tut.die&&c===tut.col)){sfx.fail();return;}
  if(i===5){if(S.rooms[c]==='LAB'){sfx.fail();setTip('The robot die cannot help the lab - guns and generators only.');return;}S.robotCol=c;}else S.place=placedWith(i,c);
  sfx.clack();if(tut&&tut.step===0)tut.step=1;if(tut&&tut.step===1&&!S.place.includes(-1))tut.step=2;}
function unplace(i){if(tut&&tut.step===0)return;if(i===5)S.robotCol=-1;else{const f=S.place.indexOf(i);if(f>=0)S.place[f]=-1;}if(tut&&tut.step===2)tut.step=1;}
function aimAt(t){const guns=[0,1,2,3,4].filter(c=>S.rooms[c]==='GUN'&&S.place[c]>=0&&gunTargets(S,c).includes(t));if(!guns.length)return;
  guns.sort((a,b)=>Math.abs(a-t)-Math.abs(b-t));const gsel=guns.find(c=>S.targets[c]!==t);
  if(gsel!=null)S.targets[gsel]=t;else guns.forEach(c=>S.targets[c]=null);sfx.pick();}
function skipAnim(){if(!anim)return;while(anim&&anim.i<5)playStep(anim.res.steps[anim.i++],true);if(anim)finishTurn();}
function click(p){
  for(let k=btns.length-1;k>=0;k--){const b=btns[k];if(inside(p,b)){if(b.on){sfx.pick();b.fn();}return true;}}
  if(scr!=='game'||help||!S)return false;
  if(S.phase==='resolve'){skipAnim();return true;}
  if(S.phase!=='place')return false;
  for(let i=nDice()-1;i>=0;i--){const d=diePos(i);if(inside(p,{x:d.x-4,y:d.y-4,w:d.s+8,h:d.s+8})){if(tut&&tut.step===0&&i!==tut.die){sfx.fail();return true;}drag={i,sx:p.x,sy:p.y,moved:false};return true;}}
  const c=colAt(p.x,p.y);if(c<0){sel=null;return false;}
  if(sel!=null){place(sel,c);sel=null;}else if(p.y<RY)aimAt(c);
  return true;
}
function onDown(e){initAudio();const p=pos(e);mouse=p;mdown=true;click(p);}
function onMove(e){const p=pos(e);mouse=p;if(drag&&!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>6){drag.moved=true;sel=null;sfx.pick();}}
function onUp(e){mdown=false;if(!drag)return;const p=pos(e),i=drag.i;
  if(drag.moved){const c=colAt(p.x,p.y);if(c>=0)place(i,c);else unplace(i);}
  else{sel=sel===i?null:i;sfx.pick();}
  drag=null;}
function play(withTut){startRun((Date.now()^0x5eed)>>>0,1,null,{tut:withTut==null?!LS.get('proto_'+GAMEID+'_tut'):withTut});}
function toMenu(){try{location.href='index.html';}catch(e){}}
function onKey(e){initAudio();const k=e.key;
  if(k==='Escape'){toMenu();return;}
  if(k==='m'||k==='M'){setMute(!muted);return;}
  if(k==='h'||k==='H'||k==='?'){if(scr==='game'){help=!help;overT=0;}return;}
  if(k==='r'||k==='R'){play(false);return;}
  if(scr==='start'){if(k==='Enter'||k===' ')play();else if(k==='n'||k==='N')mode='normal';else if(k==='d'||k==='D')mode=mode==='hard'?'normal':'hard';if(k===' '&&e.preventDefault)e.preventDefault();return;}
  if(help){if(k==='Enter'||k===' ')help=false;return;}
  if(k===' '||e.code==='Space'||k==='Enter'){if(e.preventDefault)e.preventDefault();
    if(S.phase==='resolve')skipAnim();else if(S.phase==='place')endTurn(false);else if(S.phase==='victory')keepGoing();else if(S.phase==='cleared'&&!S.offer.length)chooseUpgrade(null);}
  else if((k==='x'||k==='X')&&sel!=null&&sel<5){if(reroll(sel))sel=null;}
  else if((k==='f'||k==='F')&&sel!=null&&sel<5)flip(sel);
  else if(S.phase==='cleared'){if('123'.includes(k))chooseUpgrade(+k-1);else if(k==='4')chooseUpgrade('repair');}
}
cv.addEventListener('pointerdown',onDown);window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('keydown',onKey);
function fit(){const k=Math.min(window.innerWidth/W,window.innerHeight/H)||1;cv.style.width=W*k+'px';cv.style.height=H*k+'px';}

// ================= UPDATE (animation + one-at-a-time resolution) =================
function float(x,y,s,col){fx.push({k:'txt',x:Math.min(BX+5*CW-50,Math.max(BX+50,x)),y:Math.max(y,TY+40),s,col,t:0,life:1.3});}
function pop(x,y,col){fx.push({k:'ring',x,y,col,t:0,life:.45});for(let i=0;i<6;i++){const a=i*1.05+Math.random();fx.push({k:'shard',x,y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,col,t:0,life:.4});}}
function playStep(ev,quiet){
  const c=ev.c,x=CX(c)+CW/2;S.done[c]=1;
  if(!quiet){
    if(!ev.ok){sfx.fail();float(x,RY-8,'NO ENERGY',C.dim);}
    else if(ev.room==='GEN'||ev.room==='SHIELD'){sfx.hum(ev.d);float(x,RY-8,'+'+ev.gain+' energy',C.cyan);if(ev.res)float(x,RY-30,'+'+ev.res+' research',C.gold);}
    else if(ev.room==='LAB'){sfx.chime(ev.gain);float(x,RY-8,'+'+ev.gain+' research',C.gold);}
    else if(ev.room==='GUN'){const tu=ev.tu,w=S.inv[tu].type==='B'?CW:CW/2,tx=CX(tu)+w,ty=rowY(Math.max(disp[tu],.5));sfx.zap(ev.d);
      fx.push({k:'zap',x1:x,y1:RY,x2:tx,y2:ty,t:0,life:.3});float(tx+30,ty-6,'-'+ev.dmg+(ev.halved?' (halved)':''),C.white);
      if(ev.kill){sfx.boom();pop(tx,ty,C.gold);float(tx,ty-34,(ev.knock?'PLATING BROKEN':ev.split?'SPLIT!':'KILL')+' +'+ev.killRes+' research',C.gold);shake=Math.max(shake,.5);}}
    if(ev.n>0){sfx.thunk(ev.n);}
    if(ev.sap)float(x,rowY(ev.to)+24,'sapped -1 energy',C.red);
    if(ev.jam){sfx.jam();float(x,rowY(Math.max(ev.to,1))-22,'JAM: +1 reroll'+(ev.jamDmg?', -'+ev.jamDmg+' HP':''),C.gold);}
    if(ev.breach){hold[ev.u]=.3;sfx.breach();shake=1;float(x,RY-34,'BREACH  -'+ev.breach+' HULL',C.red);fx.push({k:'ring',x,y:RY,col:C.red,t:0,life:.6});}
  }
  applySnap(ev.snap);
}
function update(dt){
  clock+=dt;startT+=dt;overT+=dt;rollT=Math.max(0,rollT-dt);if(rollT<=0)rollI=-1;shake=Math.max(0,shake-dt*3);
  if(tip){tip.t+=dt;}
  if(!S)return;
  dRes+=(S.research-dRes)*Math.min(1,dt*9);dEn+=(S.energy-dEn)*Math.min(1,dt*12);dScore+=(S.score-dScore)*Math.min(1,dt*5);
  for(let c=0;c<5;c++){const v=S.inv[c];if(v.link!=null)continue;let tgt=v.row;if(hold[c]>0){hold[c]-=dt;tgt=0;}
    disp[c]=tgt>disp[c]?tgt:Math.max(tgt,disp[c]-dt*16);}
  fx=fx.filter(f=>{f.t+=dt;if(f.k==='shard'){f.x+=f.vx*dt;f.y+=f.vy*dt;}return f.t<f.life;});
  if(anim&&!help){anim.t-=dt;if(anim.t<=0){
    if(anim.i<5){const ev=anim.res.steps[anim.i++];playStep(ev);anim.t=anim.i<5?(ev.d?.55:.15):.7;}else finishTurn();}}
}

// ================= DRAW HELPERS =================
function rp(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function rr(x,y,w,h,r,fill,stroke,lw){rp(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}
function txt(s,x,y,size,col,align,wt){g.font=(wt||500)+' '+size+'px '+FONT;g.fillStyle=col;g.textAlign=align||'left';g.textBaseline='middle';g.fillText(s,x,y);}
function fitTxt(s,x,y,size,col,align,wt,maxW){g.font=(wt||500)+' '+size+'px '+FONT;while(size>11&&g.measureText(s).width>maxW){size--;g.font=(wt||500)+' '+size+'px '+FONT;}txt(s,x,y,size,col,align,wt);}
function wrap(s,x,y,maxW,size,col,lh,align,wt){g.font=(wt||500)+' '+size+'px '+FONT;const ws=String(s).split(' ');let line='',n=0;
  for(const w of ws){const t=line?line+' '+w:w;if(line&&g.measureText(t).width>maxW){txt(line,x,y+n*lh,size,col,align,wt);n++;line=w;}else line=t;}
  if(line){txt(line,x,y+n*lh,size,col,align,wt);n++;}return n;}
function glow(col,b){g.shadowColor=col;g.shadowBlur=b;}
function noGlow(){g.shadowBlur=0;g.shadowColor='transparent';}
function card(x,y,w,h,hot){rr(x,y,w,h,12,C.panel,hot?C.cyan:C.line,hot?2:1);}
function arrow(x1,y1,x2,y2,col,lw,dash){const a=Math.atan2(y2-y1,x2-x1),h=8+(lw||2);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw||2;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2-Math.cos(a)*h*.7,y2-Math.sin(a)*h*.7);g.stroke();g.setLineDash([]);
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-Math.cos(a-.45)*h,y2-Math.sin(a-.45)*h);g.lineTo(x2-Math.cos(a+.45)*h,y2-Math.sin(a+.45)*h);g.closePath();g.fill();}
function bolt(x,y,s,col){g.fillStyle=col;g.beginPath();g.moveTo(x+s*.15,y-s*.5);g.lineTo(x-s*.3,y+s*.08);g.lineTo(x-s*.02,y+s*.08);g.lineTo(x-s*.15,y+s*.5);g.lineTo(x+s*.3,y-s*.1);g.lineTo(x+s*.02,y-s*.1);g.closePath();g.fill();}
function button(x,y,w,h,label,o){o=o||{};const on=o.on!==false,hv=on&&inside(mouse,{x,y,w,h}),pr=hv&&mdown,yy=y+(pr?2:0);
  btns.push({x,y,w,h,on,fn:o.fn||(()=>{})});
  if(o.primary&&on){glow(C.cyan,hv?16:8);rr(x,yy,w,h,10,hv?'#a8f9ff':C.cyan);noGlow();txt(label,x+w/2,yy+h/2+1,o.size||18,'#06222a','center',800);}
  else{rr(x,yy,w,h,10,on?(hv?'#1a2133':C.panel):'#0f121b',on?(hv?C.cyan:'#3a4560'):C.line,on&&hv?2:1);txt(label,x+w/2,yy+h/2+1,o.size||15,on?C.text:C.mute,'center',700);}
  if(o.sub)txt(o.sub,x+w/2,yy+h+12,14,C.dim,'center');}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDie(x,y,s,v,o){o=o||{};g.save();g.translate(x+s/2,y+s/2);if(o.rot)g.rotate(o.rot);if(o.scale)g.scale(o.scale,o.scale);g.globalAlpha=o.dim?.35:o.ghost?.5:1;
  if(!o.ghost){g.fillStyle='rgba(0,0,0,.45)';rp(-s/2+2,-s/2+5,s,s,s*.2);g.fill();}
  if(o.glow)glow(C.cyan,16);rr(-s/2,-s/2,s,s,s*.2,o.robot?'#bff9ff':'#f4f7fb',o.glow?C.cyan:'#8fa3b8',o.glow?3:1.5);noGlow();
  g.fillStyle='#10131b';for(const p of PIPS[v]||[]){g.beginPath();g.arc(((p%3)-1)*s*.27,(Math.floor(p/3)-1)*s*.27,s*.09,0,7);g.fill();}
  if(o.robot){txt('+'+CFG.robot,0,0,s*.5,'#0a3a44','center',800);}
  g.restore();}
function roomIcon(kind,x,y,s,col){g.save();g.translate(x,y);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2;g.lineJoin='round';
  if(kind==='GUN'){rp(-s*.45,s*.1,s*.9,s*.35,3);g.fill();g.fillRect(-s*.12,-s*.5,s*.24,s*.62);g.beginPath();g.arc(0,s*.1,s*.28,Math.PI,0);g.fill();}
  else if(kind==='GEN'){g.beginPath();g.arc(0,0,s*.46,0,7);g.stroke();bolt(0,0,s*.7,col);}
  else if(kind==='LAB'){g.beginPath();g.moveTo(-s*.14,-s*.48);g.lineTo(-s*.14,-s*.1);g.lineTo(-s*.42,s*.42);g.lineTo(s*.42,s*.42);g.lineTo(s*.14,-s*.1);g.lineTo(s*.14,-s*.48);g.stroke();g.beginPath();g.moveTo(-s*.3,s*.2);g.lineTo(-s*.42,s*.42);g.lineTo(s*.42,s*.42);g.lineTo(s*.3,s*.2);g.closePath();g.fill();g.fillRect(-s*.22,-s*.52,s*.44,3);}
  else if(kind==='SHIELD'){g.beginPath();g.moveTo(0,-s*.5);g.lineTo(s*.42,-s*.3);g.lineTo(s*.36,s*.15);g.lineTo(0,s*.5);g.lineTo(-s*.36,s*.15);g.lineTo(-s*.42,-s*.3);g.closePath();g.stroke();bolt(0,0,s*.5,col);}
  g.restore();}
function upIcon(k,x,y,s){const col=C.cyan;g.save();g.translate(x,y);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2.5;g.lineJoin='round';g.lineCap='round';

  if(k==='robot'){rr(-s*.4,-s*.4,s*.8,s*.8,6,null,col,2.5);g.beginPath();g.arc(-s*.15,-s*.05,3,0,7);g.arc(s*.15,-s*.05,3,0,7);g.fill();g.beginPath();g.moveTo(0,-s*.4);g.lineTo(0,-s*.58);g.stroke();}
  else if(k==='shield'){g.restore();roomIcon('SHIELD',x,y,s,col);return;}
  else if(k==='target'){ci();g.beginPath();g.arc(0,0,s*.16,0,7);g.fill();g.beginPath();g.moveTo(-s*.6,0);g.lineTo(-s*.3,0);g.moveTo(s*.3,0);g.lineTo(s*.6,0);g.moveTo(0,-s*.6);g.lineTo(0,-s*.3);g.moveTo(0,s*.3);g.lineTo(0,s*.6);g.stroke();}
  else if(k==='one'){rr(-s*.4,-s*.4,s*.8,s*.8,6,null,col,2.5);g.beginPath();g.arc(0,0,4,0,7);g.fill();txt('=3',s*.1,s*.62,14,col,'center',800);}

  else if(k==='bolt'){bolt(0,0,s*1.1,col);}
  else if(k==='flask'||k==='flask2'){g.restore();roomIcon('LAB',x,y,s,col);if(k==='flask2')bolt(x+s*.45,y-s*.3,s*.5,C.gold);return;}
  else if(k==='gear'){ci();for(let i=0;i<6;i++){const a=i*Math.PI/3;g.beginPath();g.moveTo(Math.cos(a)*s*.45,Math.sin(a)*s*.45);g.lineTo(Math.cos(a)*s*.62,Math.sin(a)*s*.62);g.stroke();}g.fillStyle=C.gold;g.beginPath();g.arc(0,0,4,0,7);g.fill();}
  else if(k==='cell'){rr(-s*.3,-s*.42,s*.6,s*.9,5,null,col,2.5);g.fillRect(-s*.12,-s*.56,s*.24,s*.12);g.fillRect(-s*.18,s*.05,s*.36,s*.32);}
  else if(k==='plate'){rr(-s*.48,-s*.3,s*.96,s*.6,5,null,col,2.5);for(const a of[-1,1])for(const b of[-1,1]){g.beginPath();g.arc(a*s*.32,b*s*.16,2,0,7);g.fill();}}
  g.restore();}
// invaders: shape first, hue second; eyes get meaner as they get lower (m = 0 far .. 1 at the base)
function invPath(t,w){g.beginPath();
  if(t==='a'){rp(-20,-17,40,33,9);}
  else if(t==='j'){g.moveTo(-21,-15);g.quadraticCurveTo(0,-22,21,-15);g.lineTo(5,16);g.quadraticCurveTo(0,20,-5,16);g.closePath();}
  else if(t==='s'){g.arc(-10,0,14,0,7);g.moveTo(24,0);g.arc(10,0,14,0,7);}
  else if(t==='m'){g.arc(0,0,12,0,7);}
  else if(t==='p'){g.moveTo(0,-20);g.lineTo(21,0);g.lineTo(0,20);g.lineTo(-21,0);g.closePath();}
  else if(t==='B'){g.ellipse(0,6,w,15,0,0,7);g.moveTo(40,2);g.arc(0,2,40,0,Math.PI,true);}
  else{g.arc(0,-2,20,Math.PI,0);g.lineTo(20,10);g.arc(13.3,10,6.7,0,Math.PI);g.arc(0,10,6.7,0,Math.PI);g.arc(-13.3,10,6.7,0,Math.PI);g.closePath();}}
function drawInv(x,y,v,o){o=o||{};const t=v.type,T=TYPES[t],m=o.m==null?Math.max(0,Math.min(1,(10-v.row)/8)):o.m,bw=CW-16;
  g.save();g.translate(x,y);const wob=o.wob||0;g.scale((o.scale||1)*(1+wob*.12),(o.scale||1)*(1-wob*.12));
  if(o.ghost){invPath(t,bw);g.setLineDash([5,4]);g.strokeStyle=o.col||C.red;g.lineWidth=2;g.globalAlpha=.85;g.stroke();g.setLineDash([]);g.globalAlpha=.12;g.fillStyle=o.col||C.red;g.fill();g.restore();return;}
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(0,20,t==='B'?bw*.8:16,4,0,0,7);g.fill();
  if(t==='j'){g.strokeStyle=T.col;g.lineWidth=2.5;for(const sx of[-1,1]){g.beginPath();g.moveTo(sx*12,2);g.lineTo(sx*19,8);g.lineTo(sx*11,13);g.lineTo(sx*18,19);g.stroke();}}
