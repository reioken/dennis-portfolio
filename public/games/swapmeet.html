<!doctype html>
<html><head><meta charset="utf-8"><title>SWAPMEET</title>
<style>html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}canvas{display:block;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
// ============ SWAPMEET — your only attack is swapping places. Attacks hit CELLS, not people. ============
const GID = 'swapmeet', N = 7, GOAL = 44, SWAP_COOLDOWN = 1, ROCKS = 3;
const FONT = '"Segoe UI Variable Display","Segoe UI",ui-rounded,system-ui,sans-serif';
const C = { bg:'#0b0d12', bg2:'#121726', panel:'#121622', border:'#232a3d', player:'#7cf5ff', danger:'#ff5d73', gold:'#ffd166',
  safe:'#9dff8a', text:'#e8ecf5', dim:'#aab3c5', ink:'#0b0d12' };
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]], DIAG = [[1,1],[1,-1],[-1,1],[-1,-1]];
const MEDALS = [['gold',240],['silver',140],['bronze',60]];                   // score thresholds (calibrated with the handicapped bot)
const medalFor = s => (MEDALS.find(m => s >= m[1]) || [null])[0];
// ---------- run structure: 5 stages of 8 turns, one new piece per stage, named finale ----------
const STAGES = [
  { name:'GRUNTS',   until:8 },
  { name:'BOMBERS',  until:16, add:'bomber' },
  { name:'ARCHERS',  until:24, add:'archer' },
  { name:'SLAMMERS', until:32, add:'slammer' },
  { name:'FINALE - THE WARLORD', until:GOAL, boss:'warlord' },
];
const MODES = {                                                            // HARD = the original bot-tuned pressure and 3 HP
  normal:{ hp:5, interval:[1,1,1,1,1], count:[1,2,2,2,3], cap:[6,8,10,12,14] },
  hard:  { hp:3, interval:[1,1,1,1,1], count:[2,2,3,3,3], cap:[8,10,12,14,14] },
};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, cs = 60, ox = 0, oy = 0, bw = 0, G = null, P = null;
const store = { get:(k,d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set:(k,v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let best = +store.get('proto_'+GID+'_best', 0) || 0, bestMedal = store.get('proto_'+GID+'_medal', ''), wins = +store.get('proto_'+GID+'_wins', 0) || 0;
const UI = { screen:'start', help:false, hard:false, t0:0, now:0, mx:-1, my:-1, down:null, btns:[], tutDone: store.get('proto_'+GID+'_tut','') === '1', motes:[] };
const seenTips = {};

// ---------- data: items (data row + one rule hook). 'how' items change how you play ----------
const ITEMS = [
  { id:'diag',   glyph:'X',  name:'Bishop Clause', desc:'You can also swap along diagonals.', why:'Twice as many swap lines.', diag:1 },
  { id:'pierce', glyph:'>>', name:'Long Arm',      desc:'Your swap line passes through one blocker.', why:'Reach the enemy hiding behind another.', pierce:1 },
  { id:'step2',  glyph:'2',  name:'Long Stride',   desc:'Step up to 2 tiles in a line.', why:'Escape big blasts in one move.', stepRange:2 },
  { id:'shove',  glyph:'->', name:'Shove',         desc:'While swap recharges: step INTO an adjacent enemy to push it 1 tile. Counts as a swap for score.', why:'An attack on your off-turn.', shove:1 },
  { id:'mine',   glyph:'*',  name:'Parting Gift',  desc:'The cell you leave by swapping explodes, killing whoever you put there.', why:'Every swap becomes a kill.', onSwap:(g,e,from)=>{ g.mine = {x:from.x,y:from.y}; } },
  { id:'stun',   glyph:'zz', name:'Jet Lag',       desc:'The enemy you swap with skips its next turn.', why:'It stays where you put it.', onSwap:(g,e)=>{ e.stun = 1; } },
  { id:'wind',   glyph:'~',  name:'Second Wind',   desc:'A swap that kills 2 or more recharges instantly.', why:'Chain big combos back to back.', wind:1 },
  { id:'extra',  glyph:'!!', name:'Encore',        desc:'3+ kills in one turn: take a free extra turn.', why:'Big combos buy you time.', extraAt:3 },
  { id:'pact',   glyph:'x2', name:'Blood Pact',    desc:'Lose 1 HP now. Swap kills score double for the rest of the run.', why:'Risk now, reward later.', mult:2, can:g=>g.player.hp > 1, onPick:g=>{ g.player.hp--; } },
  { id:'tips',   glyph:'$',  name:'Tip Jar',       desc:'Enemies that die WITHOUT your swap still score 1 each.', why:'Get paid for the chaos.', tipjar:1 },
  { id:'skin',   glyph:'O',  name:'Thick Skin',    desc:'The first hit you take each stage is absorbed.', why:'A safety net for mistakes.', skin:1, onPick:g=>{ g.shield = 1; } },
  { id:'ins',    glyph:'+1', name:'Insurance',     desc:'Once: a lethal hit leaves you at 1 HP instead.', why:'One free mistake in the finale.', onPick:g=>{ g.insured = 1; } },
  { id:'hp',     glyph:'+',  name:'Bandage',       desc:'Heal 2 HP.', why:'Simple. Alive is good.', repeat:1, onPick:g=>{ g.player.hp += 2; } },
];
const owned = () => ITEMS.filter(i => G.items[i.id]);
const stat = (k, base) => owned().reduce((v, i) => i[k] !== undefined ? i[k] : v, base);

// ---------- data: enemy types (move rule + telegraph shape) ----------
const around = (cx, cy, offs) => offs.map(([dx,dy]) => ({ x:cx+dx, y:cy+dy })).filter(c => inb(c.x,c.y) && !rockAt(c.x,c.y));
const ray = (x0, y0, dx, dy, len) => { const cells = []; for (let i = 1; i <= len; i++) { const x = x0+dx*i, y = y0+dy*i; if (!inb(x,y) || rockAt(x,y)) break; cells.push({ x, y }); } return cells; };
const TYPES = {
  grunt: { bag:3, letter:'G', name:'Grunt', verb:'stabs', short:'stabs 1 cell toward you', info:'Grunt: stabs the next cell toward you after your move.',
    move: e => stepToward(e),
    tele: e => { const [dx,dy] = dirTo(e), x = e.x+dx, y = e.y+dy; return inb(x,y) && !rockAt(x,y) ? { cells:[{x,y}], timer:1 } : null; } },
  bomber: { bag:3, letter:'B', name:'Bomber', verb:'bomb explodes', short:'3x3 blast on a countdown', info:'Bomber: drops a 3x3 blast where you stand. The number counts the turns until it lands.',
    tip:'NEW: BOMBER (B) - marks a 3x3 blast with a countdown. Be outside when it hits 0, or swap enemies INTO it.',
    move: e => hasTele(e) ? stepToward(e) : false,
    tele: e => hasTele(e) ? null : { cells:around(P.x,P.y,[[0,0],...DIRS,...DIAG]), timer:2, delayed:true, cx:P.x, cy:P.y } },
  archer: { bag:3, letter:'A', name:'Archer', verb:'shoots', short:'arrow hits the first body', info:'Archer: fires up to 3 cells in a line. The arrow stops at the FIRST body it meets.',
    tip:'NEW: ARCHER (A) - fires 3 cells in a line, but the arrow stops at the FIRST body. Put an enemy in the way.',
    move: e => { const ax = Math.abs(P.x-e.x), ay = Math.abs(P.y-e.y), sx = Math.sign(P.x-e.x), sy = Math.sign(P.y-e.y);
      if (ax && ay) return ax <= ay ? (tryMove(e,sx,0) || tryMove(e,0,sy)) : (tryMove(e,0,sy) || tryMove(e,sx,0));   // align
      if (ax+ay <= 1) return tryMove(e,-sx,-sy); if (ax+ay > 3) return tryMove(e,sx,sy); return false; },
    tele: e => { if (e.x !== P.x && e.y !== P.y) return null; const [dx,dy] = dirTo(e), cells = ray(e.x, e.y, dx, dy, 3);   // arrows stop at rocks
      return cells.length ? { cells, timer:1, line:true } : null; } },
  slammer: { bag:3, letter:'S', name:'Slammer', verb:'slams', short:'hits the 4 cells around it', info:'Slammer: every other turn it hits the 4 cells next to where it stood.',
    tip:'NEW: SLAMMER (S) - every other turn it hits the 4 cells around it. Swap it next to its friends.',
    move: e => (e.tick = (e.tick||0)+1) % 2 ? stepToward(e) : false,
    tele: e => e.tick % 2 ? null : { cells:around(e.x,e.y,DIRS), timer:1, cx:e.x, cy:e.y } },
  warlord: { bag:0, letter:'W', name:'Warlord', hp:2, verb:'slams', short:'2 HP, cross slam for 2. Hurt only on your SWAP turns', info:'Warlord: 2 HP. Slams a cross 2 cells long for 2 damage on a countdown. Armoured: it is only hurt on a turn you SWAPPED - swap it into another enemy\'s attack, twice.',
    tip:`FINALE: THE WARLORD (W) - slams a cross for 2 damage on a countdown. It only takes damage on turns you SWAP: put it in another enemy's red cell, twice, for +15. Survive to turn ${GOAL}.`,
    move: e => { if (hasTele(e)) return false; e.rest = (e.rest||0)+1; return stepToward(e); },
    tele: e => (hasTele(e) || (e.rest||0) < 2) ? null : (e.rest = 0, { cells:DIRS.flatMap(([dx,dy]) => ray(e.x,e.y,dx,dy,2)), timer:2, delayed:true, dmg:2, cx:e.x, cy:e.y }) },
};
const armored = (type, verb) => type === 'warlord' && !verb;                 // the boss shrugs off hits on turns you did not swap

// ---------- helpers ----------
const inb = (x,y) => x >= 0 && y >= 0 && x < N && y < N;
const enemyAt = (x,y) => G.enemies.find(e => e.x === x && e.y === y);
const rockAt = (x,y) => G.rocks.some(r => r.x === x && r.y === y);
const byId = id => G.enemies.find(e => e.id === id);
const hasTele = e => G.tele.some(t => t.owner === e.id);
const dist = e => Math.abs(P.x-e.x) + Math.abs(P.y-e.y);
const inCells = (cells,x,y) => cells.some(c => c.x === x && c.y === y);
const shuffle = a => { for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const later = (ms, fn) => G.q.push({ ms, fn });
const MODE = () => MODES[G.hard ? 'hard' : 'normal'];
const ease = t => 1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
function dirTo(e) { const dx = P.x-e.x, dy = P.y-e.y; return Math.abs(dx) >= Math.abs(dy) ? [Math.sign(dx)||1, 0] : [0, Math.sign(dy)]; }
function moveEnt(o, x, y, dur = 140, arc = 0) { o.a = { fx:o.x, fy:o.y, t:0, dur, arc }; o.x = x; o.y = y; }
function tryMove(e, dx, dy) { const x = e.x+dx, y = e.y+dy;
  if ((!dx && !dy) || !inb(x,y) || rockAt(x,y) || enemyAt(x,y) || (x === P.x && y === P.y)) return false; moveEnt(e,x,y); return true; }
function stepToward(e) { const dx = Math.sign(P.x-e.x), dy = Math.sign(P.y-e.y);
  return Math.abs(P.x-e.x) >= Math.abs(P.y-e.y) ? (tryMove(e,dx,0) || tryMove(e,0,dy)) : (tryMove(e,0,dy) || tryMove(e,dx,0)); }
// archer lines stop at the first body; everything else hits all of its cells
function effCells(t, occ) { if (!t.line) return t.cells; const out = []; for (const c of t.cells) { out.push(c); if (occ(c.x,c.y)) break; } return out; }
function nameList(arr) { const m = {}; arr.forEach(n => m[n] = (m[n]||0)+1); const p = Object.keys(m).map(n => m[n] > 1 ? `${m[n]} ${n}s` : n);
  return p.length > 1 ? p.slice(0,-1).join(', ')+' and '+p[p.length-1] : p[0]; }

// ---------- audio: soft synth, master gain, shared mute ----------
let AC = null, MG = null, muted = store.get('proto_mute','0') === '1';
function initAudio() { if (AC) return; const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
  try { AC = new A(); MG = AC.createGain(); MG.gain.value = muted ? 0 : .5; MG.connect(AC.destination); } catch (e) { AC = null; } }
function setMute(m) { muted = m; store.set('proto_mute', m ? '1' : '0'); if (MG) MG.gain.value = m ? 0 : .5; }
function tone(f, d = .12, type = 'sine', v = .12, slide = 0, delay = 0) { if (!AC) return;
  const t = AC.currentTime+delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t+d);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t+d+.03); }
function noise(d = .12, freq = 900, v = .1) { if (!AC) return; const n = Math.floor(AC.sampleRate*d), b = AC.createBuffer(1,n,AC.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random()*2-1)*(1-i/n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
  s.connect(f); f.connect(g); g.connect(MG); s.start(); }
const PENTA = [0,2,4,7,9,12,14,16,19,21], pent = i => 392*Math.pow(2, PENTA[Math.min(i,9)]/12);
const jingle = (notes, type = 'triangle', v = .1) => notes.forEach((n,i) => tone(pent(n), .26, type, v, 0, i*.09));

// ---------- run setup & spawning ----------
function startRun(opts = {}) {
  UI.screen = 'game'; UI.help = false; UI.t0 = UI.now;
  const hard = UI.hard;
  G = { hard, phase:'player', turn:0, stage:0, score:0, shown:0, kills:0, nextItem:10, items:{}, offer:null, offerWhy:'', pickQ:[], cool:0, shield:0, insured:0,
    player:{ x:3, y:3, hp:MODES[hard?'hard':'normal'].hp, a:null }, enemies:[], rocks:[], tele:[], pending:[], spawnT:3, bag:[], forceType:null, nid:1, seen:{ grunt:0 },
    q:[], skip:false, hitstop:0, shake:0, parts:[], rings:[], flashes:[], att:null, hover:null, hoverOff:false, scorePop:null,
    res:{ kills:0, hurt:false }, verbTurn:false, swapped:0, mine:null, killer:null, time:0, hurtFlash:0, eventLine:'', lastLine:'',
    tip:null, tipQ:[], tut:null, won:false, endless:false, ended:false, screenT:0,
    stats:{ swapKills:0, otherKills:0, maxCombo:0, swaps:0, items:0, hits:0 } };
  P = G.player;
  if (opts.tutorial) {                                                     // fixed teaching board: nothing can hurt you here
    G.tut = { step:1 }; G.enemies.push(mkEnemy('grunt',3,2), mkEnemy('grunt',5,3));
    G.enemies[0].label = 'ATTACKER'; G.enemies[0].ldy = -1; G.enemies[1].label = 'BYSTANDER'; G.enemies[1].ldy = 1;
    G.tele.push({ cells:[{x:3,y:3}], timer:1, owner:G.enemies[0].id, kind:'grunt' }); return; }
  // a few rocks in the inner ring (never on the edge spawn cells, never in the centre 3x3, never touching each other) so line-blocking matters
  const spots = shuffle([].concat(...[1,2,3,4,5].map(x => [1,2,3,4,5].map(y => ({x,y})))).filter(c => Math.max(Math.abs(c.x-3),Math.abs(c.y-3)) === 2));
  for (const c of spots) { if (G.rocks.length >= ROCKS) break; if (!G.rocks.some(r => Math.abs(r.x-c.x) <= 1 && Math.abs(r.y-c.y) <= 1)) G.rocks.push(c); }
  for (let i = 0; i < 2; i++) { const c = spawnCell(); if (c) G.enemies.push(mkEnemy('grunt', c.x, c.y)); }
  declare(G.enemies); announce();
}
function mkEnemy(type, x, y) { return { id:G.nid++, type, x, y, hp:TYPES[type].hp || 1, stun:0, a:null, born:UI.now, tick:0 }; }
function spawnCell() { const cells = [];
  for (let i = 0; i < N; i++) for (const c of [{x:i,y:0},{x:i,y:N-1},{x:0,y:i},{x:N-1,y:i}])
    if (!enemyAt(c.x,c.y) && !inCells(G.pending,c.x,c.y) && Math.abs(c.x-P.x)+Math.abs(c.y-P.y) >= 2) cells.push(c);
  return cells.length ? cells[Math.floor(Math.random()*cells.length)] : null; }
function availTypes() { const out = ['grunt']; STAGES.forEach((s,i) => { if (s.add && (G.endless || i <= G.stage)) out.push(s.add); }); return out; }
function drawType() { if (G.forceType) { const t = G.forceType; G.forceType = null; return t; }
  if (!G.bag.length) G.bag = shuffle(availTypes().flatMap(k => Array(TYPES[k].bag).fill(k))); return G.bag.pop(); }
function pushPending(type) { const c = spawnCell(); if (c) G.pending.push({ x:c.x, y:c.y, type }); }
function spawnRule() { const m = MODE(), s = G.stage, t = Math.max(0, G.turn-GOAL);   // endless: pressure keeps climbing, a fresh Warlord every 12 turns
  return G.endless ? { interval:1, count:1+Math.floor(t/8), cap:Math.min(14, 7+Math.floor(t/6)), boss:t > 0 && t % 12 === 0 } : { interval:m.interval[s], count:m.count[s], cap:m.cap[s] }; }
function announce() { const r = spawnRule();
  if (r.boss && !G.enemies.some(e => e.type === 'warlord')) pushPending('warlord');
  for (let i = r.count; i > 0; i--) if (G.enemies.length+G.pending.length < r.cap) pushPending(drawType());
  G.spawnT = r.interval; }
function declare(list) { for (const e of list) { const t = TYPES[e.type].tele(e); if (t) G.tele.push({ ...t, owner:e.id, kind:e.type }); } }
function stageStart() { const s = STAGES[G.stage]; G.shield = stat('skin',0) ? 1 : 0; G.bag = [];
  if (s.add) { pushPending(s.add); tip(TYPES[s.add].tip, 'new'); G.seen[s.add] = G.turn; }
  if (s.boss) { const c = spawnCell(); if (c) G.enemies.push(mkEnemy(s.boss, c.x, c.y)); else pushPending(s.boss); tip(TYPES[s.boss].tip, 'new'); G.seen[s.boss] = G.turn; }   // the boss walks in at once
  jingle([0,2,4], 'sine', .08); }
function tip(text, key, once) { if (once) { if (seenTips[key]) return; seenTips[key] = 1; } G.tipQ.push({ text, key }); }

// ---------- player actions ----------
function swapLines() { const out = [], dirs = stat('diag',0) ? DIRS.concat(DIAG) : DIRS;       // the reach of your verb, per direction
  for (const [dx,dy] of dirs) { let skip = stat('pierce',0), x = P.x+dx, y = P.y+dy, ex = P.x, ey = P.y; const targets = [];
    while (inb(x,y) && !rockAt(x,y)) { ex = x; ey = y; const e = enemyAt(x,y); if (e) { targets.push(e); if (skip-- <= 0) break; } x += dx; y += dy; }   // rocks end a line
    out.push({ ex, ey, targets }); }
  return out; }
function legalActions() {
  if (G.tut) return G.tut.step < 3 ? [{ type:'swap', id:G.enemies[1].id, x:G.enemies[1].x, y:G.enemies[1].y }] : [];
  const out = [{ type:'wait', x:P.x, y:P.y }], r = stat('stepRange',1);
  for (const [dx,dy] of DIRS) for (let i = 1; i <= r; i++) { const x = P.x+dx*i, y = P.y+dy*i;
    if (!inb(x,y) || rockAt(x,y) || enemyAt(x,y)) break; out.push({ type:'step', x, y }); }
  if (!G.cool) for (const l of swapLines()) for (const e of l.targets) out.push({ type:'swap', id:e.id, x:e.x, y:e.y });
  else if (stat('shove',0)) for (const [dx,dy] of DIRS) { const e = enemyAt(P.x+dx,P.y+dy), bx = P.x+2*dx, by = P.y+2*dy;
    if (e && inb(bx,by) && !rockAt(bx,by) && !enemyAt(bx,by)) out.push({ type:'shove', id:e.id, x:e.x, y:e.y, bx, by }); }
  return out; }
// what WOULD happen — same order and rules as the real resolution. Used by the hover preview, the skull marks and bots.
function simulate(a) {
  const pos = G.enemies.map(e => ({ id:e.id, type:e.type, x:e.x, y:e.y, hp:e.hp, alive:true })), verb = a.type === 'swap' || a.type === 'shove';
  const px = a.x, py = a.y, tgt = verb && pos.find(p => p.id === a.id);
  if (a.type === 'swap') { tgt.x = P.x; tgt.y = P.y; } else if (a.type === 'shove') { tgt.x = a.bx; tgt.y = a.by; }
  const occ = (x,y) => (x === px && y === py) || pos.some(p => p.alive && p.x === x && p.y === y);
  const list = G.tele.filter(t => t.timer <= 1); if (a.type === 'swap' && G.items.mine) list.push({ cells:[{x:P.x,y:P.y}], mineHit:true });
  const dies = [], wounded = [], shrug = []; let hurt = false, hurtBy = null;
  for (const t of list) { const cells = effCells(t, occ);
    for (const p of pos) if (p.alive && inCells(cells,p.x,p.y)) { if (armored(p.type, verb)) { if (!shrug.includes(p)) shrug.push(p); } else if (--p.hp <= 0) { p.alive = false; dies.push(p); } else if (!wounded.includes(p)) wounded.push(p); }
    if (!t.mineHit && !hurt && inCells(cells,px,py)) { hurt = true; hurtBy = t; } }
  const n = dies.length, gain = verb ? n*n*stat('mult',1) : (stat('tipjar',0) ? n : 0), shielded = hurt && G.shield > 0;
  return { px, py, dies, wounded, shrug, kills:n, hurt, hurtBy, shielded, dmg:hurt && !shielded ? (hurtBy.dmg || 1) : 0, gain, verb, moved:tgt || null };
}
const preview = simulate;
function act(a) {
  if (!G || G.phase !== 'player' || !a || UI.help || UI.screen !== 'game') return false;
  const L = legalActions().find(l => l.type === a.type && l.x === a.x && l.y === a.y) ||
    (a.type === 'step' && legalActions().find(l => l.type === 'shove' && l.x === a.x && l.y === a.y)); if (!L) return false;
  G.phase = 'busy'; G.turn++; G.res = { kills:0, hurt:false }; G.verbTurn = L.type === 'swap' || L.type === 'shove'; G.swapped = 0; G.mine = null; G.q = [];
  G.cool = L.type === 'swap' ? SWAP_COOLDOWN : Math.max(0, G.cool-1); G.eventLine = ''; G.hoverOff = true; dismissTip(L.type);
  let lead = 160;
  if (L.type === 'step') { moveEnt(P, L.x, L.y, 130); tone(520,.06,'triangle',.06); }
  else if (L.type === 'swap') { const e = byId(L.id), from = { x:P.x, y:P.y }; G.stats.swaps++;
    moveEnt(P, e.x, e.y, 170, .38); moveEnt(e, from.x, from.y, 170, .38); G.swapped = e.id;   // both arc past each other
    owned().forEach(i => i.onSwap && i.onSwap(G, e, from)); tone(330,.18,'sine',.1,1.8); tone(495,.14,'triangle',.05,1.5,.04); lead = 240;
    if (!G.tut) tip('SWAP RECHARGING - step or wait one turn, then you can swap again.', 'cool', true); }

function drawDiagram(cx, y, c) { const sw = 4*c, gap = 64, x1 = cx-gap/2-sw, x2 = cx+gap/2;

  strip(x1, false); strip(x2, true); txt('>', cx, y+c/2, 26, C.dim);
  txt('1. The Grunt aims at YOUR cell', x1+sw/2, y+c+16, 14, C.text, 'center', 600); txt('2. After the swap, the hit lands on the Archer', x2+sw/2, y+c+16, 14, C.text, 'center', 600); }
function drawStart() { const help = UI.help || UI.screen !== 'start', a = ease((UI.now-UI.t0)/280), cw = Math.min(920, W-40), m = (W-cw)/2, top = Math.max(10, (H-560)/2)+(1-a)*14;

  medalBadge(m+cw-26, top+26, 18, bestMedal || null); txt(`BEST ${best}   WINS ${wins}`, m+cw-56, top+28, 14, C.dim, 'right');

  const sx = m+cwid+32; txt('SCORE  &  LOSING', sx, cy+20, 14, C.gold, 'left', 800); y = cy+46;
  y = wrap('Kills on a turn you SWAPPED score kills x kills (2 = 4, 3 = 9). Enemies that die on other turns score nothing.', sx, y, cwid-32, 14, C.text, 'left', 500, 18)+5;

  else { button('normal', 'NORMAL', m, by+8, 96, 36, { on:!UI.hard }); button('hard', 'HARD', m+104, by+8, 96, 36, { on:UI.hard });

  txt(`H help    R restart    M ${muted ? 'unmute' : 'mute'}    Esc menu`, W/2, H-16, 14, C.dim, 'center', 500); ctx.globalAlpha = 1; }

// ---------- input ----------
function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
  const topH = 106, botH = 160; cs = Math.max(28, Math.min(88, Math.floor(Math.min((W-24)/N, (H-topH-botH)/N)))); bw = N*cs;
  ox = Math.floor((W-bw)/2); oy = topH+Math.max(0, Math.floor((H-topH-botH-bw)/2)); }
function cellAt(mx, my) { const x = Math.floor((mx-ox)/cs), y = Math.floor((my-oy)/cs); return inb(x,y) ? {x,y} : null; }
const btnAt = (mx,my) => UI.btns.find(b => mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h);
function openHelp(v) { if (UI.screen !== 'game') return; UI.help = v; UI.t0 = UI.now; }
function press(id) { tone(520,.06,'sine',.06);
  if (id === 'play') startRun({ tutorial:!UI.tutDone }); else if (id === 'tutorial') startRun({ tutorial:true });
  else if (id === 'normal') UI.hard = false; else if (id === 'hard') UI.hard = true; else if (id === 'resume') openHelp(false); else if (id === 'help') openHelp(true);
  else if (id === 'retry') startRun(); else if (id === 'menu') window.location.href = 'index.html'; else if (id === 'endless') keepGoing();
  else if (id.startsWith('card')) pickItem(+id.slice(4)); }
function onMove(mx, my) { UI.mx = mx; UI.my = my; if (!G || UI.screen !== 'game') return; const c = cellAt(mx,my);
  if (!c || !G.hover || c.x !== G.hover.x || c.y !== G.hover.y) G.hoverOff = false; G.hover = c;
  if (G.tut && G.tut.step === 1 && c && c.x === G.enemies[1].x && c.y === G.enemies[1].y) { G.tut.step = 2; tone(660,.08,'sine',.06); } }
function onDown(mx, my, button = 0) { initAudio(); UI.mx = mx; UI.my = my; const b = btnAt(mx,my); if (b) { UI.down = b.id; return; }
  if (!G || UI.screen !== 'game' || UI.help) return;
  if (button === 2) { G.hoverOff = true; return; }                         // clear the hover preview only
  if (G.phase === 'tutEnd') return startRun(); if (G.phase === 'busy') { G.skip = true; return; }
  if (G.phase !== 'player') return; G.hover = cellAt(mx,my); G.hoverOff = false; if (G.tut && G.tut.step === 1) G.tut.step = 2; act(hoverAction()); }
function onUp(mx, my) { const b = btnAt(mx,my), id = UI.down; UI.down = null; if (b && b.id === id) press(id); }
function onKey(k, e) { initAudio(); const stop = () => e && e.preventDefault && e.preventDefault();
  if (k === 'escape') { window.location.href = 'index.html'; return; } if (k === 'm') return setMute(!muted);
  if (k === 'r') return startRun(G && G.tut ? { tutorial:true } : {});
  if (UI.screen === 'start') { if (k === 'enter' || k === ' ') { stop(); press('play'); } if (k === 't') press('tutorial'); return; }
  if (k === 'h' || k === '?') return openHelp(!UI.help); if (UI.help) { if (k === 'enter' || k === ' ') { stop(); openHelp(false); } return; }
  if (G.tut) { if (k === 'enter' || (G.phase === 'tutEnd' && k === ' ')) { stop(); UI.tutDone = true; store.set('proto_'+GID+'_tut','1'); startRun(); } return; }
  if (G.phase === 'item') { if ('123'.includes(k)) pickItem(+k-1); return; }
  if (G.phase === 'won') { if (k === 'enter') keepGoing(); return; } if (G.phase === 'dead') { if (k === 'enter' && UI.now > G.screenT) startRun(); return; }
  if (k === 'z') { G.hoverOff = true; return; }
  if (k === ' ') { stop(); if (G.phase === 'busy') G.skip = true; else act({ type:'wait', x:P.x, y:P.y }); return; }
  const d = { arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0] }[k];
  if (d) { stop(); act({ type:'step', x:P.x+d[0], y:P.y+d[1] }); } }
cv.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
cv.addEventListener('mouseleave', () => { UI.mx = UI.my = -1; if (G) G.hover = null; });

for (let i = 0; i < 26; i++) UI.motes.push({ x:Math.random(), y:Math.random(), v:.004+Math.random()*.01, p:Math.random()*6, r:.8+Math.random()*1.4, a:.05+Math.random()*.1 });
let last = 0;
function frame(t) { const dt = Math.min(50, (t-last)||16); last = t; update(dt); render(); requestAnimationFrame(frame); }
window.SM = { get G() { return G; }, get geo() { return { ox, oy, cs, W, H }; }, UI, startRun, legalActions, simulate, preview, act, pickItem, keepGoing, update, render, press, onKey, onDown, onUp, onMove, resize, ITEMS, TYPES, STAGES, MODES, MEDALS, medalFor };
resize(); requestAnimationFrame(frame);
