<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PAN - greybox</title>
<style>html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}canvas{display:block;cursor:crosshair;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<script>
'use strict';
// ================= CONFIG (all tuning lives here) =================
const GAMEID = 'pan';
const CFG = {
  R: 220, N: 400,
  wMax: 12, wLerp: 0.1, wDecay: 4,
  drag: 4,          // rate at which grain velocity is pulled toward the water's velocity
  kCent: 0.46,      // centrifugal accel = w^2 * r * kCent / density
  grav: 600, slope: 0.6, // inward accel = grav*slope
  jitter: 100,      // turbulence accel = jitter * w^2 / density (random, per step)
  radDrag: 3, sep: 0.5, spawnR: 0.8, substeps: 2,
  goldN: [5, 8],    // gold grains per pan before upgrades / stage multiplier
  rimWarn: 0.85,    // gold beyond this fraction of the pan radius gets the "about to lose it" pulse
  parBonus: 50, tutGrains: 40
};
// A run = a list of stages (one pan each); the last one is the named finale.
// timer (seconds): the finale's clock - when it runs out the pan banks itself with whatever is in it.
const ST = (name, par, black, fool, flake, nug, goldMul, extra, timer) => ({ name, par, black, fool, flake, nug: nug || 0, goldMul: goldMul || 1, extra: extra || 0, timer: timer || 0 });
const MODES = {
  // NORMAL = tuned for a first-time human: wide green zone, heavy gold, one new grain type per pan. The run always plays all 5 pans; win = total >= target.
  normal: { name: 'NORMAL', target: 1500, lossW: 3, goldD: 7.5, bonusT: 60, medals: [1200, 1500, 2200], tutorial: true,
    blurb: 'NORMAL: 5 pans, earn $1500 in total. Wide safe zone, one new grain type per pan.',
    stages: [ST('QUIET CREEK', 150, 0, 0, 0, 0, 0.8), ST('GRAVEL BAR', 200, 0.15, 0, 0), ST('PYRITE GULCH', 220, 0.2, 4, 0), ST('FLAKE FLATS', 280, 0.22, 4, 8),
             ST('THE GLORY HOLE', 480, 0.3, 8, 10, 1, 1, 80, 60)] },
  // HARD = the original tuning: narrow sweet spot, lighter gold, black sand from pan 1, 8 pans.
  hard: { name: 'HARD', target: 3000, lossW: 4, goldD: 6.5, bonusT: 45, medals: [2000, 3000, 4500], tutorial: false,
    blurb: 'HARD: 8 pans, earn $3000 in total. Original tuning: narrow safe zone, lighter gold.',
    stages: [ST('QUIET CREEK', 140, 0.25, 0, 0), ST('GRAVEL BAR', 150, 0.25, 0, 0), ST('PYRITE GULCH', 150, 0.25, 3, 0), ST('FLAKE FLATS', 180, 0.25, 3, 6),
             ST('SLATE RUN', 200, 0.28, 4, 6), ST('GREEN CANYON', 220, 0.28, 5, 8), ST('LAST BEND', 240, 0.3, 5, 8), ST('THE GLORY HOLE', 800, 0.35, 10, 12, 1, 1.15, 80, 45)] }
};
// ENDLESS (after the victory): every pan must pay its quota, which climbs each pan.
const endlessStage = k => ST('DEEP CLAIM ' + k, 150 + 40 * k, 0.28, 5 + k, 8, k % 2, 1.2, 40);
const COL = { bg: '#0b0d12', player: '#7cf5ff', danger: '#ff5d73', reward: '#ffd166', safe: '#9dff8a', txt: '#e8ecf4', dim: '#aab3c5', card: '#121622', edge: '#232a3d' };
// Grains are MATERIALS, not threats: told apart by shape first, colour second.
// dm = density as a fraction of the mode's gold density (so black sand / fool's gold always sit just under gold's wash-out speed).
const TYPES = {
  sand:  { d: 1,   val: 0,   col: '#e2d2ab', edge: '#a8976f', r0: 6.0, r1: 7.4, label: 'sand' },
  black: { d: 2.5, dm: 0.6,  val: 0,   col: '#1e242f', edge: '#0c0f15', r0: 5.6, r1: 6.8, label: 'black sand' },
  fool:  { d: 4,   dm: 0.8,  val: -8,  col: '#b5d334', edge: '#55660c', r0: 5.6, r1: 6.2, label: "fool's -$8" },
  flake: { d: 3.5, dm: 0.45, val: 5,   col: '#ffe08a', edge: '#7a5200', r0: 4.2, r1: 4.8, label: 'flake $5' },
  gold:  { d: 6,   val: 10,  col: '#ffd166', edge: '#7a5200', r0: 6.0, r1: 7.0, label: 'gold $10' },
  nug:   { d: 10,  val: 100, col: '#ffc233', edge: '#7a5200', r0: 12,  r1: 13,  label: 'nugget $100' }
};
const ORDER = ['sand', 'black', 'fool', 'flake', 'gold', 'nug'];
// Upgrades: one data row + one rule hook each. how:true = changes HOW you play.
const UPG = [
  { id: 'riffle', name: 'Riffled Pan',  base: 90,  max: 2, desc: 'Gold grips the pan: the DANGER zone starts later.', why: 'Safer fast washing.' },
  { id: 'bigger', name: 'Bigger Pan',   base: 120, max: 2, desc: '+60 grains of dirt and +1 gold in every pan.', why: 'More gold = more pay.' },
  { id: 'deep',   name: 'Deeper Pan',   base: 110, max: 2, desc: 'Gold danger threshold +1 swirl speed.', why: 'Widens the green zone.' },
  { id: 'rich',   name: 'Rich Dirt',    base: 90,  max: 2, desc: '+2 gold per pan, but gold is lighter and flies sooner.', why: 'Risky: big pay if you stay gentle.' },
  { id: 'magnet', name: 'Magnet',       base: 260, max: 1, how: true, tool: true, desc: 'TOOL, once per pan: pulls out HALF the black sand.', why: 'Instant purity boost.' },
  { id: 'sluice', name: 'Sluice Gate',  base: 160, max: 1, how: true, tool: true, desc: 'TOOL, once per pan: for 2s EVERYTHING in the outer third pours out.', why: 'Fast - but check no gold is out there.' },
  { id: 'tap',    name: 'Tap the Pan',  base: 120, max: 1, how: true, tool: true, desc: 'TOOL, 3 per pan: a knock that jolts all gold toward the middle.', why: 'A rescue button for pulsing gold.' },
  { id: 'brake',  name: 'Brake Paddle', base: 60,  max: 1, how: true, desc: 'Let go of the mouse and the water stops almost at once.', why: 'Bail out of the red zone instantly.' },
  { id: 'net',    name: 'Catch Net',    base: 100, max: 2, how: true, desc: 'The first gold to fly out each pan is caught and put back.', why: 'Lets you push closer to red.' },
  { id: 'watch',  name: 'Stopwatch',    base: 130, max: 1, desc: 'Speed bonus starts at x1.7 instead of x1.4.', why: 'Rewards quick pans.' },
  { id: 'assay',  name: 'Assayer',      base: 170, max: 1, desc: 'Purity bonus goes up to x6.5 instead of x5.', why: 'Rewards clean pans.' },
  { id: 'slurry', name: 'Wet Slurry',   base: 80,  max: 1, desc: 'Sand is lighter and washes out faster.', why: 'Saves time on every pan.' },
  { id: 'stake',  name: 'Stake the Claim', base: 150, max: 1, desc: 'Pay now: THE GLORY HOLE (final pan) pays x1.5.', why: 'Spend now, cash in at the finale.' }
];
const TOOLS = ['magnet', 'sluice', 'tap'];
const price = (u, lvl) => Math.round(u.base * Math.pow(1.8, lvl));

// ================= STATE =================
const G = { state: 'start', stAt: 0, help: false, mode: 'normal', pan: 1, stage: null, money: 0, earned: 0, best: 0, w: 0, phase: 0, t: 0, panT: 0, runT: 0,
  R: CFG.R, lossW: 3, deep: 0, dW: 12, rimGold: 0, goldD: 6, gold0: 0, flake0: 0, shake: 0, up: {}, count: null, buttons: [], offer: [], rerolls: 0,
  lostGold: 0, won: false, over: null, stat: null, everSwirled: false, tut: null, tools: {}, sluiceT: 0, netLeft: 0, muted: false, newMedal: false, pressId: null, pressT: 0 };
let P = [], FX = [], TXT = [], RINGS = [];
const inp = { down: false, lastA: null, acc: 0, override: null, x: -99, y: -99, total: 0 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 800, H = 600, SC = 1, CX = 400, CY = 300, GA = 1;
const L = { mw: 500, px: 0, py: 100, pw: 0, ph: 0 };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const mode = () => MODES[G.mode];
const nStages = () => mode().stages.length;
const isGoldy = p => p.type === 'gold' || p.type === 'nug';
function setState(s) { G.state = s; G.stAt = G.t; }
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} } };

// ================= TIPS (first-time, fixed area, 6s or until the relevant action) =================
const TIPS = { q: [], seen: {} };
function tip(key, s, opt) {
  if (TIPS.seen[key]) return; TIPS.seen[key] = 1;
  const t = { key, s, t: 6 };
  if (opt && opt.urgent) TIPS.q.unshift(t); else TIPS.q.push(t);
  if (TIPS.q.length > 3) TIPS.q.length = 3;
}
function clearTip(key) { TIPS.q = TIPS.q.filter(t => t.key !== key); }
function updateTips(dt) { if (TIPS.q.length && !(G.tut && G.tut.step < 2)) { TIPS.q[0].t -= dt; if (TIPS.q[0].t <= 0) TIPS.q.shift(); } }

// ================= AUDIO (soft sine/triangle, master gain, M = mute) =================
let ac = null, master = null, nGain = null, nFilt = null, lastTick = 0;
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
function initAudio() {
  if (ac) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = G.muted ? 0 : 0.5; master.connect(ac.destination);
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    nFilt = ac.createBiquadFilter(); nFilt.type = 'bandpass'; nFilt.frequency.value = 600; nFilt.Q.value = 0.7;
    nGain = ac.createGain(); nGain.gain.value = 0;
    src.connect(nFilt); nFilt.connect(nGain); nGain.connect(master); src.start();
  } catch (e) { ac = null; }
}
function toggleMute() { G.muted = !G.muted; ls.set('proto_mute', G.muted ? '1' : '0'); if (master) master.gain.setTargetAtTime(G.muted ? 0 : 0.5, ac.currentTime, 0.02); }
function blip(f0, f1, dur, type, vol, delay) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (delay || 0);
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
const note = i => 330 * Math.pow(2, PENTA[clamp(i, 0, PENTA.length - 1)] / 12);
function sndTick(d) { if (G.t - lastTick < 0.04) return; lastTick = G.t; blip(rnd(1200, 1800) / Math.sqrt(d), 600, 0.05, 'sine', 0.05); }
function sndGoldLost() { blip(392, 196, 0.4, 'triangle', 0.2); blip(294, 147, 0.5, 'sine', 0.16, 0.08); }
function sndGood() { blip(660, 990, 0.15, 'sine', 0.12); }
function sndChime(i) { blip(note(i), note(i), 0.22, 'sine', 0.12); }
function sndBuy() { blip(note(2), note(2), 0.12, 'triangle', 0.12); blip(note(5), note(5), 0.18, 'triangle', 0.12, 0.08); }
function sndClick() { blip(520, 480, 0.06, 'sine', 0.08); }
function sndClear() { [0, 2, 4, 5, 7].forEach((n, i) => blip(note(n), note(n), 0.3, 'triangle', 0.13, i * 0.08)); }
function sndWin() { [0, 2, 4, 5, 7, 9, 10].forEach((n, i) => blip(note(n), note(n), 0.45, 'triangle', 0.13, i * 0.1)); }
function sndDefeat() { [4, 2, 1, 0].forEach((n, i) => blip(note(n) / 2, note(n) / 2, 0.5, 'sine', 0.12, i * 0.16)); }
function updateAudio() {
  if (!ac) return;
  const live = G.state === 'pan' && !G.help;
  const a = live || G.state === 'count' ? Math.abs(G.w) / CFG.wMax : 0, on = live ? 1 : 0.3;
  nGain.gain.setTargetAtTime(a * a * 0.35 * on + a * 0.04, ac.currentTime, 0.05);
  nFilt.frequency.setTargetAtTime(350 + a * 1800, ac.currentTime, 0.05);
}

// ================= RUN / PAN SETUP =================
function loadBest() { G.best = +ls.get('proto_' + GAMEID + '_best') || 0; }
function saveProgress() {
  if (G.earned > G.best) { G.best = G.earned; ls.set('proto_' + GAMEID + '_best', G.best); }
  const names = ['', 'bronze', 'silver', 'gold'], cur = names.indexOf(ls.get('proto_' + GAMEID + '_medal') || ''), m = medal();
  if (m > Math.max(0, cur)) { ls.set('proto_' + GAMEID + '_medal', names[m]); G.newMedal = true; }
}
function setMode(m) { if (MODES[m] && G.state === 'start') G.mode = m; }
function startRun() {
  G.pan = 1; G.money = 0; G.earned = 0; G.runT = 0; G.up = {}; UPG.forEach(u => G.up[u.id] = 0);
  G.won = false; G.over = null; G.help = false; G.rerolls = 0; G.newMedal = false;
  G.stat = { gold0: 0, goldLost: 0, puritySum: 0, tbSum: 0, pans: 0, foolBanked: 0, cleared: 0, bestPan: 0 };
  TIPS.q = [];
  G.tut = mode().tutorial && ls.get('proto_' + GAMEID + '_tut') !== '1' ? { step: 0, washed: 0, hold: 0 } : null;
  loadBest(); newPan();
}
function addGrain(type, d, rScale) {
  const T = TYPES[type], a = rnd(0, Math.PI * 2), r = Math.sqrt(Math.random()) * G.R * CFG.spawnR * (type === 'nug' ? 0.4 : 1);
  P.push({ type, d: d || T.d, r: rnd(T.r0, T.r1) * (rScale || 1), x: Math.cos(a) * r, y: Math.sin(a) * r,
    vx: 0, vy: 0, ph: rnd(0, 6.28), mag: false, cell: -1, dead: false });
}
function stageFor(pan) { const s = mode().stages; return pan <= s.length ? s[pan - 1] : endlessStage(pan - s.length); }
function newPan() {
  const up = G.up, M = mode(), S = G.stage = stageFor(G.pan); P = []; FX = []; TXT = []; RINGS = [];
  G.R = CFG.R + 20 * up.bigger; G.lossW = M.lossW; G.deep = up.deep; G.goldD = M.goldD * (up.rich ? 0.85 : 1);   // Rich Dirt: gold lighter, dirt unchanged
  const n = CFG.N + 60 * up.bigger + S.extra, nGold = Math.round((Math.round(rnd(CFG.goldN[0], CFG.goldN[1])) + 1 * up.bigger + 2 * up.rich) * S.goldMul);
  const nBlack = Math.round(n * S.black), rest = Math.max(0, n - nGold - S.fool - S.flake - S.nug - nBlack);
  for (let i = 0; i < rest; i++) addGrain('sand', up.slurry ? 0.7 : 1);
  for (let i = 0; i < nBlack; i++) addGrain('black', M.goldD * TYPES.black.dm);
  for (let i = 0; i < S.fool; i++) addGrain('fool', M.goldD * TYPES.fool.dm);
  for (let i = 0; i < S.flake; i++) addGrain('flake', M.goldD * TYPES.flake.dm);
  for (let i = 0; i < nGold; i++) addGrain('gold', G.goldD, up.rich ? 0.9 : 1);
  for (let i = 0; i < S.nug; i++) addGrain('nug', G.goldD * 1.5);
  G.gold0 = nGold + S.nug; G.flake0 = S.flake; G.lostGold = 0; G.panT = 0; G.w = 0; G.shake = 0; G.count = null; G.sluiceT = 0; G.timeUp = false;
  G.tools = { magnet: up.magnet ? 1 : 0, sluice: up.sluice ? 1 : 0, tap: up.tap ? 3 : 0 }; G.netLeft = up.net;
  setState('pan'); resize();
  for (let i = 0; i < 400; i++) physics(1 / 120);   // let the dirt settle
  G.dW = computeDanger();
  if (S.timer) tip('finale', 'FINALE: ' + S.name + ' - fine gold, lots of fool\'s gold, and a ' + S.timer + ' second clock. When it runs out the pan banks itself.', { urgent: true });
  if (S.black && G.pan > 1) tip('black', 'NEW: Black sand (dark grains) - heavier than sand, it needs a faster swirl to wash out.');
  if (S.fool) tip('fool', "NEW: Fool's gold (green SQUARES) - costs $8 each if banked. Wash it out near the top of the green zone.");
  if (S.flake) tip('flake', 'NEW: Gold flakes (small diamonds) - $5 each, but light: they wash out high in the green zone. Your call.');
  if (S.nug) tip('nug', 'NEW: A NUGGET - worth $100. It is heavy, but do not let it reach the rim!');
  if (G.pan > nStages()) tip('endless', 'ENDLESS: every pan must now pay at least its quota (top-left) or the run ends.');
}
const goldHold = () => CFG.grav * CFG.slope * (1 + 0.35 * G.up.riffle);
// Swirl speed at which the OUTERMOST gold grain starts to slide outward = where the gauge's DANGER zone begins.
function computeDanger() {
  const hold = goldHold(); let m = CFG.wMax, rim = 0;
  for (const p of P) if (isGoldy(p) && !p.dead) {
    const r0 = Math.hypot(p.x, p.y), r = Math.max(r0, 0.25 * G.R), wd = G.deep + Math.sqrt(hold * p.d / (CFG.kCent * r));
    if (wd < m) m = wd; if (r0 > CFG.rimWarn * G.R) rim++;
  }
  G.rimGold = rim;
  return clamp(m, G.lossW + 0.6, CFG.wMax);
}
const zone = () => { const aw = Math.abs(G.w); return aw < G.lossW ? 0 : aw < G.dW ? 1 : 2; };
function counts() {
  const c = { sand: 0, black: 0, fool: 0, flake: 0, gold: 0, nug: 0, total: 0 };
  for (const p of P) if (!p.mag) { c[p.type]++; c.total++; }
  c.goldy = c.gold + c.nug; c.purity = c.total ? (c.goldy + c.flake) / c.total : 0; return c;
}
function timeBonus() { const t0 = G.up.watch ? 1.7 : 1.4; return Math.max(1, t0 - (t0 - 1) * G.panT / mode().bonusT); }
function payoutNow() {
  const c = counts(); let value = 0; for (const k of ORDER) value += c[k] * TYPES[k].val;
  const pm = 1 + c.purity * (G.up.assay ? 5.5 : 4), tb = timeBonus(), sk = G.up.stake && G.pan === nStages() ? 1.5 : 1;
  return { c, value, pm, tb, sk, total: Math.max(0, Math.round(value * pm * tb * sk)) };
}

// ================= PHYSICS =================
const CELL = 26; let gridW = 0, head = null, next = null;
function buildGrid() {
  const off = G.R + 20, n = P.length; gridW = Math.ceil(off * 2 / CELL) + 1;
  if (!head || head.length !== gridW * gridW) head = new Int32Array(gridW * gridW);
  if (!next || next.length < n) next = new Int32Array(n + 64);
  head.fill(-1);
  for (let i = 0; i < n; i++) {
    const p = P[i]; if (p.mag) { p.cell = -1; continue; }
    const gx = clamp(((p.x + off) / CELL) | 0, 0, gridW - 1), gy = clamp(((p.y + off) / CELL) | 0, 0, gridW - 1);
    p.cell = gy * gridW + gx; next[i] = head[p.cell]; head[p.cell] = i;
  }
}
function separate() {
  for (let i = 0; i < P.length; i++) {
    const p = P[i]; if (p.cell < 0) continue;
    const gx = p.cell % gridW, gy = (p.cell / gridW) | 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const x = gx + ox, y = gy + oy; if (x < 0 || y < 0 || x >= gridW || y >= gridW) continue;
      for (let j = head[y * gridW + x]; j >= 0; j = next[j]) {
        if (j <= i) continue;
        const q = P[j], dx = q.x - p.x, dy = q.y - p.y, min = p.r + q.r, d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d, ov = (min - d) * CFG.sep;
        const wi = q.d / (p.d + q.d), wj = 1 - wi;      // light grains yield to heavy ones
        p.x -= nx * ov * wi; p.y -= ny * ov * wi; q.x += nx * ov * wj; q.y += ny * ov * wj;
        const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
        if (rv < 0) { const im = rv * 0.6; p.vx += nx * im * wi; p.vy += ny * im * wi; q.vx -= nx * im * wj; q.vy -= ny * im * wj; }
      }
    }
  }
}
function physics(dt) {
  const R = G.R, w = G.w, w2 = w * w, aw = Math.abs(w), fast = aw > G.lossW, tutSafe = G.tut && G.tut.step < 2, sluice = G.sluiceT > 0;
  const wg = Math.max(0, aw - G.deep), w2g = wg * wg;      // Deeper Pan: gold feels the swirl as if it were slower
  const baseIn = CFG.grav * CFG.slope, rif = 1 + 0.35 * G.up.riffle, damp = Math.exp(-0.5 * dt);
  for (const p of P) {
    if (p.mag) {  // being dragged out by the magnet
      const mx = R * 0.85 - p.x, my = -R * 0.85 - p.y, m = Math.hypot(mx, my) || 1;
      p.vx += mx / m * 1800 * dt; p.vy += my / m * 1800 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (m < 24) { p.dead = true; splash(p, 1); sndTick(1); }
      continue;
    }
    const gy = isGoldy(p);
    const r = Math.hypot(p.x, p.y), jit = w2 * CFG.jitter / p.d;
    if (r < 1) {   // at the very centre the angle is meaningless: plain cartesian step
      p.vx += ((-p.vx) * CFG.drag + (Math.random() - 0.5) * jit) * dt; p.vy += ((-p.vy) * CFG.drag + (Math.random() - 0.5) * jit) * dt;
      p.vx *= damp; p.vy *= damp; p.x += p.vx * dt; p.y += p.vy * dt; continue;
    }
    const nx = p.x / r, ny = p.y / r, tx = -ny, ty = nx;
    let vr = p.vx * nx + p.vy * ny, vt = p.vx * tx + p.vy * ty;
    const ar = (gy ? w2g : w2) * r * CFG.kCent / p.d                      // centrifugal (density-scaled): this is what washes grains outward
      - baseIn * (gy ? rif : 1) * Math.min(1, r / 14)                     // pan slope pulls everything to the middle
      - vr * (CFG.drag + CFG.radDrag);                                    // water has no radial flow + grains creep radially through the bed
    vr += (ar + (Math.random() - 0.5) * jit) * dt;

const DIA = (() => { // fixed pseudo-random diagram grains (so the picture never flickers)

})();

  });

  ctx.restore();
}

function pointerAngle(e) {
  const dx = e.clientX - CX, dy = e.clientY - CY;
  return Math.hypot(dx, dy) < 18 * SC ? null : Math.atan2(dy, dx);   // too close to the centre: angle is noise
}
window.addEventListener('pointerdown', e => {
  initAudio(); if (ac && ac.state === 'suspended') ac.resume();
  inp.x = e.clientX; inp.y = e.clientY;
  for (let i = G.buttons.length - 1; i >= 0; i--) { const b = G.buttons[i]; if (hover(b.x, b.y, b.w, b.h)) { G.pressId = b.id; G.pressT = 0.14; if (b.id !== 'proceed') sndClick(); b.fn(); return; } }

});
window.addEventListener('pointermove', e => {

  if (!inp.down) return;
  const a = pointerAngle(e);
  if (a !== null && inp.lastA !== null) { let da = a - inp.lastA; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI; inp.acc += da; inp.total += Math.abs(da); }
  inp.lastA = a;
});
const release = () => { inp.down = false; inp.lastA = null; };
window.addEventListener('pointerup', release); window.addEventListener('pointercancel', release); window.addEventListener('blur', release);
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { toMenu(); return; }
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if (k === 'h' || k === 'H' || k === '?') { toggleHelp(); return; }
  if (k === 'r' || k === 'R') { initAudio(); startRun(); return; }
  if (G.help) return;
  if (k === ' ' || k === 'Enter') {
    e.preventDefault(); initAudio();
    if (G.state === 'start') startGame();
    else if (G.state === 'pan') { if (k === ' ') bank(); }
    else if (G.state === 'count') proceed();
    else if (G.state === 'shop') nextPan();
  }
