<script>
'use strict';
// Three mouse-controlled arena loops in one file: BAIT (gate herding), CINCH (trail lasso), TOWLINE (tow flail).

const FONT='"Segoe UI Variable Display","Segoe UI",ui-rounded,system-ui,sans-serif';

 p:null,enemies:[],parts:[],rings:[],texts:[],booms:[],gates:[],gateTimer:0,trail:[],flashes:[],ball:null,depot:null,depotTimer:0,boss:null,decoy:null,echo:null,ghost:null,

let AC=null,MG=null;
function initAudio(){if(AC)return;const Ac=window.AudioContext||window.webkitAudioContext;if(!Ac)return;try{AC=new Ac();MG=AC.createGain();MG.gain.value=G.muted?0:0.5;MG.connect(AC.destination);}catch(e){AC=null;}}
function setMute(m){G.muted=!!m;lsSet('proto_mute',G.muted?'1':'0');if(MG)MG.gain.value=G.muted?0:0.5;}
function tone(f,d,type,v,when){if(!AC)return;try{const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.12,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function noise(d,v,fc){if(!AC)return;try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||900;const g=AC.createGain();g.gain.value=v||0.2;s.connect(f);f.connect(g);g.connect(MG);s.start();}catch(e){}}
const PENT=[0,2,4,7,9,12,14,16,19,21,24],pent=(n,base)=>(base||220)*Math.pow(2,PENT[clamp(n|0,0,PENT.length-1)]/12);
const sfx={ui(){tone(660,0.06,'sine',0.06);},blast(){noise(0.25,0.35,600);tone(110,0.3,'triangle',0.2);},chain(n){tone(pent(n%11,330),0.1,'triangle',0.1);},
 loop(n){for(let q=0;q<Math.min(n,10);q++)tone(pent(q,262),0.12,'triangle',0.09,q*0.045);},miss(){tone(196,0.08,'sine',0.05);},kill(n){tone(pent(n%8,262),0.08,'triangle',0.08);},
 bank(){for(let q=0;q<7;q++)tone(pent(q+2,262),0.16,'sine',0.1,q*0.06);},hurt(){noise(0.3,0.4,400);tone(98,0.35,'triangle',0.18);},cut(){tone(880,0.05,'sine',0.05);},
 clear(){[0,4,7,12].forEach((s,i)=>tone(330*Math.pow(2,s/12),0.35,'sine',0.12,i*0.1));},win(){[0,4,7,12,16,19].forEach((s,i)=>tone(262*Math.pow(2,s/12),0.5,'sine',0.12,i*0.12));},
 lose(){[7,3,0].forEach((s,i)=>tone(196*Math.pow(2,s/12),0.5,'triangle',0.12,i*0.22));},warn(){tone(330,0.12,'triangle',0.07);},boss(){tone(65,0.6,'triangle',0.2);noise(0.4,0.3,300);}};

  finale:'THE STAMPEDE'},

 cutter:{label:'CUTTER',r:10,sp:0.8,hp:1,col:RED,tip:'severs your trail on touch. Close loops fast, away from it.'},
 mine:{label:'MINE',r:11,sp:0,hp:1,col:RED,tip:'sits still and hurts. The ball kills it at ANY speed for +2 mass.'},
 shredder:{label:'THE SHREDDER',r:30,sp:0.45,hp:2,col:'#e0455e',boss:true,tip:'loop it TWICE. It shreds your trail like a cutter.'},
 anchor:{label:'THE ANCHOR',r:34,sp:0.35,hp:3,col:'#e0455e',boss:true,tip:'ram it 3x with a GOLD ball of 20+ mass. Banking at a depot drops your mass!'},
};

 bait:[{name:'FIRST HERD',quota:18,rate:1.0,types:{chaser:1}},
       {name:'DARTERS',quota:24,rate:1.2,types:{chaser:4,darter:1},intro:'darter'},
       {name:'ORBITERS',quota:30,rate:1.25,types:{chaser:4,darter:1,orbiter:1},intro:'orbiter'},
       {name:'BRUTES',quota:30,rate:1.3,types:{chaser:5,darter:1,orbiter:1,brute:1},intro:'brute'},
       {name:'THE STAMPEDE',quota:50,rate:3.0,types:{chaser:5,darter:1},boss:'stampede'}],
 cinch:[{name:'FIRST HERD',quota:18,rate:1.0,types:{chaser:1}},
       {name:'CUTTERS',quota:26,rate:1.2,types:{chaser:4,cutter:1},intro:'cutter'},
       {name:'DARTERS',quota:34,rate:1.4,types:{chaser:4,cutter:1,darter:1},intro:'darter'},
       {name:'BRUTES',quota:42,rate:1.55,types:{chaser:5,cutter:1,darter:1,brute:1},intro:'brute'},
       {name:'THE SHREDDER',quota:2,rate:1.1,types:{chaser:4,cutter:1},boss:'shredder'}],
 towline:[{name:'FIRST HERD',quota:14,rate:0.9,types:{chaser:1}},
       {name:'MINES',quota:22,rate:1.1,types:{chaser:5,mine:1},intro:'mine'},
       {name:'DARTERS',quota:28,rate:1.3,types:{chaser:5,mine:1,darter:1},intro:'darter'},
       {name:'BRUTES',quota:32,rate:1.35,types:{chaser:6,mine:1,darter:1,brute:1},intro:'brute'},
       {name:'THE ANCHOR',quota:3,rate:1.0,types:{chaser:8,darter:1},boss:'anchor'}],
};
function waveDef(mode,n){const T=WAVES[mode];if(n<=T.length)return T[n-1];const k=n-T.length;return{name:'ENDLESS '+k,quota:40+10*k,rate:1.8+0.25*k,types:Object.assign({},T[3].types),endless:k};}

const TIPS={firstHit:'Ouch. You are invulnerable for a moment - use it to get clear.',firstPick:'Pick ONE upgrade (click or 1 / 2 / 3). It lasts the whole run.',

// ---------- geometry helpers ----------
function segInt(a,b,c,d){const rX=b.x-a.x,rY=b.y-a.y,sX=d.x-c.x,sY=d.y-c.y,den=rX*sY-rY*sX;if(Math.abs(den)<1e-9)return null;
 const u=((c.x-a.x)*rY-(c.y-a.y)*rX)/den,v=((c.x-a.x)*sY-(c.y-a.y)*sX)/den;return(v>=0&&v<=1&&u>=0&&u<=1)?{x:a.x+v*rX,y:a.y+v*rY}:null;}
function inPoly(p,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)inside=!inside;}return inside;}
function distToSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;let k=l2?((p.x-a.x)*dx+(p.y-a.y)*dy)/l2:0;k=clamp(k,0,1);return Math.hypot(p.x-(a.x+k*dx),p.y-(a.y+k*dy));}
function burst(x,y,col,n,sp){for(let i=0;i<(n||8)&&G.parts.length<500;i++){const a=rand(0,TAU),s=rand((sp||200)*0.3,sp||200);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.2,0.45),col});}}
function ring(x,y,max,col,life){G.rings.push({x,y,r:4,max,life:life||0.3,max0:life||0.3,col});}
function floatText(x,y,str,col,size){const p=G.p;if(p&&Math.hypot(x-p.x,y-p.y)<60){y=p.y-52;}G.texts.push({x:clamp(x,A.x+60,A.x+A.w-60),y:clamp(y,A.y+20,A.y+A.h-10),str,col:col||'#fff',life:1.2,size:size||16});}
function tip(id,text){if(G.seen[id])return;G.seen[id]=1;G.tip={text,t:6};}
function pop(e,col){burst(e.x,e.y,col,e.r>14?12:7,220);ring(e.x,e.y,e.r*3+10,col,0.25);}
const inR=r=>r&&G.mx>=r.x&&G.mx<=r.x+r.w&&G.my>=r.y&&G.my<=r.y+r.h;
const bossWave=()=>!!waveDef(G.mode,G.wave).boss;
const scoreMul=()=>has('greed')?1.5:1;
function addScore(n){G.score+=Math.round(n*scoreMul());}

// ---------- run control ----------
function toMenu(){G.phase='menu';G.help=false;G.tut=null;G.phT=0;}
function toStart(m){if(m)G.mode=m;G.phase='start';G.help=false;G.tut=null;G.phT=0;}
function setHard(h){G.hard=!!h;lsSet(GAMEID+'_hard',G.hard?'1':'0');sfx.ui();}
function begin(){if(G.tutDone[G.mode])startRun();else startTutorial();}
function resetField(){const p={x:A.x+A.w/2,y:A.y+A.h/2,px:0,py:0,vx:0,vy:0,inv:1.2,head:0};p.px=p.x;p.py=p.y;G.p=p;
 G.enemies=[];G.parts=[];G.rings=[];G.texts=[];G.booms=[];G.gates=[];G.gateTimer=0;G.trail=[];G.flashes=[];G.depot=null;G.boss=null;G.decoy=null;G.echo=null;G.ghost=null;
 G.ball={x:p.x-60,y:p.y,vx:0,vy:0,mass:0,r:10,speed:0,ws:0};G.depotTimer=has('sticky')?5:8;G.freeze=0;G.shake=0;G.spawnAcc=0;G.banner=null;}
function startRun(){G.tut=null;G.help=false;G.endless=false;G.owned=[];G.wave=0;G.cleared=0;G.score=0;G.lives=G.hard?3:5;G.t=0;G.tip=null;G.newMedal=false;G.overWhy='';G.lastHurt='';G.intT=0;
 G.stats={bestChain:0,bestLoop:0,bestBank:0,hits:0};G.seenType={};resetField();G.phase='play';G.phT=0;startWave(1);}
function startWave(n){G.wave=n;const d=waveDef(G.mode,n);G.quota=d.quota;G.kills=0;G.waveT=0;G.graceT=1.5;G.spawnAcc=0;G.enemies=[];G.booms=[];G.boss=null;G.decoy=null;G.echo=null;
 if(G.mode==='bait'){G.gates=[];const ng=d.boss?1:(has('rush')?4:3);for(let i=0;i<ng;i++)spawnGate(!!d.boss);}
 if(G.mode==='cinch')G.trail=[];
 if(G.mode==='towline'){G.depot=null;G.depotTimer=has('sticky')?4:6;}
 G.banner={text:(d.boss?'FINALE: ':d.endless?'':'WAVE '+n+': ')+d.name,sub:d.boss?bossSub():d.intro?'NEW: '+ET[d.intro].label+' - '+ET[d.intro].tip:'Kill '+d.quota+' to clear the wave',t:3.2,col:d.boss?RED:MODES[G.mode].col};
 if(d.boss==='shredder'||d.boss==='anchor'){const e=spawnEnemy(d.boss,true);e.inv=2;G.boss=e;sfx.boss();}
 if(d.boss==='stampede')sfx.boss();}
function bossSub(){return G.mode==='bait'?'A huge herd and ONE moving gate. Blast 50.':G.mode==='cinch'?'Loop THE SHREDDER twice. Cutters keep coming.':'Ram THE ANCHOR 3x with a GOLD ball of 20+ mass.';}
function endWave(){G.phase='clear';G.clearT=0;G.cleared++;sfx.clear();for(const e of G.enemies){pop(e,GREY);}G.enemies=[];G.booms=[];G.decoy=null;G.echo=null;G.banner={text:'WAVE '+G.wave+' CLEAR',sub:'',t:1.4,col:GRN};}
function toPick(){const pool=UPG.filter(u=>(u.modes==='all'||u.modes===G.mode)&&(u.repeat||!has(u.id)));G.choices=[];
 while(G.choices.length<3&&pool.length){const i=Math.floor(Math.random()*pool.length);G.choices.push(pool.splice(i,1)[0]);}G.phase='pick';G.pickT=0;G.phT=0;tip('firstPick',TIPS.firstPick);}
function pickMod(k){if(G.phase!=='pick'||!G.choices[k])return false;const u=G.choices[k];G.owned.push(u.id);
 if(u.id==='life')G.lives++;if(u.id==='greed')G.lives=Math.max(1,G.lives-1);if(u.id==='rush'&&G.mode==='bait')while(G.gates.length<4)spawnGate(false);
 sfx.ui();resetFieldSoft();G.phase='play';G.phT=0;startWave(G.wave+1);return true;}
function resetFieldSoft(){const p=G.p;p.x=A.x+A.w/2;p.y=A.y+A.h/2;p.px=p.x;p.py=p.y;p.vx=p.vy=0;p.inv=1.5;G.parts=[];G.rings=[];G.texts=[];G.trail=[];G.flashes=[];G.ball.x=p.x-60;G.ball.y=p.y;G.ball.vx=G.ball.vy=0;}
function keepGoing(){if(G.phase!=='win')return false;G.endless=true;toPick();return true;}
function die(by){G.phase='dead';G.phT=0;G.overWhy=by;saveMeta(false);sfx.lose();}
function winRun(){G.phase='win';G.phT=0;G.cleared=Math.max(G.cleared,WIN_AT);saveMeta(true);sfx.win();}
function medal(){const c=G.cleared;return c>=5?['GOLD',GOLD]:c>=3?['SILVER','#d5dbe8']:c>=1?['BRONZE','#d08a4e']:null;}
function saveMeta(won){const m=G.mode,rank={bronze:1,silver:2,gold:3};
 if(G.score>G.best[m]){G.best[m]=G.score;lsSet('proto_'+GAMEID+'_'+m+'_best',G.score);}
 const md=medal();if(md&&(rank[md[0].toLowerCase()]||0)>(rank[G.medals[m]]||0)){G.medals[m]=md[0].toLowerCase();lsSet('proto_'+GAMEID+'_'+m+'_medal',G.medals[m]);G.newMedal=true;}
 if(won&&!G.endless){G.wins[m]++;lsSet('proto_'+GAMEID+'_'+m+'_wins',G.wins[m]);}
 // aggregate keys read by the collection menu
 let bestMedal='',sum=0,wins=0;for(const k of ORDER){sum+=G.best[k];wins+=G.wins[k];if((rank[G.medals[k]]||0)>(rank[bestMedal]||0))bestMedal=G.medals[k];}
 lsSet('proto_'+GAMEID+'_best',sum);lsSet('proto_'+GAMEID+'_wins',wins);if(bestMedal)lsSet('proto_'+GAMEID+'_medal',bestMedal);}

// ---------- tutorial (harmless; the player must perform the verb once) ----------
function startTutorial(){G.help=false;G.endless=false;G.owned=[];G.wave=1;G.cleared=0;G.score=0;G.lives=G.hard?3:5;G.t=0;G.tip=null;G.seenType={};resetField();
 G.tut={step:1,t:0,done:0};G.phase='play';G.phT=0;G.quota=waveDef(G.mode,1).quota;G.kills=0;
 const p=G.p;const dummy=(dx,dy)=>{const e=spawnEnemy('chaser',true);e.x=p.x+dx;e.y=p.y+dy;e.speed*=0.55;e.dummy=true;return e;};
 if(G.mode==='bait'){G.gates=[{x:p.x+180,y:p.y,ang:Math.PI/2,rot:0,vx:0,vy:0,half:55,cool:0,inside:0}];dummy(-160,-60);dummy(-200,20);dummy(-170,80);}
 if(G.mode==='cinch'){dummy(150,-40);dummy(180,30);dummy(140,70);for(const e of G.enemies)e.speed*=0.35;}
 if(G.mode==='towline'){dummy(150,-90);dummy(190,10);dummy(150,90);for(const e of G.enemies)e.speed*=0.12;}}
function tutText(){const t=G.tut,m=G.mode;if(!t)return'';
 if(t.step===3)return'Nice! Wave 1 starts in '+Math.ceil(t.t)+'...';
 if(m==='bait')return'TUTORIAL: fly THROUGH the green beam between the two RED posts - the dummies chasing you will blow up.';
 if(m==='cinch')return'TUTORIAL: fly a circle around the 3 dummies and cross your own trail to close the loop.';
 return t.step===1?'TUTORIAL: turn sharply so the ball whips through a dummy. GOLD ball = fast enough to kill.':'TUTORIAL: now drag the ball onto the green DEPOT to bank your mass (mass x mass points).';}
function tutAdvance(){const t=G.tut;if(!t)return;if(G.mode==='towline'&&t.step===1){t.step=2;G.depot={x:G.p.x+(G.p.x<A.x+A.w/2?200:-200),y:G.p.y,r:58,life:99};return;}t.step=3;t.t=3;}
function endTutorial(){G.tutDone[G.mode]=true;lsSet(GAMEID+'_tut_'+G.mode,'1');startRun();}

// ---------- spawning ----------
function spawnEnemy(type,manual){const T=ET[type];let x,y;
 if(type==='mine'){let tries=0;do{x=rand(A.x+40,A.x+A.w-40);y=rand(A.y+40,A.y+A.h-40);}while(Math.hypot(x-G.p.x,y-G.p.y)<170&&++tries<20);}
 else{let tries=0;do{const side=Math.floor(rand(0,4));x=side===0?A.x-24:side===1?A.x+A.w+24:rand(A.x,A.x+A.w);y=side===2?A.y-24:side===3?A.y+A.h+24:rand(A.y,A.y+A.h);}while(G.p&&Math.hypot(x-G.p.x,y-G.p.y)<200&&++tries<12);}
 const slow=has('slow')?0.9:1;
 const base=G.hard?Math.min(330,rand(95,170)+G.t*0.6):(rand(95,165)+Math.min(120,(G.wave-1)*(G.mode==='bait'?14:18)))*0.8;
 const e={type,x,y,vx:0,vy:0,r:T.r,hp:T.hp,maxhp:T.hp,speed:base*T.sp*slow,turn:rand(2,5),ph:rand(0,TAU),st:'seek',stT:rand(1.5,3),orb:Math.random()<0.5?1:-1,inv:0,arm:type==='mine'?1.0:0,born:G.t,flash:0};
 if(type==='mine'){e.r=T.r;e.hp=1;}
 G.enemies.push(e);
 if(!G.seenType[type]){G.seenType[type]=G.t;if(!manual&&!T.boss&&type!=='chaser')tip('type_'+type,'NEW: '+T.label+' - '+T.tip);}
 return e;}
function pickType(types){let tot=0;for(const k in types)tot+=types[k];let r=Math.random()*tot;for(const k in types){r-=types[k];if(r<=0)return k;}return'chaser';}
function spawnGate(boss){let x,y,tries=0;do{x=rand(A.x+100,A.x+A.w-100);y=rand(A.y+90,A.y+A.h-90);}while(Math.hypot(x-G.p.x,y-G.p.y)<220&&++tries<20);
 const sp=boss?(G.hard?95:55):25,rot=G.hard?0.5:0.3;G.gates.push({x,y,ang:rand(0,Math.PI),rot:boss?(G.hard?0.7:0.35):rand(-rot,rot),vx:rand(-sp,sp)||sp,vy:rand(-sp,sp)||sp,half:G.hard?(boss?62:55):(boss?80:64),cool:0,boss:!!boss,inside:0});}
const blastR=()=>(G.hard?150:170)+(has('wide')?60:0);

// ---------- kills ----------
function hitEnemy(e,col){if(e.dead||e.inv>0)return false;e.hp--;e.flash=0.2;
 if(e.hp>0){ring(e.x,e.y,e.r*2,col||CY,0.2);if(e.maxhp>1)e.inv=e.type==='shredder'||e.type==='anchor'?1.5:0.15;return false;}
 e.dead=true;pop(e,col||CY);if(!G.tut)G.kills++;
 if(has('fear')){for(const o of G.enemies){if(o.dead||o===e)continue;const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy)||1;if(d<120){o.x+=dx/d*45;o.y+=dy/d*45;}}}
 return true;}
function checkWave(){if(G.phase!=='play'||G.tut)return;const d=waveDef(G.mode,G.wave);
 if(d.boss&&d.boss!=='stampede'){if(G.boss&&G.boss.dead){if(G.endless)endWave();else winRun();}return;}
 if(G.kills>=G.quota){if(d.boss&&!G.endless)winRun();else endWave();}}
function hurt(by){const p=G.p;if(G.tut||p.inv>0||G.phase!=='play')return;G.lives--;G.stats.hits++;p.inv=(G.hard?1.6:2.0)+(has('armor')?1:0);G.shake=6;G.freeze=0.08;sfx.hurt();G.lastHurt=by;
 for(const e of G.enemies){if(e.dead||ET[e.type].boss)continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d<110){e.dead=true;pop(e,GREY);}}
 ring(p.x,p.y,110,'#ffffff',0.35);
 if(G.mode==='cinch')G.trail=[];
 if(G.mode==='towline'&&G.ball.mass>0){const lose=Math.ceil(G.ball.mass*(has('keep')?0.2:G.hard?0.5:0.35));floatText(G.ball.x,G.ball.y-20,'-'+lose+' mass',RED);G.ball.mass-=lose;}
 tip('firstHit',TIPS.firstHit);if(by==='a gate post')tip('post',TIPS.post);
 if(G.lives<=0){G.lives=0;die(by);}}

// ---------- update ----------
function update(dt){G.time+=dt;if(G.phase!==G._ph){G._ph=G.phase;G.phT=0;}G.phT+=dt;G.helpT=G.help?G.helpT+dt:0;
 for(const m of G.motes){m.x=(m.x+m.vx*dt+1)%1;m.y=(m.y+m.vy*dt+1)%1;}
 if(G.tip&&G.phase==='play'&&!G.help){G.tip.t-=dt;if(G.tip.t<=0)G.tip=null;}
 if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
 if(G.phase==='pick')G.pickT+=dt;
 if(G.phase==='clear'){G.clearT+=dt;updateFx(dt);if(G.clearT>1.4)toPick();return;}
 if(G.phase!=='play'||G.help)return;
 if(G.tut&&G.tut.step===3){G.tut.t-=dt;if(G.tut.t<=0){endTutorial();return;}}
 G.shake*=0.86;
 if(G.freeze>0){G.freeze-=dt;updateFx(dt);return;}
 step(dt);}
function step(dt){G.t+=dt;G.waveT+=dt;const p=G.p,d0=waveDef(G.mode,G.wave);p.px=p.x;p.py=p.y;
 const massSlow=G.mode==='towline'?1+G.ball.mass*(has('light')?0.0066:0.011):1;
 const maxSp=(G.mode==='towline'?440:430)*(has('swift')?1.12:1)/massSlow;
 let dx=G.mx-p.x,dy=G.my-p.y,d=Math.hypot(dx,dy)||1;const sp=Math.min(maxSp,d*9),k=Math.min(1,dt*14);
 p.vx+=(dx/d*sp-p.vx)*k;p.vy+=(dy/d*sp-p.vy)*k;
 p.x=clamp(p.x+p.vx*dt,A.x+8,A.x+A.w-8);p.y=clamp(p.y+p.vy*dt,A.y+8,A.y+A.h-8);
 if(Math.hypot(p.vx,p.vy)>25)p.head=Math.atan2(p.vy,p.vx);
 if(p.inv>0)p.inv-=dt;
 // spawning
 if(!G.tut){G.graceT-=dt;if(G.graceT<=0){let rate;if(G.hard)rate=1.4+G.t*0.085;else{rate=d0.rate;if(G.wave===1)rate*=Math.min(1,0.35+G.waveT/20*0.65);}
  if(d0.boss==='stampede')rate=G.hard?rate+1.5:2.3;
  G.spawnAcc+=rate*dt;const cap=G.hard?260:180;
  while(G.spawnAcc>=1){G.spawnAcc--;if(G.enemies.length<cap){let ty=pickType(d0.types);if(ty==='mine'&&G.enemies.filter(e=>e.type==='mine'&&!e.dead).length>=5)ty='chaser';spawnEnemy(ty);}}}}
 const pr=G.hard?8:5; // hurtbox: 60% of drawn size on NORMAL
 const seekT=G.decoy&&G.decoy.life>0?G.decoy:p;
 for(const e of G.enemies){if(e.dead)continue;const T=ET[e.type];e.ph+=dt*6;if(e.inv>0)e.inv-=dt;if(e.flash>0)e.flash-=dt;
  if(e.type==='mine'){if(e.arm>0){e.arm-=dt;continue;}if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+pr)hurt('a MINE');continue;}
  const tg=T.boss?p:seekT;let ex=tg.x-e.x,ey=tg.y-e.y,ed=Math.hypot(ex,ey)||1,kk=Math.min(1,e.turn*dt);
  if(e.type==='darter'){e.stT-=dt;
   if(e.st==='seek'){e.vx+=(ex/ed*e.speed-e.vx)*kk;e.vy+=(ey/ed*e.speed-e.vy)*kk;if(e.stT<=0&&ed<420){e.st='wind';e.stT=0.9;}}
   else if(e.st==='wind'){e.vx*=1-Math.min(1,dt*8);e.vy*=1-Math.min(1,dt*8);e.dx=ex/ed;e.dy=ey/ed;if(e.stT<=0){e.st='dash';e.stT=0.45;e.vx=e.dx*e.speed*3.4;e.vy=e.dy*e.speed*3.4;}}
   else{if(e.stT<=0){e.st='seek';e.stT=rand(2.2,3.6);}}}
  else if(e.type==='orbiter'){const rx=e.x-p.x,ry=e.y-p.y,rd=Math.hypot(rx,ry)||1,tx=-ry/rd*e.orb,ty=rx/rd*e.orb,corr=(rd-(G.hard?130:165))*2.2;
   const wx=tx*e.speed-rx/rd*corr,wy=ty*e.speed-ry/rd*corr,wl=Math.hypot(wx,wy)||1;e.vx+=(wx/wl*e.speed-e.vx)*kk;e.vy+=(wy/wl*e.speed-e.vy)*kk;}
  else{e.vx+=(ex/ed*e.speed-e.vx)*kk;e.vy+=(ey/ed*e.speed-e.vy)*kk;}
  e.x+=e.vx*dt;e.y+=e.vy*dt;
  if(T.boss){e.x=clamp(e.x,A.x+e.r,A.x+A.w-e.r);e.y=clamp(e.y,A.y+e.r,A.y+A.h-e.r);}
  if(Math.hypot(p.x-e.x,p.y-e.y)<e.r+pr)hurt(e.dummy?'a dummy':T.boss?T.label:'a '+T.label+(e.type==='darter'&&e.st==='dash'?' dash':''));}
 // separation
 const E=G.enemies;for(let i=0;i<E.length;i++){const a=E[i];if(a.dead||a.type==='mine')continue;for(let j=i+1;j<E.length;j++){const b=E[j];if(b.dead||b.type==='mine')continue;
  const sx=b.x-a.x,sy=b.y-a.y,min=a.r+b.r;if(Math.abs(sx)>min||Math.abs(sy)>min)continue;const sd=Math.hypot(sx,sy)||0.01;
  if(sd<min){const push=(min-sd)/2/sd;a.x-=sx*push;a.y-=sy*push;b.x+=sx*push;b.y+=sy*push;}}}
 if(G.decoy){G.decoy.life-=dt;if(G.decoy.life<=0)G.decoy=null;}
 if(G.mode==='bait')updateBait(dt);if(G.mode==='cinch')updateCinch(dt);if(G.mode==='towline')updateTow(dt);
 // queued chain explosions (BAIT)
 for(const b of G.booms){b.delay-=dt;if(b.delay>0)continue;b.done=true;b.chain.pending--;
  ring(b.x,b.y,b.r,b.depth?GOLD:CY,0.28);
  for(const e of G.enemies){if(e.dead||Math.hypot(e.x-b.x,e.y-b.y)>b.r+e.r)continue;
   const killed=hitEnemy(e,CY);if(!killed)continue;b.chain.n++;const gain=b.chain.n;addScore(gain);b.chain.gain+=Math.round(gain*scoreMul());
   sfx.chain(b.chain.n);G.shake=Math.min(6,G.shake+0.6);
   if(b.depth<(has('chain')?9:6)){G.booms.push({x:e.x,y:e.y,r:has('chain')?64:44,delay:0.07,depth:b.depth+1,chain:b.chain});b.chain.pending++;}}
  if(b.chain.pending<=0&&b.chain.n>0){floatText(b.chain.x,b.chain.y-26,b.chain.n+(b.chain.n>2?' CHAIN! ':' hit ')+'+'+b.chain.gain,CY,b.chain.n>4?20:16);G.stats.bestChain=Math.max(G.stats.bestChain,b.chain.n);}}
 G.booms=G.booms.filter(b=>!b.done);
 updateFx(dt);G.enemies=G.enemies.filter(e=>!e.dead);
 if(G.tut&&G.tut.step<3&&G.enemies.length===0&&!(G.mode==='towline'&&G.tut.step===2)){const e=spawnEnemy('chaser',true);e.dummy=true;e.speed*=0.4;}
 checkWave();}
function updateFx(dt){for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.92;q.vy*=0.92;q.life-=dt;}G.parts=G.parts.filter(q=>q.life>0);
 for(const r of G.rings){r.life-=dt;r.r+=(r.max-r.r)*Math.min(1,dt*14);}G.rings=G.rings.filter(r=>r.life>0);
 for(const f of G.flashes)f.life-=dt;G.flashes=G.flashes.filter(f=>f.life>0);
 for(const x of G.texts){x.life-=dt;x.y-=26*dt;}G.texts=G.texts.filter(x=>x.life>0);
 if(G.echo){G.echo.life-=dt;if(G.echo.life<=0)G.echo=null;}}

function updateBait(dt){const p=G.p,R=blastR();
 for(const g of G.gates){
  if(has('drift')&&!g.boss){const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy)||1;if(d>150){g.x+=dx/d*22*dt;g.y+=dy/d*22*dt;}}
  g.x+=g.vx*dt;g.y+=g.vy*dt;g.ang+=g.rot*dt;if(g.cool>0)g.cool-=dt;
  if(g.x<A.x+80){g.x=A.x+80;g.vx=Math.abs(g.vx);}if(g.x>A.x+A.w-80){g.x=A.x+A.w-80;g.vx=-Math.abs(g.vx);}
  if(g.y<A.y+70){g.y=A.y+70;g.vy=Math.abs(g.vy);}if(g.y>A.y+A.h-70){g.y=A.y+A.h-70;g.vy=-Math.abs(g.vy);}
  const c=Math.cos(g.ang)*g.half,s=Math.sin(g.ang)*g.half;g.a={x:g.x-c,y:g.y-s};g.b={x:g.x+c,y:g.y+s};
  g.inside=0;for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-g.x,e.y-g.y)<R)g.inside++;
  for(const q of[g.a,g.b]){const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;if(d<(G.hard?16:11)){if(has('soft')||G.tut){p.x=q.x+dx/d*15;p.y=q.y+dy/d*15;}else hurt('a gate post');}}
  if(g.cool<=0&&segInt({x:p.px,y:p.py},p,g.a,g.b)){g.used=!g.boss;g.cool=G.hard?1.2:0.8;G.freeze=0.06;G.shake=Math.min(6,G.shake+4);sfx.blast();
   G.booms.push({x:g.x,y:g.y,r:R,delay:0,depth:0,chain:{n:0,pending:1,gain:0,x:g.x,y:g.y}});
   if(has('decoy'))G.decoy={x:g.x,y:g.y,life:2.5};
   if(G.tut&&G.tut.step===1)tutAdvance();}}
 G.gates=G.gates.filter(g=>!g.used);
 const want=bossWave()&&!G.endless?1:(has('rush')?4:3);
 if(G.gates.length<want&&!G.tut){G.gateTimer+=dt;if(G.gateTimer>(has('rush')?0.4:1.2)){G.gateTimer=0;spawnGate(false);}}}

function updateCinch(dt){const p=G.p,tr=G.trail,life=has('longtrail')?3.6:2.5,last=tr[tr.length-1];
 if(!last||Math.hypot(p.x-last.x,p.y-last.y)>7)tr.push({x:p.x,y:p.y,t:G.t});
 while(tr.length&&G.t-tr[0].t>life)tr.shift();
 const n=tr.length;G.ghost=null;
 if(n>12){const a=tr[n-2],b=tr[n-1],snapR=has('snap')?40:14;let X=null,idx=-1,bd=1e9;
  for(let i=0;i<n-10;i++){const c=segInt(a,b,tr[i],tr[i+1]);if(c){X=c;idx=i;break;}
   const dd=Math.hypot(p.x-tr[i].x,p.y-tr[i].y);if(dd<bd){bd=dd;if(dd<snapR){X={x:tr[i].x,y:tr[i].y};idx=i;}}}
  if(!X&&bd<110){let bi=0;for(let i=0;i<n-10;i++){const dd=Math.hypot(p.x-tr[i].x,p.y-tr[i].y);if(dd===bd)bi=i;}G.ghost={x:tr[bi].x,y:tr[bi].y,d:bd};}
  if(X){const poly=[X,...tr.slice(idx+1,n-1)];let caught=0,pts=0;
   for(const e of G.enemies){if(!e.dead&&e.type!=='mine'&&inPoly(e,poly)){if(hitEnemy(e,CY))caught++;else if(ET[e.type].boss)caught++;}}
   G.flashes.push({poly,life:0.35,hit:caught>0});
   if(caught){pts=caught*caught+(has('bonus')?3*caught:0);addScore(pts);G.freeze=Math.min(0.08,0.04+caught*0.004);G.shake=Math.min(6,3+caught*0.3);sfx.loop(caught);
    floatText(X.x,X.y-16,caught+' x '+caught+' = +'+Math.round(pts*scoreMul()),CY,caught>4?20:16);G.stats.bestLoop=Math.max(G.stats.bestLoop,caught);
    if(has('echo'))G.echo={poly,life:1.5};if(G.tut&&G.tut.step===1)tutAdvance();}
   else{sfx.miss();if(has('pull')){let cx=0,cy=0;for(const q of poly){cx+=q.x;cy+=q.y;}cx/=poly.length;cy/=poly.length;
    for(const e of G.enemies){if(e.dead||ET[e.type].boss)continue;const dx=cx-e.x,dy=cy-e.y,d=Math.hypot(dx,dy)||1;const m=Math.min(80,d);e.x+=dx/d*m;e.y+=dy/d*m;}ring(cx,cy,60,CY,0.3);}}
   G.trail=[{x:p.x,y:p.y,t:G.t}];}}
 if(G.echo){for(const e of G.enemies){if(!e.dead&&!ET[e.type].boss&&inPoly(e,G.echo.poly)){if(hitEnemy(e,CY)){addScore(1);sfx.kill(1);}}}}
 // cutters (and the boss) sever the trail
 for(const e of G.enemies){if(e.dead||(e.type!=='cutter'&&e.type!=='shredder'))continue;const T=G.trail;
  for(let i=T.length-8;i>0;i--){if(distToSeg(e,T[i-1],T[i])<e.r+2){burst(T[i].x,T[i].y,'#ffffff',5,120);sfx.cut();G.trail=T.slice(i+1);tip('cut',TIPS.cut);
   if(has('barbed')&&e.type==='cutter'){if(hitEnemy(e,CY)){addScore(1);sfx.kill(2);}}break;}}}}

function updateTow(dt){const p=G.p,b=G.ball,L=(has('rope')?150:110)+b.mass*0.6,thr=has('sharp')?100:150;b.thr=thr;
 b.r=(10+Math.sqrt(b.mass)*2.2)*(has('bigball')?1.4:1);
 const drag=1-Math.min(0.9,0.45*dt);b.vx*=drag;b.vy*=drag;b.x+=b.vx*dt;b.y+=b.vy*dt;

function causeTip(){const by=G.lastHurt||'';const m=G.mode;

 if(by.indexOf('CUTTER')>=0)return'Cutters are slow. Loop AWAY from the diamonds, or trap them inside a loop.';
 if(by.indexOf('BRUTE')>=0)return'Brutes need two hits. They are slow: use them as the centre of a big herd.';

 if(m==='cinch')return'Small quick loops around 2-3 enemies are safer than one huge one. Never stop moving.';
 return'Whip the ball in figure-eights between you and the herd; the ball is your shield when it is GOLD.';}
