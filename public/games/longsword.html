<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LONGSWORD</title>
<style>html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}canvas{display:block;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
// ===================== LONGSWORD =====================
// Core verb (unchanged): click = ONE committed sweep (windup -> sweep -> recover). Every 10 kills: GROW or HOLD.
// Run: tutorial dummy -> 4 stages (60s) with a 1-of-3 upgrade pick between -> finale THE HIVE QUEEN -> victory -> endless.
// Testable core on window.LS: startRun(), begin(), setInput({...}), update(dt), render(), act(id), setMode(m)
const W=800,H=600,PADX=12,TOP=58,BOT=64,VW=W+PADX*2,VH=TOP+H+BOT,PI=Math.PI,TAU=PI*2,PULL=.35,HAND=10,PR=10,GID='proto_longsword';
const FONT='"Segoe UI Variable Display","Segoe UI",ui-rounded,system-ui,sans-serif';
const C={bg:'#0b0d12',bg2:'#121726',panel:'#121622',line:'#232a3d',field:'#0e1119',cyan:'#7cf5ff',red:'#ff5d73',gold:'#ffd166',green:'#9dff8a',grey:'#aab3c5',text:'#e8ecf4',soft:'#cfd6e4',dark:'#2a3146',armor:'#cfd6e4'};
const CFG={windup:.15,sweep:.18,recover:.35,growLen:8,growSlow:.04,speed:160,swingSlow:.4,lunge:12,bombR:70,arcDeg:150,shellTurn:1.2};
// NORMAL = tuned for a first-time human. HARD = the original greybox tuning (3 HP, 0.5s fuse, 0.6s dash telegraph, full hurtbox, fast spawns).
const MODES={
  normal:{hp:5,maxHp:7,inv:1.2,hurtK:.6,fuse:1.0,dashTele:.9,dashSpd:340,dashRest:1.3,ivK:1,spdK:1,cap:40,maxHives:2,maxShells:3,hiveGrunts:3,buffer:.35,born:.8,mini:105,queenHp:5,queenIv:5,queenTurn:.6,queenRage:2.0,queenLay:2.2,queenEggs:1,shellTurn:.9},
  hard:  {hp:3,maxHp:5,inv:1.0,hurtK:.9,fuse:.5, dashTele:.6,dashSpd:400,dashRest:.9, ivK:.65,spdK:1.2,cap:80,maxHives:4,maxShells:99,hiveGrunts:4,buffer:.12,born:.4,mini:120,queenHp:9,queenIv:4,queenTurn:.9,queenRage:2.6,queenLay:1.0,queenEggs:2,shellTurn:1.2}};
const STAGES=[
  {name:'FIRST BLOOD',   dur:60,iv:[1.8,1.3], spd:.9},
  {name:'POWDER KEG',    dur:60,iv:[1.3,1.0], spd:1.0},
  {name:"DON'T TOUCH",   dur:60,iv:[1.1,.85], spd:1.1},
  {name:'THE CRUSH',     dur:60,iv:[1.0,.75], spd:1.2},
  {name:'THE HIVE QUEEN',dur:120,iv:[1.4,1.1],spd:1.15,boss:1}];
const ENDLESS={name:'ENDLESS',dur:180,iv:[.85,.45],spd:1.25};
// ---- enemy data rows: one rule each (see updateEnemies / strike / kill). SHAPE first, hue second, all red-family. ----
const TYPES={
  grunt:   {r:10,spd:70, col:'#ff5d73',w:10, label:'GRUNT'},
  dasher:  {r:9, spd:55, col:'#ff7d54',w:3,  label:'DASHER'},
  bomber:  {r:12,spd:55, col:'#f0508f',w:3,  label:'BOMBER'},
  shell:   {r:13,spd:50, col:'#e0495f',w:2.5,label:'SHELL'},
  splitter:{r:14,spd:60, col:'#ff7f92',w:3,  label:'SPLITTER'},
  hive:    {r:18,spd:0,  col:'#d03c54',w:2,  label:"HIVE - DON'T HIT",life:30},
  mini:    {r:6, spd:120,col:'#ff7f92',w:0,  label:'MINI'},
  goldie:  {r:8, spd:125,col:'#ffd166',w:0,  label:'GOLDIE',mult:5,life:8},
  queen:   {r:30,spd:28, col:'#d03c54',w:0,  label:'HIVE QUEEN'},
  dummy:   {r:14,spd:0,  col:'#8a93a6',w:0,  label:'DUMMY'}};
// [type, stage, stage-time] : ONE new thing at a time, >=25s apart, grunts only for the first 30s.
const INTRO=[['grunt',0,.5],['dasher',0,30],['bomber',1,2.5],['goldie',1,30],['hive',2,2.5],['shell',2,30],['splitter',3,2.5],['queen',4,2.5]];
const NEW={
  grunt:   ['GRUNT (round): walks straight at you. Touching it costs 1 HP.','Anything inside your cyan arc when you click gets cut.'],
  dasher:  ['NEW: DASHER (triangle). It stops, shows a red lane, then lunges along it.','Step sideways out of the lane, then cut it while it rests.'],
  bomber:  ['NEW: BOMBER (spiky). When it dies it drops a bomb: red circle = blast.','Get out before the ring closes. The blast also kills enemies.'],
  goldie:  ['NEW: GOLDIE (gold diamond). Harmless, runs away, worth x5 score.','It vanishes when its ring empties. Chase it only if it is safe.'],
  hive:    ["NEW: HIVE (striped hexagon, asleep). DON'T HIT IT - it never moves,",'but if your blade touches it, grunts burst out. Your arc turns red as a warning.'],
  shell:   ['NEW: SHELL (armoured square). Its front blocks your blade.','Stand in the green wedge behind it, then sweep.'],
  splitter:['NEW: SPLITTER (double blob). Splits into 2 fast MINIs when cut.','Swing again at once: your sweeps alternate direction and catch them.'],
  queen:   ['FINALE: THE HIVE QUEEN. Armoured front (releases grunts if struck).','Every few seconds she stops to LAY and cannot turn: get behind her and cut. Or outlast her for 2:00.']};
const CAUSE={
  grunt:['a GRUNT walked into you','Grunts only walk straight at you. Back away while you swing so the far edge of your arc reaches them first.'],
  mini:['a fast MINI from a splitter caught you','After cutting a SPLITTER, swing again immediately: the return sweep catches both minis.'],
  dasher:["a DASHER's lunge hit you",'When a dasher stops and shows a red lane, step SIDEWAYS out of the lane, then cut it while it rests.'],
  bomber:['you bumped into a BOMBER','Bombers are slow. Cut them at full reach, then leave the red circle before the ring closes.'],
  bomb:["a BOMBER's bomb caught you in its blast",'After cutting a bomber, walk out of the red circle straight away. You are slow while recovering, so start moving early.'],
  shell:['a SHELL pushed into you','Shells turn slowly. Circle until their green wedge points at you, then sweep. Or just walk away - they are slow.'],
  splitter:['a SPLITTER walked into you','Splitters are big and slow. Cut them early, then swing again for the two minis.'],
  hive:['you walked into a HIVE','Hives never move. Keep them in view, do not back into them, and keep your arc off them (it turns red).'],
  queen:['the HIVE QUEEN crushed you','Stay at blade length from the Queen. When she stops to LAY she cannot turn: that is your moment to get behind her.']};
// ---- upgrades: data row + one rule hook. how:1 = changes HOW you play. Offered 1-of-3 between stages. ----
const UPS=[
  {id:'whet', name:'WHETSTONE',   icon:'star', fx:'+25% score from every kill.',why:'Pure score. Take it when you feel safe.',on:g=>g.scoreMul*=1.25},
  {id:'heart',name:'IRON HEART',  icon:'heart',fx:'+2 max HP and heal 2 HP now.',why:'The safest pick, great before the finale.',on:g=>{g.maxHp+=2;g.p.hp=Math.min(g.maxHp,g.p.hp+2);}},
  {id:'wrist',name:'QUICK WRISTS',icon:'ring', fx:'Recover 30% faster after each sweep.',why:'Less time stuck slow and helpless.',on:g=>g.recMul*=.7},
  {id:'feet', name:'LIGHT FEET',  icon:'boot', fx:'Move 15% faster.',why:'Outrun dashers, catch goldies, flank shells.',on:g=>g.moveMul*=1.15},
  {id:'grip', name:'LONG GRIP',   icon:'blade',fx:'+14px blade with no slowdown.',why:'Free reach and score. Mind the hives.',on:g=>g.L+=14},
  {id:'gold', name:'GOLD RUSH',   icon:'gem',  fx:'Goldies come twice as often and stay 4s longer.',why:'Big score if you can chase safely.',on:g=>g.goldMul=2},
  {id:'wind', name:'SECOND WIND', icon:'shield',fx:'Once: a killing blow leaves you on 1 HP and shoves enemies away.',why:'One free mistake.',on:g=>g.secondWind=1},
  {id:'wide', name:'WIDE ARC',    icon:'arc',  how:1,fx:'Your sweep covers 200 degrees instead of 150.',why:'Hits more at once - and is harder to keep off hives.',on:g=>g.arc=200*PI/180},
  {id:'lunge',name:'LUNGE',       icon:'dash', how:1,fx:'Every sweep carries you 60px toward your aim.',why:'Your swing becomes your dodge: aim where you want to GO.',on:g=>g.lunge=60},
  {id:'echo', name:'ECHO',        icon:'echo', how:1,fx:'Every 3rd sweep instantly swings back for free.',why:'Count your swings: the third one hits twice.',on:g=>g.echo=1},
  {id:'squad',name:'BOMB SQUAD',  icon:'bomb', how:1,fx:'Bombs never hurt you and their blast is 30% bigger.',why:'Bombers become your weapon: pop them inside crowds.',on:g=>{g.bombSafe=1;g.bombR*=1.3;}},
  {id:'bee',  name:'BEEKEEPER',   icon:'hex',  how:1,fx:'Grunts released from a struck hive are worth x4.',why:'Hitting a hive becomes a gamble instead of a mistake.',on:g=>g.bee=4},
  {id:'crack',name:'SHELLBREAKER',icon:'shell',how:1,fx:'A blocked hit cracks a shell: the next hit kills it from any side.',why:'No more circling - two swings open anything.',on:g=>g.crack=1},
  {id:'blood',name:'BLOOD PRICE', icon:'drop', how:1,fx:'Lose 1 HP now. All score x1.5 for the rest of the run.',why:'Risk now, reward later. Only if you feel strong.',ok:g=>g.p.hp>=3,on:g=>{g.p.hp--;g.scoreMul*=1.5;}}];
const MEDALS={normal:[1200,6000,15000],hard:[900,4000,10000]},MEDAL_NAMES=['bronze','silver','gold'],MEDAL_COL={bronze:'#d48f5f',silver:'#cfd6e4',gold:'#ffd166'};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,easeOut=k=>1-(1-k)*(1-k),lerp=(a,b,k)=>a+(b-a)*k;
function angDiff(a,b){let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d;}
function segCircle(ax,ay,bx,by,cx,cy,r){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;
  const t=clamp(((cx-ax)*dx+(cy-ay)*dy)/l2,0,1),ex=ax+dx*t-cx,ey=ay+dy*t-cy;return ex*ex+ey*ey<=r*r;}
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

let G,M=MODES.normal,RT=0;
const UI={screen:'start',mode:'normal',since:0,down:null},ONCE={};
const I={up:0,down:0,left:0,right:0,mx:W/2,my:0,vx:0,vy:0,click:0,choose:0};
function setInput(o){Object.assign(I,o);if(o.mx!==undefined)I.vx=o.mx+PADX;if(o.my!==undefined)I.vy=o.my+TOP;}
function setMode(m){UI.mode=m;M=MODES[m];}
function setScreen(s){UI.screen=s;UI.since=RT;}
const bestKey=()=>GID+'_best'+(UI.mode==='hard'?'_hard':''),getBest=()=>+store.get(bestKey())||0;
const slow=()=>1+CFG.growSlow*G.grows,mult=L=>L/40;
const swingTime=(grows,rec)=>CFG.windup*(1+CFG.growSlow*grows)+CFG.sweep+CFG.recover*(1+CFG.growSlow*grows)*rec;
const stageDef=()=>G.stage>=STAGES.length?ENDLESS:STAGES[Math.max(0,G.stage)];
function medalFor(sc){const m=MEDALS[UI.mode];let r=null;for(let i=0;i<3;i++)if(sc>=m[i])r=MEDAL_NAMES[i];return r;}

function startRun(){
  G={rt:0,t:0,st:0,stage:-1,flow:'tut',flowT:0,after:'',tutDone:0,p:{x:W/2-40,y:H/2+50,hp:M.hp,inv:0,kx:0,ky:0,face:-PI/2},
    sw:{ph:'idle',t:0,dur:0,aim:0,dir:1,fdir:1,id:0,kills:0,stop:0,show:-PI/2-1.1,from:0,a0:0,a1:0,arc:0,buf:0,echoing:0},
    L:40,grows:0,arc:CFG.arcDeg*PI/180,maxHp:M.maxHp,scoreMul:1,recMul:1,moveMul:1,goldMul:1,lunge:CFG.lunge,bombR:CFG.bombR,echo:0,bombSafe:0,bee:0,crack:0,secondWind:0,ups:[],
    score:0,shown:0,kills:0,swings:0,nextChoice:10,choice:null,pick:null,en:[],parts:[],pops:[],bombs:[],trail:null,seen:{},tips:[],banner:null,queen:null,
    shake:0,camx:0,camy:0,hitstop:0,spawnT:1,goldT:0,dead:false,deathT:0,killer:null,over:false,overT:0,victory:null,endless:false,noSpawn:false,newBest:false,medal:null,stageKills:[0,0,0,0,0,0]};
  I.click=0;I.choose=0;
  spawn('dummy',W/2+90,H/2-50,{born:0,face:PI});G.seen.dummy=0;
  say('tut','TRAINING  -  move with W A S D, aim with the mouse.','Put the grey DUMMY inside your cyan arc, then CLICK to sweep. Nothing can hurt you yet.',1e9);
}
function begin(){if(UI.screen==='start'){startRun();setScreen('play');sfx.ui();}}
function spawn(type,x,y,o){const T=TYPES[type],p=G.p;
  const e=Object.assign({type,x,y,r:T.r,spd:type==='mini'?M.mini:T.spd,col:T.col,vx:0,vy:0,born:M.born,hitId:-1,face:Math.atan2(p.y-y,p.x-x),st:0,tt:0,life:T.life||0,dead:false,ph:rand(0,TAU)},o);
  if(G.seen[type]===undefined)G.seen[type]=G.t;
  G.en.push(e);return e;}
function edgePos(){let q;for(let i=0;i<10;i++){const s=Math.random()*4|0,m=14;
    q=s===0?[rand(m,W-m),m]:s===1?[rand(m,W-m),H-m]:s===2?[m,rand(m,H-m)]:[W-m,rand(m,H-m)];
    if(Math.hypot(q[0]-G.p.x,q[1]-G.p.y)>180)break;}return q;}
function farPos(){let q=[W/2,H/2];for(let i=0;i<14;i++){q=[rand(100,W-100),rand(100,H-100)];if(Math.hypot(q[0]-G.p.x,q[1]-G.p.y)>200)break;}return q;}
function spawnType(k){const pos=k==='hive'||k==='queen'?farPos():edgePos();
  const e=spawn(k,pos[0],pos[1],k==='hive'||k==='queen'?{born:1.2}:null);
  if(k==='goldie'&&G.goldMul>1)e.life+=4;
  if(k==='queen'){e.hp=e.maxHp=M.queenHp;e.cd=0;e.rage=0;e.lay=0;e.tt=M.queenIv*.7;G.queen=e;}
  return e;}
function introduce(k){spawnType(k);say('new_'+k,NEW[k][0],NEW[k][1],8,true);if(k!=='grunt')sfx.newType();}
function intros(){for(const[k,sg,at]of INTRO)if(G.seen[k]===undefined&&(G.stage>sg||(G.stage===sg&&G.st>=at))){introduce(k);if(k==='goldie')G.goldT=rand(14,22);return;}}
function spawnTick(dt){if(G.noSpawn)return;const S=stageDef();
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.en.length<M.cap){G.spawnT=lerp(S.iv[0],S.iv[1],clamp(G.st/S.dur,0,1))*M.ivK;
    const cnt=t=>G.en.filter(e=>e.type===t).length,pool=[];let tot=0;
    for(const k in TYPES){const T=TYPES[k];if(!T.w||G.seen[k]===undefined)continue;
      if(k==='hive'&&cnt('hive')>=M.maxHives)continue;if(k==='shell'&&cnt('shell')>=M.maxShells)continue;pool.push(k);tot+=T.w;}
    if(pool.length){let r=Math.random()*tot,pick=pool[0];for(const k of pool){r-=TYPES[k].w;if(r<=0){pick=k;break;}}spawnType(pick);}}
  if(G.seen.goldie!==undefined){G.goldT-=dt*G.goldMul;if(G.goldT<=0){G.goldT=rand(14,24);spawnType('goldie');}}
}

// ---------------- run flow: tutorial -> stage -> clear -> pick -> ... -> finale -> victory -> endless ----------------
function startStage(n){G.stage=n;G.st=0;G.flow='stage';G.spawnT=1.2;const S=stageDef();
  G.banner={txt:n>=STAGES.length?'ENDLESS':(S.boss?'FINALE':'STAGE '+(n+1)+' / '+STAGES.length),sub:S.name,t:2.6};sfx.stage();}
function clearField(){for(const e of G.en){if(e.dead)continue;e.dead=true;popFx(e);}G.bombs.length=0;}
function clearStage(after){clearField();G.flow='clear';G.flowT=1.5;G.after=after;
  G.banner={txt:after==='victory'?'THE QUEEN FALLS':'STAGE CLEAR',sub:after==='victory'?'':STAGES[G.stage].name+' survived',t:1.5,good:1};sfx.clear();}
function openPick(){const pool=UPS.filter(u=>!G.ups.includes(u.id)&&(!u.ok||u.ok(G))),opts=[];
  while(opts.length<3&&pool.length)opts.push(pool.splice(Math.random()*pool.length|0,1)[0]);
  G.pick={t:0,opts};sfx.choice();}
function takePick(i){const u=G.pick&&G.pick.opts[i];if(!u||G.pick.t<.3)return;u.on(G);G.ups.push(u.id);G.pick=null;
  say('got','Took '+u.name+': '+u.fx,'',3.5,true);sfx.choose(2);startStage(G.stage+1);}
function victory(how){G.victory={how,t:0};G.flow='won';clearFieldQuiet();saveMeta(true);sfx.win();}
function clearFieldQuiet(){G.en.length=0;G.bombs.length=0;}
function goEndless(){if(!G.victory||G.endless)return;G.endless=true;G.p.inv=1.5;startStage(STAGES.length);sfx.ui();}
function flow(dt){
  if(G.flow==='tut'){if(!G.tutDone&&!G.en.some(e=>e.type==='dummy')){G.tutDone=1;G.flowT=2.2;dismiss('tut',true);
      say('tut2','Clean cut. One click = one full sweep: wind-up, sweep, recover - you are slow until the ring refills.','Here they come.',4,true);}
    if(G.tutDone){G.flowT-=dt;if(G.flowT<=0)startStage(0);}}
  else if(G.flow==='stage'){G.st+=dt;intros();spawnTick(dt);const S=stageDef();
    if(G.stage<STAGES.length&&G.st>=S.dur){if(S.boss){clearField();G.flow='clear';G.flowT=1.2;G.after='outlast';G.banner={txt:'YOU OUTLASTED THE QUEEN',sub:'',t:1.2,good:1};sfx.clear();}else clearStage('pick');}}
  else if(G.flow==='clear'){G.flowT-=dt;if(G.flowT<=0){if(G.after==='pick')openPick();else victory(G.after==='victory'?'slain':'outlast');}}
}

// ---------------- swing: windup -> sweep -> recover ----------------
function beginSwing(){const s=G.sw,p=G.p;s.ph='windup';s.t=0;s.dur=CFG.windup*slow();s.aim=Math.atan2(I.my-p.y,I.mx-p.x);s.arc=G.arc;
  s.a0=s.aim-s.dir*s.arc/2;s.a1=s.aim+s.dir*s.arc/2;s.from=s.show;s.id++;s.kills=0;s.stop=0;s.buf=0;s.echoing=0;G.swings++;p.face=s.aim;sfx.windup();}
function updateSwing(dt){const s=G.sw,p=G.p;
  if(I.click){I.click=0;if(s.ph==='idle')beginSwing();else if(s.ph==='recover'&&s.dur-s.t<=M.buffer)s.buf=1;else if(s.ph==='sweep'&&M.buffer>.2)s.buf=1;}
  if(s.ph==='idle'){s.show+=angDiff(s.show,p.face-s.dir*1.1)*Math.min(1,dt*16);return;}
  const k0=s.t/s.dur,k1=Math.min(1,(s.t+dt)/s.dur);
  if(s.ph==='windup'){s.show=s.from+angDiff(s.from,s.a0-s.dir*PULL)*easeOut(k1);s.t+=dt;
    if(k1>=1){s.ph='sweep';s.t=0;s.dur=CFG.sweep;G.trail={a0:s.a0,a1:s.a0,dir:s.dir,life:1};
      G.camx+=Math.cos(s.aim)*4;G.camy+=Math.sin(s.aim)*4;sfx.whoosh();}
  }else if(s.ph==='sweep'){const lg=s.echoing?0:G.lunge;
    p.x=clamp(p.x+Math.cos(s.aim)*lg*(k1-k0),PR,W-PR);p.y=clamp(p.y+Math.sin(s.aim)*lg*(k1-k0),PR,H-PR);
    const uAt=k=>-PULL+(s.arc+PULL)*easeOut(k),n=Math.max(1,Math.ceil((uAt(k1)-uAt(k0))*(G.L+HAND)/5));
    for(let i=1;i<=n;i++){const k=k0+(k1-k0)*i/n,u=uAt(k);s.show=s.a0+s.dir*u;if(u>=0)G.trail.a1=s.show;
      if(u>=0&&bladeHits(s.show)){s.t=k*s.dur;return;}}       // contact: freeze the blade right here (hitstop)
    s.t+=dt;
    if(k1>=1){
      if(G.echo&&!s.echoing&&G.swings%3===0){s.echoing=1;s.dir=-s.dir;const a=s.a0;s.a0=s.a1;s.a1=a;s.id++;s.t=0;s.stop=0;G.trail={a0:s.a0,a1:s.a0,dir:s.dir,life:1};sfx.whoosh();}   // ECHO rule
      else{s.ph='recover';s.t=0;s.dur=CFG.recover*slow()*G.recMul;s.fdir=s.dir;s.dir=-s.dir;}}
  }else{s.show=s.a1+s.fdir*.3*easeOut(k1);s.t+=dt;
    if(k1>=1){s.ph='idle';if(s.buf)beginSwing();}}
}
function behind(e){const p=G.p;return Math.abs(angDiff(e.face,Math.atan2(p.y-e.y,p.x-e.x)))>120*PI/180;}
function inArc(e,aim,arc){const p=G.p,dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d>HAND+G.L+e.r+3)return false;
  return Math.abs(angDiff(aim,Math.atan2(dy,dx)))<=arc/2+Math.asin(Math.min(1,(e.r+3)/d));}
function addStop(x){G.hitstop=Math.min(.08,G.hitstop+x);}
function addShake(x){G.shake=Math.min(6,Math.max(G.shake,x));}
function bladeHits(ang){const s=G.sw,p=G.p,c=Math.cos(ang),sn=Math.sin(ang);let hit=false;
  const ax=p.x+c*HAND,ay=p.y+sn*HAND,bx=p.x+c*(HAND+G.L),by=p.y+sn*(HAND+G.L);
  for(let i=0,n=G.en.length;i<n;i++){const e=G.en[i];
    if(e.dead||e.hitId===s.id||!segCircle(ax,ay,bx,by,e.x,e.y,e.r+3))continue;
    e.hitId=s.id;hit=true;strike(e,-sn*s.dir,c*s.dir);}
  return hit;}

function release(e,n){const s=G.sw;for(let i=0;i<n;i++){const a=i*TAU/n+rand(0,1);

function explode(b){const p=G.p,R=G.bombR;sfx.boom();addShake(6);addStop(.05);

// ---------------- world update ----------------
function updatePlayer(dt){const p=G.p,s=G.sw;let mx=I.right-I.left,my=I.down-I.up;const m=Math.hypot(mx,my)||1;
  const sp=CFG.speed*G.moveMul*(s.ph==='idle'?1:CFG.swingSlow);
  p.x+=(mx/m*sp+p.kx)*dt;p.y+=(my/m*sp+p.ky)*dt;const f=Math.exp(-8*dt);p.kx*=f;p.ky*=f;
  p.x=clamp(p.x,PR,W-PR);p.y=clamp(p.y,PR,H-PR);if(p.inv>0)p.inv-=dt;
  if(s.ph==='idle'||s.ph==='recover')p.face=Math.atan2(I.my-p.y,I.mx-p.x);}
function updateEnemies(dt){const p=G.p,K=stageDef().spd*M.spdK;
  for(let i=0,n=G.en.length;i<n;i++){const e=G.en[i];if(e.dead)continue;
    if(e.born>0){e.born-=dt;e.x=clamp(e.x+e.vx*dt,e.r,W-e.r);e.y=clamp(e.y+e.vy*dt,e.r,H-e.r);continue;}
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;let mx=dx/d*e.spd*K,my=dy/d*e.spd*K;
    if(e.type==='dasher'){e.tt-=dt;                                                   // DASHER rule
      if(e.st===0){e.face=Math.atan2(dy,dx);if(d<230){e.st=1;e.tt=M.dashTele;}}
      else if(e.st===1){mx=my=0;if(e.tt<=0){e.st=2;e.tt=.55;sfx.dash();}}
      else if(e.st===2){mx=Math.cos(e.face)*M.dashSpd;my=Math.sin(e.face)*M.dashSpd;if(e.tt<=0){e.st=3;e.tt=M.dashRest;}}
      else{mx=my=0;if(e.tt<=0)e.st=0;}
    }else if(e.type==='shell'){const tr=M.shellTurn;e.face+=clamp(angDiff(e.face,Math.atan2(dy,dx)),-tr*dt,tr*dt);   // SHELL rule
      mx=Math.cos(e.face)*e.spd*K;my=Math.sin(e.face)*e.spd*K;
    }else if(e.type==='queen'){e.rage-=dt;e.cd-=dt;e.tt-=dt;                                            // QUEEN rule: armoured front; every few seconds she stops to LAY and cannot turn
      if(e.lay>0){e.lay-=dt;mx=my=0;}
      else{const tr=e.rage>0?M.queenRage:M.queenTurn;e.face+=clamp(angDiff(e.face,Math.atan2(dy,dx)),-tr*dt,tr*dt);
        mx=Math.cos(e.face)*e.spd*K;my=Math.sin(e.face)*e.spd*K;
        if(e.tt<=0){e.tt=M.queenIv;e.lay=M.queenLay;e.rage=0;sfx.lay();
          for(let i=0;i<M.queenEggs;i++)if(G.en.length<M.cap){const a=e.face+PI+(i-(M.queenEggs-1)/2)*.8;spawn('grunt',e.x+Math.cos(a)*(e.r+4),e.y+Math.sin(a)*(e.r+4),{born:1.1,vx:Math.cos(a)*60,vy:Math.sin(a)*60});}
          once('lay','The Queen is LAYING: she cannot turn for a moment.','Run round to the green wedge behind her and sweep. Then get clear of the new grunts.');}}
    }else if(e.type==='hive'){mx=my=0;e.life-=dt;if(e.life<=0){e.dead=true;popFx(e);}
    }else if(e.type==='dummy'){mx=my=0;
    }else if(e.type==='goldie'){e.life-=dt;if(e.life<=0){e.dead=true;pop(e.x,e.y-14,'gone',C.grey,14);}     // GOLDIE rule
      if(d<280){mx=-dx/d*e.spd+(W/2-e.x)*.25;my=-dy/d*e.spd+(H/2-e.y)*.25;}else{mx=(W/2-e.x)*.2;my=(H/2-e.y)*.2;}
      if(Math.hypot(mx,my)>5)e.face=Math.atan2(my,mx);
    }else e.face=Math.atan2(dy,dx);

    if(e.type!=='goldie'&&e.type!=='dummy'&&d<e.r+PR*M.hurtK)hurt(e);}
  for(let i=0;i<G.en.length;i++)for(let j=i+1;j<G.en.length;j++){const a=G.en[i],b=G.en[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,o=a.r+b.r-d;
    if(o>0&&!a.dead&&!b.dead){const ux=dx/d*o*.5,uy=dy/d*o*.5,fa=a.type==='hive'||a.type==='queen'||a.type==='dummy',fb=b.type==='hive'||b.type==='queen'||b.type==='dummy';
      if(!fa){a.x-=ux;a.y-=uy;}if(!fb){b.x+=ux;b.y+=uy;}}}
}
function openChoice(){G.choice={t:0};sfx.choice();}
function takeChoice(pick){const c=G.choice;if(!c||c.t<.3)return;
  if(pick===1){G.L+=CFG.growLen;G.grows++;say('got','GROW: blade '+G.L+'px, score x'+mult(G.L).toFixed(1)+', full swing '+swingTime(G.grows,G.recMul).toFixed(2)+'s.','',3,true);}
  else if(G.p.hp<G.maxHp){G.p.hp++;say('got','HOLD: +1 HP ('+G.p.hp+' / '+G.maxHp+').','',3,true);}
  else{G.score+=15;say('got','HOLD: HP already full, +15 score instead.','',3,true);}
  G.choice=null;G.p.inv=Math.max(G.p.inv,.5);sfx.choose(pick);}
function update(dt){
  if(UI.screen!=='play'||!G)return;
  G.rt+=dt;G.shown+=(G.score-G.shown)*Math.min(1,dt*10);if(G.score-G.shown<.6)G.shown=G.score;
  if(G.over){G.overT+=dt;I.click=0;return;}
  if(G.victory&&!G.endless){G.victory.t+=dt;I.click=0;if(I.choose===1)goEndless();I.choose=0;return;}
  if(G.dead){G.deathT-=dt;if(G.deathT<=0)endRun();return;}
  G.shake*=Math.exp(-9*dt);const cf=Math.exp(-12*dt);G.camx*=cf;G.camy*=cf;
  if(G.pick){G.pick.t+=dt;I.click=0;if(I.choose)takePick(I.choose-1);I.choose=0;return;}
  if(G.choice){G.choice.t+=dt;I.click=0;if(I.choose===1||I.choose===2)takeChoice(I.choose);I.choose=0;return;}
  if(G.hitstop>0){G.hitstop-=dt;return;}
  I.choose=0;G.t+=dt;tickTips(dt);if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  updatePlayer(dt);updateSwing(dt);updateEnemies(dt);
  for(const b of G.bombs){b.t-=dt;if(b.t<=0&&!b.done){b.done=true;explode(b);}}
  G.bombs=G.bombs.filter(b=>!b.done);G.en=G.en.filter(e=>!e.dead);flow(dt);
  if(G.trail&&G.sw.ph!=='sweep'){G.trail.life-=dt*6;if(G.trail.life<=0)G.trail=null;}
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-3*dt;q.vy*=1-3*dt;q.life-=dt;if(q.rot!==undefined)q.rot+=q.spin*dt;}
  for(const q of G.pops){q.y-=34*dt;q.life-=dt;}
  G.parts=G.parts.filter(q=>q.life>0).slice(-260);G.pops=G.pops.filter(q=>q.life>0);
  if(!G.choice&&!G.dead&&G.flow==='stage'&&G.kills>=G.nextChoice){G.nextChoice+=10;openChoice();}
}
function saveMeta(win){if(G.score>getBest()){store.set(bestKey(),G.score);G.newBest=true;}
  G.medal=medalFor(G.score);const old=MEDAL_NAMES.indexOf(store.get(GID+'_medal')),now=MEDAL_NAMES.indexOf(G.medal);
  if(now>old)store.set(GID+'_medal',G.medal);if(win)store.set(GID+'_wins',(+store.get(GID+'_wins')||0)+1);}
function endRun(){G.over=true;G.overT=0;saveMeta(false);}

// ---------------- tips (fixed area under the playfield; never over gameplay) ----------------
function say(key,l1,l2,dur,front){const t={key,l1,l2,t:dur||6,age:0};if(front){G.tips=G.tips.filter(q=>q.key!==key);G.tips.unshift(t);}else if(G.tips.length<3)G.tips.push(t);}

// ---------------- audio: soft sine/triangle, pentatonic chains, master gain, M = mute (shared key proto_mute) ----------------
let AC=null,NB=null,MG=null,muted=store.get('proto_mute')==='1';
function initAudio(){if(AC)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();MG=AC.createGain();MG.gain.value=muted?0:.5;MG.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function toggleMute(){muted=!muted;store.set('proto_mute',muted?'1':'0');if(MG)MG.gain.value=muted?0:.5;}
function tone(type,f0,f1,dur,vol,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.02);}
function noise(f0,f1,dur,vol,q){if(!AC)return;const t=AC.currentTime,n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=NB;f.type='bandpass';f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.25);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  n.connect(f);f.connect(g);g.connect(MG);n.start(t);n.stop(t+dur+.02);}
const PENT=[0,2,4,7,9,12,14,16,19,21,24],note=n=>330*Math.pow(2,PENT[clamp(n,0,10)]/12);
const sfx={
  windup:()=>tone('sine',200,280,.1,.05),

  pop:n=>{tone('triangle',note(n-1),note(n-1)*.98,.16,.2);noise(2400,700,.05,.12,.8);},
  clang:()=>{tone('triangle',740,720,.2,.12);tone('sine',1110,1090,.28,.07);noise(3800,2000,.04,.1,2);},
  boom:()=>{noise(420,50,.4,.5,.6);tone('sine',110,32,.38,.3);},
  hive:()=>{for(let i=0;i<4;i++)tone('triangle',330-i*30,200-i*20,.12,.09,i*.05);},

  dash:()=>noise(800,2000,.16,.08,3),hurt:()=>tone('triangle',330,110,.28,.2),

  choice:()=>{tone('sine',note(2),note(2),.12,.1);tone('sine',note(4),note(4),.18,.1,.09);},choose:k=>tone('triangle',k===1?note(0):note(5),k===1?note(0)*.7:note(7),.2,.14),
  newType:()=>{tone('sine',note(5),note(5),.1,.08);tone('sine',note(3),note(3),.16,.08,.1);},
  stage:()=>{tone('sine',note(0),note(0),.14,.1);tone('sine',note(3),note(3),.2,.1,.12);},
  clear:()=>{[0,2,4,5,7].forEach((n,i)=>tone('triangle',note(n),note(n),.22,.12,i*.08));},
  win:()=>{[0,2,4,5,7,9,10].forEach((n,i)=>tone('triangle',note(n),note(n),.3,.13,i*.1));},
  ui:()=>tone('sine',note(4),note(5),.08,.08)};

// ---------------- drawing primitives ----------------

function para(str,x,y,maxW,size,col,lh,align,weight){const ls=wrap(str,maxW,size,weight);ls.forEach((l,i)=>text(l,x,y+i*(lh||size+6),size,col,align||'left',weight));return y+ls.length*(lh||size+6);}
function circle(x,y,r,fill,stroke,lw){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function panel(x,y,w,h,border,r,fill){rr(x,y,w,h,r||12);ctx.fillStyle=fill||C.panel;ctx.fill();ctx.strokeStyle=border||C.line;ctx.lineWidth=border&&border!==C.line?2:1;ctx.stroke();}
function glow(col,b){ctx.shadowColor=col;ctx.shadowBlur=b;}
function poly(n,r,rot){ctx.beginPath();for(let i=0;i<n;i++)ctx.lineTo(Math.cos(rot+i*TAU/n)*r,Math.sin(rot+i*TAU/n)*r);ctx.closePath();}
function stripes(r){ctx.save();ctx.clip();ctx.rotate(PI/4);ctx.fillStyle='#2a0f16';for(let x=-r*1.5;x<r*1.5;x+=r*.5)ctx.fillRect(x,-r*1.5,r*.25,r*3);ctx.restore();}
function eyes(x,sep,sz,closed){for(const q of[-1,1]){if(closed){ctx.strokeStyle='#1a0a10';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,q*sep,sz,.3,PI-.3);ctx.stroke();}
  else{circle(x,q*sep,sz,'#ffffff');circle(x+sz*.4,q*sep,sz*.5,'#14080c');}}}
let BTN=[];
function reg(id,x,y,w,h){BTN.push({id,x,y,w,h});const hov=I.vx>=x&&I.vx<=x+w&&I.vy>=y&&I.vy<=y+h;return{hov,down:hov&&UI.down===id};}
function button(id,x,y,w,h,label,o){o=o||{};const s=reg(id,x,y,w,h),dy=s.down?2:s.hov?-1:0;ctx.save();
  if(o.primary){glow(C.cyan,s.hov?18:10);rr(x,y+dy,w,h,12);ctx.fillStyle=s.down?'#5fd0da':C.cyan;ctx.fill();ctx.shadowBlur=0;text(label,x+w/2,y+dy+h/2+(o.size||20)*.36,o.size||20,'#08222a','center',800,1);}
  else{panel(x,y+dy,w,h,o.on?C.cyan:s.hov?C.cyan:C.line,10,o.on?'#173038':C.panel);text(label,x+w/2,y+dy+h/2+(o.size||15)*.36,o.size||15,o.on?C.cyan:s.hov?C.text:C.soft,'center',700,.5);}
  ctx.restore();return s;}

// ---------------- entities ----------------
function drawEnemy(e,icon){const r=e.r,T=TYPES[e.type];ctx.save();ctx.translate(e.x,e.y);if(e.born>0)ctx.globalAlpha*=.4;ctx.rotate(e.face);
  if(!icon){
    if(e.type==='dasher'&&e.st===1){const k=1-e.tt/M.dashTele,len=M.dashSpd*.55;                   // telegraph: the exact lane it will lunge through
      ctx.fillStyle='rgba(255,93,115,.16)';ctx.fillRect(0,-r,len,r*2);ctx.fillStyle='rgba(255,93,115,.4)';ctx.fillRect(0,-r,len*k,r*2);ctx.strokeStyle=C.red;ctx.lineWidth=1.5;ctx.strokeRect(0,-r,len,r*2);}
    if(e.type==='shell'||e.type==='queen'){const open=e.born<=0&&behind(e),lay=e.type==='queen'&&e.lay>0,pulse=lay?.5+.5*Math.sin(RT*12):0;   // the vulnerable back: stand in the green wedge
      if(!(e.type==='shell'&&e.cracked)){if(lay)glow(C.green,10+8*pulse);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r+38+(lay?8:0),PI-PI/3,PI+PI/3);ctx.closePath();ctx.fillStyle=open?'rgba(157,255,138,.38)':lay?'rgba(157,255,138,'+(.18+.14*pulse)+')':'rgba(157,255,138,.12)';ctx.fill();ctx.strokeStyle=open||lay?C.green:'rgba(157,255,138,.5)';ctx.lineWidth=open||lay?2:1;ctx.stroke();ctx.shadowBlur=0;}}
    if(e.type==='bomber'&&Math.hypot(G.p.x-e.x,G.p.y-e.y)<G.bombR+G.L+HAND+30){ctx.setLineDash([5,7]);circle(0,0,G.bombR,null,G.bombSafe?'rgba(124,245,255,.4)':'rgba(255,93,115,.45)',1.5);ctx.setLineDash([]);}}
  const moving=e.spd>0&&e.born<=0&&!(e.type==='dasher'&&(e.st===1||e.st===3)),wob=moving?Math.sin(RT*9+e.ph)*.07:0;ctx.scale(1+wob,1-wob);
  ctx.fillStyle=e.col;
  if(e.type==='grunt'||e.type==='mini'){circle(0,0,r,e.col);eyes(r*.35,r*.38,r*.26);}
  else if(e.type==='dasher'){if(e.st===1)glow(C.red,14);ctx.beginPath();ctx.moveTo(r*1.6,0);ctx.lineTo(-r,-r*1.05);ctx.lineTo(-r*.6,0);ctx.lineTo(-r,r*1.05);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    if(e.st===3)ctx.globalAlpha*=.6;eyes(r*.1,r*.36,r*.26,e.st===3);}
  else if(e.type==='bomber'){ctx.beginPath();for(let i=0;i<16;i++){const q=i%2?r*.78:r*1.3;ctx.lineTo(Math.cos(i*TAU/16)*q,Math.sin(i*TAU/16)*q);}ctx.closePath();ctx.fill();
    circle(-r*.35,0,r*.34,'#1a0a10');circle(-r*.35,0,1.5+Math.sin(RT*12+e.ph),'#ffffff');eyes(r*.35,r*.34,r*.22);}
  else if(e.type==='shell'){rr(-r,-r,r*2,r*2,4);ctx.fill();eyes(r*.3,r*.4,r*.22);
    ctx.strokeStyle=C.armor;ctx.lineWidth=5;ctx.lineJoin='round';if(e.cracked)ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(-r*.2,-r-1);ctx.lineTo(r+1,-r-1);ctx.lineTo(r+1,r+1);ctx.lineTo(-r*.2,r+1);ctx.stroke();ctx.setLineDash([]);}
  else if(e.type==='splitter'){for(const q of[-1,1]){circle(0,q*r*.55,r*.72,e.col);circle(r*.3,q*r*.55,r*.2,'#ffffff');circle(r*.38,q*r*.55,r*.1,'#14080c');}
    ctx.strokeStyle=C.field;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();}
  else if(e.type==='hive'){ctx.rotate(-e.face);poly(6,r,0);ctx.fill();poly(6,r,0);stripes(r);poly(6,r,0);ctx.strokeStyle=C.red;ctx.lineWidth=3;ctx.stroke();
    circle(0,0,r*.5,'rgba(11,13,18,.6)');ctx.rotate(PI/2);eyes(-1,r*.22,r*.14,true);ctx.rotate(-PI/2);
    if(!icon){ctx.strokeStyle=C.grey;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r+6,-PI/2,-PI/2+TAU*clamp(e.life/30,0,1));ctx.stroke();}}
  else if(e.type==='queen'){poly(6,r,0);ctx.fill();poly(6,r,0);stripes(r);poly(6,r,0);ctx.strokeStyle=C.red;ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle=C.armor;ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,r+3,-PI*2/3,PI*2/3);ctx.stroke();
    circle(r*.3,0,r*.42,'rgba(11,13,18,.7)');eyes(r*.35,r*.2,r*.13);
    ctx.fillStyle=C.red;for(const q of[-1,0,1]){ctx.beginPath();ctx.moveTo(-r*.5,q*r*.4-5);ctx.lineTo(-r*.95,q*r*.4);ctx.lineTo(-r*.5,q*r*.4+5);ctx.fill();}}
  else if(e.type==='goldie'){ctx.rotate(-e.face);const bob=Math.sin(RT*5+e.ph)*2;glow(C.gold,12);ctx.beginPath();ctx.moveTo(0,-r*1.4+bob);ctx.lineTo(r*1.1,bob);ctx.lineTo(0,r*1.4+bob);ctx.lineTo(-r*1.1,bob);ctx.closePath();ctx.fillStyle=C.gold;ctx.fill();ctx.shadowBlur=0;
    circle(-3,bob-1,1.6,'#3a2a08');circle(3,bob-1,1.6,'#3a2a08');
    for(let i=0;i<2;i++){const a=RT*2+i*PI+e.ph;circle(Math.cos(a)*(r+9),Math.sin(a)*(r+9)+bob,1.5,'#fff3c4');}
    if(!icon){ctx.strokeStyle='#fff3c4';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,bob,r+6,-PI/2,-PI/2+TAU*clamp(e.life/8,0,1));ctx.stroke();}}
  else if(e.type==='dummy'){rr(-r,-r,r*2,r*2,5);ctx.fill();circle(0,0,r*.62,null,'#0e1119',2);circle(0,0,r*.25,'#0e1119');}
  ctx.restore();}
function drawSector(x,y,aim,L,arc,dir,st){const R=HAND+L,a0=aim-arc/2,a1=aim+arc/2,warn=st==='warn',rgb=warn?'255,93,115':'124,245,255';
  const fa=st==='locked'?.2:st==='wait'?.05:warn?.17:.1,sa=st==='locked'?.95:st==='wait'?.3:.6;
  ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,R,a0,a1);ctx.closePath();ctx.fillStyle='rgba('+rgb+','+fa+')';ctx.fill();
  ctx.strokeStyle='rgba('+rgb+','+sa+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,R,a0,a1);ctx.stroke();
  ctx.lineWidth=1;ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(x+Math.cos(a0)*HAND,y+Math.sin(a0)*HAND);ctx.lineTo(x+Math.cos(a0)*R,y+Math.sin(a0)*R);ctx.moveTo(x+Math.cos(a1)*HAND,y+Math.sin(a1)*HAND);ctx.lineTo(x+Math.cos(a1)*R,y+Math.sin(a1)*R);ctx.stroke();ctx.setLineDash([]);
  const ae=aim+dir*arc/2,ex=x+Math.cos(ae)*R,ey=y+Math.sin(ae)*R,ta=ae+dir*PI/2;                // chevron: which way this sweep travels
  ctx.beginPath();ctx.moveTo(ex+Math.cos(ta)*7,ey+Math.sin(ta)*7);ctx.lineTo(ex+Math.cos(ta+2.5)*7,ey+Math.sin(ta+2.5)*7);ctx.lineTo(ex+Math.cos(ta-2.5)*7,ey+Math.sin(ta-2.5)*7);ctx.closePath();ctx.fillStyle='rgba('+rgb+','+sa+')';ctx.fill();}
function drawPlayer(x,y,face,show,L,ph,k,blink){ctx.save();ctx.translate(x,y);if(blink)ctx.globalAlpha=.35;
  const c=Math.cos(show),sn=Math.sin(show),b=1+.04*Math.sin(RT*2.6);ctx.lineCap='round';
  glow(C.cyan,ph==='sweep'?16:ph==='windup'?6+10*k:8);ctx.strokeStyle=ph==='recover'?'#9aa4b8':'#ffffff';ctx.lineWidth=(ph==='sweep'?5:3.5)+Math.min(4,L/70);
  ctx.beginPath();ctx.moveTo(c*HAND,sn*HAND);ctx.lineTo(c*(HAND+L),sn*(HAND+L));ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle=C.cyan;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c*HAND-sn*5,sn*HAND+c*5);ctx.lineTo(c*HAND+sn*5,sn*HAND-c*5);ctx.stroke();
  ctx.rotate(face);ctx.scale(b,b);
  ctx.fillStyle=C.cyan;ctx.beginPath();ctx.moveTo(-3,-7);ctx.lineTo(-17-2*Math.sin(RT*6),-3);ctx.lineTo(-13,0);ctx.lineTo(-17-2*Math.sin(RT*6+1),3);ctx.lineTo(-3,7);ctx.closePath();ctx.fill();   // scarf
  glow(C.cyan,10);circle(0,-8,4.2,'#ffffff');circle(0,8,4.2,'#ffffff');circle(0,0,PR-1,'#ffffff');ctx.shadowBlur=0;
  ctx.strokeStyle=C.cyan;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,PR-4,-.95,.95);ctx.stroke();                                                  // visor
  ctx.restore();
  // swing-state ring: full cyan = READY, white filling = WINDING UP, grey refilling cyan = RECOVERING
  const R=PR+9;ctx.lineCap='butt';
  if(ph==='idle')circle(x,y,R,null,'rgba(124,245,255,.9)',2);
  else if(ph==='windup'){circle(x,y,R,null,'rgba(170,179,197,.35)',2);ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,R,-PI/2,-PI/2+TAU*k);ctx.stroke();}
  else if(ph==='sweep')circle(x,y,R,null,'#ffffff',3);
  else{circle(x,y,R,null,'rgba(170,179,197,.35)',2);ctx.strokeStyle=C.cyan;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,R,-PI/2,-PI/2+TAU*k);ctx.stroke();}}
function drawMedal(x,y,R,m){ctx.save();ctx.translate(x,y);
  if(!m){ctx.setLineDash([5,6]);circle(0,0,R,null,C.grey,2);ctx.setLineDash([]);text('no medal',0,5,14,C.grey);ctx.restore();return;}
  const col=MEDAL_COL[m];ctx.fillStyle='#3d6f9a';for(const q of[-1,1]){ctx.beginPath();ctx.moveTo(q*R*.2,R*.5);ctx.lineTo(q*R*.85,R*1.7);ctx.lineTo(q*R*.45,R*1.55);ctx.lineTo(q*R*.25,R*1.85);ctx.lineTo(-q*R*.1,R*.6);ctx.closePath();ctx.fill();}
  glow(col,14);circle(0,0,R,col);ctx.shadowBlur=0;circle(0,0,R*.78,null,'rgba(11,13,18,.35)',2);
  ctx.fillStyle='rgba(11,13,18,.55)';ctx.beginPath();for(let i=0;i<10;i++){const q=i%2?R*.25:R*.56;ctx.lineTo(Math.sin(i*TAU/10)*q,-Math.cos(i*TAU/10)*q);}ctx.closePath();ctx.fill();ctx.restore();}
function drawIcon(k,x,y,col){ctx.save();ctx.translate(x,y);circle(0,0,24,'#0e1119',col,2);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  if(k==='star'){for(let i=0;i<10;i++){const q=i%2?6:14;ctx.lineTo(Math.sin(i*TAU/10)*q,-Math.cos(i*TAU/10)*q);}ctx.closePath();ctx.fill();}
  else if(k==='heart'){ctx.moveTo(0,12);ctx.bezierCurveTo(-18,-2,-8,-14,0,-5);ctx.bezierCurveTo(8,-14,18,-2,0,12);ctx.fill();}
  else if(k==='ring'){ctx.arc(0,0,12,-PI/2,PI);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(5,-17);ctx.moveTo(0,-12);ctx.lineTo(5,-7);ctx.stroke();}
  else if(k==='boot'){for(const q of[-7,1,9]){ctx.moveTo(q-5,-9);ctx.lineTo(q+3,0);ctx.lineTo(q-5,9);}ctx.stroke();}
  else if(k==='blade'){ctx.moveTo(-12,12);ctx.lineTo(13,-13);ctx.stroke();ctx.beginPath();ctx.moveTo(-10,2);ctx.lineTo(-2,10);ctx.stroke();}
  else if(k==='gem'){ctx.moveTo(0,-14);ctx.lineTo(11,0);ctx.lineTo(0,14);ctx.lineTo(-11,0);ctx.closePath();ctx.fill();}
  else if(k==='shield'){ctx.moveTo(-11,-11);ctx.lineTo(11,-11);ctx.lineTo(11,2);ctx.lineTo(0,14);ctx.lineTo(-11,2);ctx.closePath();ctx.stroke();}
  else if(k==='arc'){ctx.moveTo(0,8);ctx.arc(0,8,18,PI+.35,-.35);ctx.closePath();ctx.stroke();}
  else if(k==='dash'){ctx.moveTo(-13,0);ctx.lineTo(10,0);ctx.moveTo(3,-8);ctx.lineTo(12,0);ctx.lineTo(3,8);ctx.stroke();}
  else if(k==='echo'){ctx.arc(0,2,13,PI+.5,-.5);ctx.stroke();ctx.beginPath();ctx.arc(0,2,7,-.5+PI*2,PI+.5,true);ctx.stroke();}
  else if(k==='bomb'){ctx.arc(-1,3,10,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(6,-5);ctx.lineTo(12,-13);ctx.stroke();}
  else if(k==='hex'){for(let i=0;i<6;i++)ctx.lineTo(Math.cos(i*PI/3)*13,Math.sin(i*PI/3)*13);ctx.closePath();ctx.stroke();}
  else if(k==='shell'){ctx.rect(-10,-10,20,20);ctx.stroke();ctx.beginPath();ctx.moveTo(-3,-10);ctx.lineTo(2,-2);ctx.lineTo(-3,3);ctx.lineTo(3,10);ctx.stroke();}
  else if(k==='drop'){ctx.moveTo(0,-14);ctx.bezierCurveTo(14,4,8,14,0,14);ctx.bezierCurveTo(-8,14,-14,4,0,-14);ctx.fill();}
  ctx.restore();}

// ---------------- background + playfield ----------------
const MOTES=[];for(let i=0;i<36;i++)MOTES.push({x:Math.random()*VW,y:Math.random()*VH,s:rand(.8,2),v:rand(3,9),p:rand(0,TAU)});
function drawBackdrop(){ctx.setTransform(1,0,0,1,0,0);const w=cv.width,h=cv.height,g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.65);
  g.addColorStop(0,C.bg2);g.addColorStop(1,C.bg);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);baseT();
  for(const m of MOTES){const x=(m.x+Math.sin(RT*.2+m.p)*14+VW)%VW,y=(m.y-RT*m.v%VH+VH*4)%VH;circle(x,y,m.s,'rgba(170,179,197,.10)');}}
function fieldPanel(){rr(PADX,TOP,W,H,14);ctx.fillStyle=C.field;ctx.fill();ctx.save();ctx.clip();
  const g=ctx.createRadialGradient(PADX+W/2,TOP+H/2,60,PADX+W/2,TOP+H/2,W*.62);g.addColorStop(0,'rgba(124,245,255,.035)');g.addColorStop(1,'rgba(124,245,255,0)');ctx.fillStyle=g;ctx.fillRect(PADX,TOP,W,H);
  ctx.fillStyle='rgba(170,179,197,.10)';for(let x=50;x<W;x+=50)for(let y=50;y<H;y+=50)ctx.fillRect(PADX+x-1,TOP+y-1,2,2);ctx.restore();
  rr(PADX,TOP,W,H,14);ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.stroke();}

function renderWorld(){const p=G.p,s=G.sw;fieldPanel();
  const sx=(Math.random()-.5)*2*G.shake,sy=(Math.random()-.5)*2*G.shake;
  ctx.save();rr(PADX,TOP,W,H,14);ctx.clip();ctx.translate(PADX+sx-G.camx,TOP+sy-G.camy);
  // the area the NEXT click will cover - always visible, so reach is never a guess
  const live=!G.dead&&!G.over&&G.flow!=='won',aim=(s.ph==='windup'||s.ph==='sweep')?s.aim:Math.atan2(I.my-p.y,I.mx-p.x),arc=(s.ph==='windup'||s.ph==='sweep')?s.arc:G.arc;
  let warn=false;const inside=new Set();
  if(live)for(const e of G.en){if(e.dead||e.born>.3||!inArc(e,aim,arc))continue;if(e.type==='hive'||(e.type==='queen'&&!behind(e))){warn=true;continue;}
    if(e.type==='shell'&&!behind(e)&&!e.cracked)continue;inside.add(e);}
  if(warn&&!G.bee)once('warnarc','Your arc is RED: a HIVE is inside it.','Clicking now would burst the hive. Re-aim or step away first.');
  if(live)drawSector(p.x,p.y,aim,G.L,arc,(s.ph==='windup'||s.ph==='sweep')?s.dir:(s.ph==='recover'?s.dir:s.dir),warn?'warn':(s.ph==='windup'||s.ph==='sweep')?'locked':s.ph==='recover'?'wait':'ready');
  for(const b of G.bombs){const k=1-b.t/b.max,R=G.bombR,rgb=G.bombSafe?'124,245,255':'255,93,115';              // bomb: blast radius + closing fuse ring + seconds
    circle(b.x,b.y,R,'rgba('+rgb+','+(.14+.2*k)+')','rgba('+rgb+',1)',2);circle(b.x,b.y,R*(1-k),null,'#ffffff',2);circle(b.x,b.y,6,'#1a0a10','#ffffff',1.5);
    otext((G.bombSafe?'SAFE BLAST ':'BOMB ')+Math.max(0,b.t).toFixed(1)+'s',b.x,b.y-R-6,14,G.bombSafe?C.cyan:C.red,'center',700);}
  for(const e of G.en){drawEnemy(e);if(inside.has(e))circle(e.x,e.y,e.r+5,null,'rgba(255,255,255,.85)',1.5);}
  if(G.trail){const t=G.trail,N=14,rad=HAND+G.L/2,ccw=t.dir<0;ctx.lineCap='butt';                       // motion-blur arc
    for(let i=0;i<N;i++){const a=t.a0+(t.a1-t.a0)*i/N,b=t.a0+(t.a1-t.a0)*(i+1)/N+t.dir*.01,k=(i+1)/N;
      ctx.strokeStyle='rgba(124,245,255,'+(.3*k*k*t.life)+')';ctx.lineWidth=G.L;ctx.beginPath();ctx.arc(p.x,p.y,rad,a,b,ccw);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,'+(.9*k*t.life)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,HAND+G.L,a,b,ccw);ctx.stroke();}}
  for(const q of G.parts){const k=clamp(q.life/q.max,0,1);ctx.globalAlpha=k;
    if(q.ring)circle(q.x,q.y,q.ring*(1.25-k*.45),null,q.col,q.thin?2:4);
    else if(q.rot!==undefined){ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.size,q.rot,q.rot+PI);ctx.fill();}
    else{ctx.fillStyle=q.col;ctx.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);}}
  ctx.globalAlpha=1;
  const k=s.ph==='idle'?1:clamp(s.t/s.dur,0,1);drawPlayer(p.x,p.y,p.face,s.show,G.L,s.ph,k,p.inv>0&&Math.sin(G.t*30)>0);
  // labels: one word on first appearance (12s); hives + queen are always labelled because their rule is "don't"
  for(const e of G.en){const T=TYPES[e.type],always=e.type==='hive'||e.type==='queen'||e.type==='dummy';
    if(always||G.t<(G.seen[e.type]||0)+12){const off=e.r+(e.type==='hive'?24:18),ly=e.y+off+6>H?e.y-off+8:e.y+off;   // flip above when near the bottom edge
      otext(T.label,clamp(e.x,60,W-60),ly,14,e.type==='goldie'?C.gold:e.type==='dummy'?C.soft:always?'#ff9aa8':C.text,'center',700);}

function render(){if(!G)return;BTN=[];drawBackdrop();
  if(UI.screen!=='play'){drawInfo(UI.screen==='help');return;}
  renderWorld();drawHud();
  if(G.pick)drawPick();else if(G.choice)drawChoice();else if(G.victory&&!G.endless)drawResult(true);else if(G.over)drawResult(false);}

// ---------------- input + loop ----------------
function act(id){if(id==='play')begin();else if(id==='resume'){if(UI.screen==='help')setScreen('play');}
  else if(id==='normal'||id==='hard'){if(UI.mode!==id){setMode(id);startRun();setScreen('start');sfx.ui();}}
  else if(id==='retry'){startRun();setScreen('play');}else if(id==='menu')location.href='index.html';else if(id==='endless')goEndless();
  else if(id==='grow')takeChoice(1);else if(id==='hold')takeChoice(2);else if(id.slice(0,4)==='pick')takePick(+id[4]);}
function toggleHelp(){if(UI.screen==='play'){setScreen('help');I.up=I.down=I.left=I.right=0;}else if(UI.screen==='help')setScreen('play');}
const hitBtn=()=>{for(const b of BTN)if(I.vx>=b.x&&I.vx<=b.x+b.w&&I.vy>=b.y&&I.vy<=b.y+b.h)return b.id;return null;};
const KEYS={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'};
addEventListener('keydown',e=>{initAudio();const k=e.key.toLowerCase();if(KEYS[k]){I[KEYS[k]]=1;e.preventDefault();}
  if(e.repeat)return;
  if(k==='1'||k==='2'||k==='3')I.choose=+k;
  if(k==='enter'||k===' '){e.preventDefault();if(UI.screen==='start')begin();else if(UI.screen==='help')setScreen('play');else if(G.victory&&!G.endless)goEndless();}
  if(k==='h'||k==='?')toggleHelp();if(k==='m')toggleMute();
  if(k==='t'&&UI.screen!=='play')act(UI.mode==='normal'?'hard':'normal');
  if(k==='r'){startRun();setScreen('play');}if(k==='escape')location.href='index.html';});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KEYS[k])I[KEYS[k]]=0;});
addEventListener('blur',()=>{I.up=I.down=I.left=I.right=0;});
const mouse=e=>{I.vx=(e.clientX-view.ox)/view.s;I.vy=(e.clientY-view.oy)/view.s;I.mx=I.vx-PADX;I.my=I.vy-TOP;};
addEventListener('mousemove',mouse);
addEventListener('mousedown',e=>{initAudio();mouse(e);e.preventDefault();if(e.button!==0)return;const b=hitBtn();if(b){UI.down=b;return;}
  if(UI.screen==='play'&&!G.pick&&!G.choice&&!G.over&&!(G.victory&&!G.endless))I.click=1;});
addEventListener('mouseup',e=>{mouse(e);const b=hitBtn();if(b&&b===UI.down){sfx.ui();act(b);}UI.down=null;});
addEventListener('contextmenu',e=>e.preventDefault());addEventListener('resize',resize);
let last=0;function frame(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;RT=ts/1000;if(cv.width!==innerWidth||cv.height!==innerHeight)resize();update(dt);render();requestAnimationFrame(frame);}

  get buttons(){return BTN;}};
resize();startRun();requestAnimationFrame(frame);
