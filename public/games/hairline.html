<style>html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}canvas{display:block;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
// ---------------- constants (physics tuned by the headless test - unchanged by the clarity pass) ----------------
const VW=960,VH=600,GRID=20,DT=1/60,GRAV=500,NSUB=8,ITERS=3,DAMP=0.992,BASE_BREAK=0.006,STIFF=3600000,XRAY_LOAD=3.6,SPEED=60,WR=8,AXLE=28;
const CART_MASS=12,MAXCORR=6;
const XRAY_CAL=1.45; // static preview under-reads the moving cart by ~1.45x (measured in the headless test) - display only
const EXAG=6,EXCAP=26; // rendered sag = real sag x6 (extra capped at 26px) - display only, physics untouched
const GID='hairline';
const DIFF={normal:{name:'NORMAL',gaps:5,fee:100,lives:4,xray:true,parK:4.3,spare:0.15},
            hard:{name:'HARD',gaps:10,fee:150,lives:3,xray:false,parK:3.5,purse:13000}};
let CFG=DIFF.normal;
const TYPES={road:{cost:1.5,max:120,w:12,name:'ROAD',key:'1',use:'the cart drives on it'},strut:{cost:1,max:120,w:7,name:'STRUT',key:'2',use:'support: make triangles'},cable:{cost:0.6,max:200,w:4,name:'CABLE',key:'3',use:'pulls only, goes slack'}};
const COL={bg:'#0b0d12',cyan:'#7cf5ff',red:'#ff5d73',gold:'#ffd166',green:'#9dff8a',text:'#eef1f8',dim:'#aab3c5',panel:'#121622',border:'#232a3d',rock:'#1b2030',edge:'#3c465c'};
const FONT='"Segoe UI Variable Display","Segoe UI",ui-rounded,system-ui,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,offX=0,offY=0,bgGrad=null;
const S={},mouse={x:0,y:0,down:false},UI={screen:'start',hard:false,t:0,mute:false};
let drag=null,acc=0;
const snap=v=>Math.round(v/GRID)*GRID,clamp=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>1-Math.pow(1-clamp(t,0,1),3);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
const loadBest=()=>+lsGet('proto_'+GID+'_best')||0;
function fmt(n){n=Math.round(n);return(n<0?'-$':'$')+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}

// ---------------- audio (soft, musical, master gain, M = mute) ----------------
let AC=null,MG=null,creakO=null,creakG=null;
UI.mute=lsGet('proto_mute')==='1';
function initAudio(){
  if(AC)return;const A=window.AudioContext||window.webkitAudioContext;if(typeof A!=='function')return;
  try{AC=new A();MG=AC.createGain();MG.gain.value=UI.mute?0:0.5;MG.connect(AC.destination);
    creakO=AC.createOscillator();creakO.type='triangle';creakO.frequency.value=40;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;creakG=AC.createGain();creakG.gain.value=0;
    creakO.connect(f);f.connect(creakG);creakG.connect(MG);creakO.start();}catch(e){AC=null}
}
function setMute(m){UI.mute=m;lsSet('proto_mute',m?'1':'0');if(MG)MG.gain.value=m?0:0.5}
function tone(freq,delay,dur,type,vol){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||0.12,t+0.012);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.02);
}
function crack(){
  if(!AC)return;const n=AC.sampleRate*0.16|0,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=1800;s.buffer=buf;g.gain.value=0.4;s.connect(f);f.connect(g);g.connect(MG);s.start();tone(98,0,0.22,'sine',0.2);
}
function setCreak(r){
  if(!AC)return;const t=AC.currentTime;creakG.gain.setTargetAtTime(r>0.45?(r-0.45)*0.2:0,t,0.05);
  creakO.frequency.setTargetAtTime(32+r*90+Math.sin(S.time*31)*8*r,t,0.03);
}
const PENTA=[523,587,659,784,880,1047,1175,1319];
function flourish(big){(big?[0,2,3,5,7,5,7]:[0,2,3,5,7]).forEach((n,i)=>tone(PENTA[n],i*0.085,0.3,'triangle',0.13))}
function sting(){tone(330,0,0.4,'sine',0.14);tone(247,0.16,0.5,'sine',0.14);tone(196,0.34,0.7,'sine',0.12)}
const blip=(f,v)=>tone(f,0,0.08,'sine',v||0.08);

// ---------------- physics (pure: works on any state object) ----------------
function solveBeam(b,at){ // XPBD distance constraint: compliance makes strain physical, not an iteration artefact
  const a=b.a,c=b.b,dx=c.x-a.x,dy=c.y-a.y,L=Math.hypot(dx,dy)||1e-6,C=L-b.L0;
  if(b.type==='cable'&&C<0)return;
  const wa=a.fixed?0:1,wc=c.fixed?0:1,ws=wa+wc;if(!ws)return;
  const dl=clamp((-C-at*b.lam)/(ws+at),-MAXCORR,MAXCORR);b.lam+=dl;const k=dl/L;
  a.x-=dx*k*wa;a.y-=dy*k*wa;c.x+=dx*k*wc;c.y+=dy*k*wc;
}
function collide(w,a,b,wInv){
  const ex=b.x-a.x,ey=b.y-a.y,l2=ex*ex+ey*ey;if(l2<1||Math.abs(ex)<Math.abs(ey)*0.35)return;
  const t=clamp(((w.x-a.x)*ex+(w.y-a.y)*ey)/l2,0,1),cx=a.x+ex*t,cy=a.y+ey*t,dx=w.x-cx,dy=w.y-cy,d=Math.hypot(dx,dy);
  if(d>=WR)return;
  const l=Math.sqrt(l2);let nx=-ey/l,ny=ex/l;if(ny>0){nx=-nx;ny=-ny}
  const side=dx*nx+dy*ny;let pen=WR-side;
  if(side>0&&(t===0||t===1)&&d>1e-6){nx=dx/d;ny=dy/d;pen=WR-d}
  const wa=a.fixed?0:1-t,wb=b.fixed?0:t,lam=pen/(wInv+wa*(1-t)+wb*t);
  w.x+=nx*lam*wInv;w.y+=ny*lam*wInv;a.x-=nx*lam*wa;a.y-=ny*lam*wa;b.x-=nx*lam*wb;b.y-=ny*lam*wb;
  w.cn={nx,ny};
}
function simStep(st){for(let i=0;i<NSUB;i++)subStep(st,DT/NSUB);measure(st);st.t+=DT}
function subStep(st,h){
  const ramp=Math.min(1,st.t/0.6),g=GRAV*h*h,damp=Math.pow(DAMP,1/NSUB),at=1/(STIFF*h*h),cart /* STIFF = EA: compliance per beam = L0/EA */=st.cart;
  for(const n of st.nodes){if(n.fixed)continue;const vx=(n.x-n.px)*damp,vy=(n.y-n.py)*damp;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+g*ramp*(n.load||1)}
  if(cart)for(const w of cart.wheels){const vx=w.x-w.px,vy=w.y-w.py;w.px=w.x;w.py=w.y;w.x+=vx;w.y+=vy+g;w.cn=null}
  for(const b of st.beams)b.lam=0;
  for(let it=0;it<ITERS;it++){
    for(const b of st.beams)if(!b.broken)solveBeam(b,at*b.L0);
    if(cart){
      const [p,q]=cart.wheels,dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1e-6,k=(L-AXLE)/L/2;
      p.x+=dx*k;p.y+=dy*k;q.x-=dx*k;q.y-=dy*k;
      const wInv=2/cart.mass;
      for(const w of cart.wheels){
        for(const b of st.beams)if(!b.broken&&b.type==='road')collide(w,b.a,b.b,wInv);
        for(const s of st.ground)collide(w,s.a,s.b,wInv);
        for(const wall of st.walls)if(w.y>wall.y+2&&(w.x-wall.x)*wall.dir<WR&&(w.x-wall.x)*wall.dir>-30)w.x=wall.x+wall.dir*WR;
      }
    }
  }
  if(cart)for(const w of cart.wheels){
    if(!w.cn)continue;let tx=-w.cn.ny,ty=w.cn.nx;if(tx<0){tx=-tx;ty=-ty}
    if(ty>-0.85){const dv=SPEED*h-((w.x-w.px)*tx+(w.y-w.py)*ty);w.px-=dv*tx;w.py-=dv*ty}
  }
}
function measure(st){
  let worst=null,maxR=0;
  for(const b of st.beams){
    if(b.broken)continue;let s=(Math.hypot(b.b.x-b.a.x,b.b.y-b.a.y)-b.L0)/b.L0;if(b.type==='cable'&&s<0)s=0;
    b.strain=Math.abs(s);b.peak=Math.max(b.peak||0,b.strain);const r=b.strain/st.limit;if(r>maxR){maxR=r;worst=b}
  }
  st.curR=maxR;st.maxR=Math.max(st.maxR||0,maxR);st.worst=worst;
  if(maxR>1&&st.canBreak)for(const b of st.beams)if(!b.broken&&(b===worst||b.strain>st.limit*1.6)){b.broken=true;st.breaks=(st.breaks||0)+1;if(st.onBreak)st.onBreak(b)}
}

// ---------------- upgrades: one data row + one hook each ----------------
const UPS=[
  {id:'cable',name:'CABLE',desc:'New beam (key 3): pull-only, 200px long, $0.6/px',why:'Changes how you build: hang the deck from above, cheaply.',ok:()=>!S.up.cable,fn:()=>{S.up.cable=true}},
  {id:'steel',name:'STRONGER STEEL',desc:'Every beam survives 20% more strain',why:'Lets you delete a few struts on every later gap.',ok:()=>S.up.steel<2,fn:()=>{S.up.steel++}},
  {id:'heavy',name:'HEAVY PAYLOAD',desc:'Cart 60% heavier, but +$400 per crossing',why:'Risk now, reward later: pays off if your bridges have slack.',ok:()=>!S.up.heavy,fn:()=>{S.up.heavy=true}},
  {id:'xray',name:'STRESS X-RAY',desc:'Build mode predicts the strain of every beam',why:'See the weak beam BEFORE paying for a failed test.',ok:()=>!S.up.xray,fn:()=>{S.up.xray=true}},
  {id:'refund',name:'REFUND',desc:'+$300 right now',why:'Plain money. Money is score.',ok:()=>true,fn:()=>{S.purse+=300}},
  {id:'long',name:'LONG SPANS',desc:'Road and strut max length 120 -> 160px',why:'Changes how you build: fewer joints, bigger triangles.',ok:()=>!S.up.long,fn:()=>{S.up.long=true}},
  {id:'hook',name:'SKY HOOK',desc:'A free anchor floats above every gap',why:'Changes how you build: hang the middle instead of propping it.',ok:()=>!S.up.hook,fn:()=>{S.up.hook=true}},
  {id:'life',name:'SPARE LICENCE',desc:'+1 life',why:'One more failed test before the run ends.',ok:()=>S.lives<6,fn:()=>{S.lives++}},
  {id:'bulk',name:'BULK ASPHALT',desc:'Road costs $1.2/px instead of $1.5',why:'Every bridge needs a full road - this always pays.',ok:()=>!S.up.bulk,fn:()=>{S.up.bulk=true}},
  {id:'light',name:'LIGHT CART',desc:'Cart 15% lighter',why:'Less load = thinner bridges = more money left.',ok:()=>!S.up.light,fn:()=>{S.up.light=true}},
  {id:'salvage',name:'SALVAGE',desc:'After each crossing get 15% of the bridge cost back',why:'Makes big safe bridges cheaper.',ok:()=>!S.up.salvage,fn:()=>{S.up.salvage=true}},
  {id:'dry',name:'TEST LOAD',desc:'Once per gap, T runs a free rehearsal crossing',why:'Changes how you play: try a daring design with no fee, no life.',ok:()=>!S.up.dry,fn:()=>{S.up.dry=true}},
  {id:'insure',name:'INSURANCE',desc:'Your next 2 failed tests cost no fee and no life',why:'Buys room to experiment on the hard gaps.',ok:()=>S.up.insure===0,fn:()=>{S.up.insure=2}},
  {id:'bet',name:'DOUBLE OR NOTHING',desc:'Next gap: at or under par +$600, over par -$250',why:'Risk now, reward later - only if you trust your trusses.',ok:()=>!S.up.bet,fn:()=>{S.up.bet=true}}];

// ---------------- run / level ----------------
const KIND_NAME={low2:'TWIN FOOTINGS',lowL:'ONE FOOTING',lowR:'ONE FOOTING',pillar:'THE PILLAR',none:'BARE CLIFFS'};
function genLevel(i){
  const r=S.lvRng,Ly=320;let w,kind,Ry=320,pillarOff=0,pillarDy=0,mass=1,name,parMul=1;
  if(UI.hard||i>CFG.gaps){ // HARD = the original tuning; endless continues with it
    const j=UI.hard?i:i+4;
    w=i===1?400:clamp(snap(300+Math.min(j-1,9)/9*170+(r()-0.3)*80),300,520);
    Ry=i===1?320:320+[-20,0,0,20][r()*4|0];
    kind=i===1?'low2':['none','low2','lowL','lowR','pillar','pillar'][r()*6|0];if(kind==='none'&&w>400)kind=r()<0.5?'low2':'pillar';
    pillarOff=(r()-0.5)*100;pillarDy=20*(r()*3|0);name=KIND_NAME[kind];
    if(UI.hard&&i===CFG.gaps)name='FINALE: THE GORGE';
  }else if(i===1){w=320;kind='low2';name='PRACTICE CREEK'}
  else if(i===2){w=snap(280+r()*40);kind='low2';name='EMPTY GAP'}
  else if(i===3){w=snap(340+r()*40);kind='pillar';pillarOff=(r()-0.5)*60;name='THE PILLAR'}
  else if(i===4){w=snap(340+r()*60);kind=r()<0.5?'lowL':'lowR';name='ONE FOOTING'}
  else{w=420;kind='pillar';pillarOff=(r()-0.5)*40;pillarDy=20;mass=1.35;parMul=1.12;name='FINALE: THE CHASM'} // widest gap, a rock pillar mid-gap, a loaded ore wagon
  const Lx=snap((VW-w)/2),Rx=Lx+w,pillar=kind==='pillar'?{x:snap(Lx+w/2+pillarOff),y:Ly+80+pillarDy}:null;
  const k=CFG.parK*parMul*(kind==='none'?1.15:kind==='low2'||kind==='pillar'?0.95:1.05);
  let par=Math.round(w*k*Math.sqrt(w/400)/10)*10;if(!UI.hard&&i===1)par=Math.max(par,970);
  return{i,w,Lx,Rx,Ly,Ry,kind,pillar,par,mass,name,finale:i===CFG.gaps};
}
function startRun(seed,hard){
  if(hard!==undefined)UI.hard=!!hard;CFG=UI.hard?DIFF.hard:DIFF.normal;
  Object.assign(S,{seed:seed||((Date.now()%1e9)|1),level:0,lives:CFG.lives,best:loadBest(),
    up:{cable:false,steel:0,heavy:false,xray:CFG.xray,long:false,hook:false,bulk:false,light:false,salvage:false,dry:false,insure:0,bet:false},
    mode:'build',modeT:0,type:'road',time:0,msg:'',msgT:0,particles:[],shake:0,hitstop:0,slowmo:0,over:null,res:null,sim:null,fast:false,
    totalSaved:0,endless:false,crossed:0,fails:0,seen:{},tip:null,tut:null,lastBreak:null,lastFail:null,confirmG:0,winScore:0,dryLeft:0,choices:[]});
  S.rng=mulberry(S.seed);S.lvRng=mulberry(S.seed^0x5bd1e995);
  S.plan=[];let sum=0;for(let i=1;i<=CFG.gaps;i++){const l=genLevel(i);S.plan.push(l);sum+=l.par}
  S.purse=CFG.purse||Math.ceil(sum/(1-CFG.spare)/100)*100;S.purse0=S.purse;S.disp=S.purse;S.parSum=sum;
  drag=null;nextLevel();
}
function setMode(m){S.mode=m;S.modeT=0}
function mkNode(x,y,fixed){return{x,y,px:x,py:y,bx:x,by:y,fixed:!!fixed,ex:0,ey:0,dx:x,dy:y}}
function showTip(key,lines,until){if(S.seen[key])return;S.seen[key]=1;S.tip={lines,until:until||'time',t:0}}
function nextLevel(){
  S.level++;const i=S.level,l=S.plan[i-1]||genLevel(i);S.lv=l;
  const an=[[l.Lx,l.Ly],[l.Rx,l.Ry]];
  if(l.kind==='low2'||l.kind==='lowL')an.push([l.Lx,l.Ly+80]);
  if(l.kind==='low2'||l.kind==='lowR')an.push([l.Rx,l.Ry+80]);
  if(l.pillar)an.push([l.pillar.x,l.pillar.y]);
  if(S.up.hook)an.push([snap(l.Lx+l.w/2),l.Ly-120]);
  S.nodes=an.map(p=>mkNode(p[0],p[1],true));S.beams=[];S.undo=[];setMode('build');S.xrDirty=true;S.levelT=0;S.lastBreak=null;S.dryLeft=S.up.dry?1:0;S.tip=null;S.tut=null;
  if(S.endless){S.purse+=l.par;S.tollPaid=l.par;showTip('endless',['ENDLESS: your score is banked. Each gap pays its par into the purse up front - build with it.','Wider gaps, no finale. Give up (G G) whenever you like.'],'beam')}
  if(i===1){ // deliberately flimsy starter: press GO and watch it fail
    for(let x=l.Lx;x<l.Rx;x+=80)addBeam(x,l.Ly,x+80,l.Ly,'road');
    addBeam(l.Lx,l.Ly+80,l.Lx+80,l.Ly,'strut');addBeam(l.Rx,l.Ry+80,l.Rx-80,l.Ry,'strut');S.undo=[];S.type='strut';
    if(!UI.hard)S.tut={step:0};
  }else S.type='road';
  if(!UI.hard&&!S.endless){
    if(i===2)showTip('g2',['NEW: an empty gap. Press 1 (ROAD) and drag from the left cliff anchor toward the right, max 120px per beam.','Then press 2 (STRUT) and build triangles under the road, like the practice gap.'],'go');
    if(i===3)showTip('g3',['NEW: THE PILLAR - a free anchor in the middle of the gap.','Struts that rest on an anchor push their load straight into the ground.'],'beam');
    if(i===4)showTip('g4',['NEW: only ONE footing below the deck.','The other side can only hang from the cliff edge - give it deeper triangles.'],'beam');
    if(i===5)showTip('g5',['FINALE - THE CHASM: the widest gap, a rock pillar mid-gap, and a loaded ORE WAGON 35% heavier than the cart.','Aim for a predicted worst beam under 70% before you press GO.'],'beam');
  }
}
const limit=()=>BASE_BREAK*Math.pow(1.2,S.up.steel);
const costPx=t=>t==='road'&&S.up.bulk?1.2:TYPES[t].cost,maxLen=t=>TYPES[t].max+(S.up.long&&t!=='cable'?40:0);
const massMul=()=>(S.up.heavy?1.6:1)*(S.up.light?0.85:1)*(S.lv.mass||1);
const practice=()=>!UI.hard&&!S.endless&&S.level===1; // gap 1 on NORMAL can never hurt you
function designCost(){let c=0;for(const b of S.beams)c+=b.L0*costPx(b.type);return Math.round(c)}
function flash(m){S.msg=m;S.msgT=3}
function nodeAt(x,y,r){let best=null,bd=r;for(const n of S.nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<=bd){bd=d;best=n}}return best}
function inRock(x,y){const l=S.lv;return(x<l.Lx&&y>l.Ly-1)||(x>l.Rx&&y>l.Ry-1)||x<20||x>VW-20||y<140||y>VH-70}
function addBeam(ax,ay,bx,by,type){
  type=type||S.type;const T=TYPES[type];if(!T||S.mode!=='build'||(type==='cable'&&!S.up.cable))return null;
  ax=snap(ax);ay=snap(ay);bx=snap(bx);by=snap(by);const L=Math.hypot(bx-ax,by-ay);if(L<1||L>maxLen(type)+0.01)return null;
  let a=nodeAt(ax,ay,1),b=nodeAt(bx,by,1);
  if((!a&&inRock(ax,ay))||(!b&&inRock(bx,by)))return null;
  if(a&&b&&S.beams.some(q=>(q.a===a&&q.b===b)||(q.a===b&&q.b===a)))return null;
  if(designCost()+L*costPx(type)>S.purse){flash('Not enough money in the purse for that beam.');return null}
  if(!a){a=mkNode(ax,ay);S.nodes.push(a)}if(!b){b=mkNode(bx,by);S.nodes.push(b)}
  const beam={a,b,type,L0:L,broken:false,strain:0,peak:0,xr:0};S.beams.push(beam);S.undo.push(beam);S.xrDirty=true;
  if(S.tip&&S.tip.until==='beam')S.tip=null;return beam;
}
function removeBeam(b){
  const i=S.beams.indexOf(b);if(i<0||S.mode!=='build')return;S.beams.splice(i,1);
  S.nodes=S.nodes.filter(n=>n.fixed||S.beams.some(q=>q.a===n||q.b===n));S.xrDirty=true;
}
function undo(){while(S.undo.length){const b=S.undo.pop();if(S.beams.includes(b)){removeBeam(b);blip(220,0.05);return}}}
function clearDesign(){S.beams=[];S.undo=[];S.nodes=S.nodes.filter(n=>n.fixed);S.xrDirty=true}
function hasBeam(g){return S.beams.some(b=>(b.a.x===g[0]&&b.a.y===g[1]&&b.b.x===g[2]&&b.b.y===g[3])||(b.a.x===g[2]&&b.a.y===g[3]&&b.b.x===g[0]&&b.b.y===g[1]))}
function ghosts(){ // tutorial: three struts that turn the practice deck into triangles
  if(!S.tut||S.tut.step<1||S.mode!=='build')return[];const l=S.lv,m=l.Lx+160,y=l.Ly;
  return[[m-80,y,m,y+60],[m,y+60,m,y],[m,y+60,m+80,y]].filter(g=>!hasBeam(g));
}
function roadConnected(){
  const l=S.lv,a=nodeAt(l.Lx,l.Ly,1),z=nodeAt(l.Rx,l.Ry,1);if(!a||!z)return false;const seen=new Set([a]),q=[a];
  while(q.length){const n=q.pop();if(n===z)return true;for(const b of S.beams){if(b.type!=='road')continue;const o=b.a===n?b.b:b.b===n?b.a:null;if(o&&!seen.has(o)){seen.add(o);q.push(o)}}}return false;
}
function groundFor(l){

function computeXray(){ // static-load preview on a clone (no cart, no breaking)

  const beams=S.beams.map(b=>({a:map.get(b.a),b:map.get(b.b),type:b.type,L0:b.L0,src:b})),load=1+(XRAY_LOAD-1)*massMul();

  const st={nodes,beams,cart:null,t:0,limit:limit(),canBreak:false,ground:[],walls:[]};
  for(let i=0;i<150;i++)simStep(st);

function endSim(win,why){
  const cost=designCost(),st=S.sim,l=S.lv,first=st.first?TYPES[st.first.type].name:null;setCreak(0);S.slowmo=0;
  if(st.dry){S.res={dry:true,win,why,first,maxR:st.maxR,breaks:st.breaks};blip(win?659:247)}
  else if(win){
    const bonus=S.up.heavy?400:0,saved=l.par-cost,salv=S.up.salvage?Math.round(cost*0.15):0,toll=0;let bet=0; // endless toll is paid up front in nextLevel
    if(S.up.bet){bet=cost<=l.par?600:-250;S.up.bet=false}
    S.purse+=bonus+salv+toll+bet-cost;S.totalSaved+=saved;S.crossed++;
    S.res={win,cost,bonus,salv,toll,bet,saved,maxR:st.maxR,breaks:st.breaks};flourish(l.finale&&!S.endless);
    if(S.tut)S.tut=null;
  }else{
    const free=practice()?'practice':S.up.insure>0?'insurance':null;
    if(free==='insurance')S.up.insure--;
    if(!free){S.lives--;S.purse=Math.max(0,S.purse-CFG.fee)}
    S.fails++;S.lastFail={why,first,maxR:st.maxR,gap:S.level};S.res={win,why,first,free,maxR:st.maxR,breaks:st.breaks};sting();
    if(S.tut&&S.tut.step===0)S.tut.step=1;
  }
  if(st.first)S.lastBreak=st.first;
  setMode('result');S.resT=0;
}
function afterResult(){
  for(const n of S.nodes){n.x=n.px=n.bx;n.y=n.py=n.by}for(const b of S.beams){b.broken=false;b.strain=0}
  S.sim=null;const r=S.res;
  if(r.dry){setMode('build');S.xrDirty=true;return}
  if(r.win){
    if(S.level>=CFG.gaps&&!S.endless)return gameOver('won');
    const pool=UPS.filter(u=>u.ok());S.choices=[];while(S.choices.length<3&&pool.length)S.choices.push(pool.splice(S.rng()*pool.length|0,1)[0]);setMode('pick');
  }else if(S.lives<=0)gameOver('lives');
  else{setMode('build');S.xrDirty=true;
    if(S.purse<S.lv.par)showTip('poor',['Your purse is below par for this gap. Build lean (shallow triangles, no spare beams),','or press G twice to end the run and bank your medal.'],'go')}
}

const goldAt=()=>UI.hard?1500:Math.round(S.purse0*0.25/100)*100,bronzeAt=()=>UI.hard?4:3; // gold = finish clearly under par (~12%); bronze = past the pillar
function medalFor(o){
  if(o.won)return o.score>=goldAt()?'gold':'silver';
  return o.gaps>=bronzeAt()?'bronze':null;
}
const RANK={bronze:1,silver:2,gold:3};
function gameOver(cause){
  if(S.endless){S.over.endlessGaps=S.crossed-CFG.gaps;S.over.cause=cause;S.over.ended=true;setMode('over');return}
  const won=cause==='won',score=won?Math.round(S.purse):0,o={won,cause,score,gaps:S.crossed,newBest:won&&score>S.best};
  o.medal=medalFor(o);S.over=o;S.winScore=score;
  if(o.newBest){S.best=score;lsSet('proto_'+GID+'_best',score)}
  if(won)lsSet('proto_'+GID+'_wins',(+lsGet('proto_'+GID+'_wins')||0)+1);
  if(o.medal&&(RANK[o.medal]>(RANK[lsGet('proto_'+GID+'_medal')]||0)))lsSet('proto_'+GID+'_medal',o.medal);
  setMode('over');
}
function keepGoing(){if(S.mode!=='over'||!S.over.won||S.endless)return;S.endless=true;S.lives=Math.max(S.lives,2);const pool=UPS.filter(u=>u.ok());S.choices=[];while(S.choices.length<3&&pool.length)S.choices.push(pool.splice(S.rng()*pool.length|0,1)[0]);setMode('pick')}
function update(dt){
  dt=clamp(dt,0,0.05);UI.t+=dt;if(UI.screen)return; // start / help screens pause everything
  S.time+=dt;S.levelT+=dt;S.modeT+=dt;S.disp+=(S.purse-S.disp)*Math.min(1,dt*6);if(Math.abs(S.purse-S.disp)<1)S.disp=S.purse;
  if(S.msgT>0)S.msgT-=dt;if(S.confirmG>0)S.confirmG-=dt;S.shake*=Math.pow(0.002,dt);
  if(S.tip){S.tip.t+=dt;if(S.tip.until==='time'&&S.tip.t>6)S.tip=null}
  for(const p of S.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.ring)p.vy+=600*dt}
  S.particles=S.particles.filter(p=>p.life>0);
  if(S.mode==='sim'){
    if(S.hitstop>0){S.hitstop-=dt;return}
    let rate=S.fast?4:1;if(S.slowmo>0&&!S.fast){S.slowmo-=dt;rate=0.22}
    acc+=dt*rate;const st=S.sim,l=S.lv;
    while(acc>=DT-1e-9&&S.mode==='sim'&&S.hitstop<=0){
      acc-=DT;simStep(st);const [p,q]=st.cart.wheels;
      if(p.x>l.Rx+12&&q.x>l.Rx+12&&p.y<l.Ry)endSim(true);
      else if(p.y>VH+40||q.y>VH+40||!(p.x===p.x))endSim(false,'The cart fell into the gap');
      else if(st.t>l.w/SPEED+14)endSim(false,'The cart got stuck');
    }
    if(S.mode==='sim')setCreak(clamp(st.curR,0,1.2));
  }else if(S.mode==='result'){S.resT+=dt;if(S.resT>(S.res.win?5:9))afterResult()}
  else if(S.mode==='build'&&S.up.xray&&S.xrDirty)computeXray();
}

  const o=S.over,f=S.lastFail,G=CFG.gaps;
  if(o.ended)return['Endless run over: '+o.endlessGaps+' extra gap'+(o.endlessGaps===1?'':'s')+' crossed after the finale.','Your banked score of '+fmt(o.score)+' is safe. Wider gaps want deeper trusses, not more beams.'];
  if(o.won)return['You crossed all '+G+' gaps with '+fmt(o.score)+' of '+fmt(S.purse0)+' left in the purse.',o.medal==='gold'?'GOLD. '+(UI.hard?'That is mastery.':'Try HARD: 10 gaps, no stress preview, a purse below par.'):'For GOLD finish with '+fmt(goldAt())+' left: build under par - shallower triangles, no spare beams.'];
  if(o.cause==='gaveup')return['You gave up on gap '+S.level+' with '+fmt(S.purse)+' in the purse (par there was '+fmt(S.lv.par)+').','The purse has to last all '+G+' gaps: stay near par early, and use the PREDICTED WORST BEAM readout instead of paying for failed tests.'];
  const why=f?(f.first?'a '+f.first+' snapped first at '+Math.round(Math.max(1,f.maxR)*100)+'% strain and the cart fell':f.why.indexOf('stuck')>=0?'the cart got stuck on the road':'the cart fell with nothing snapped'):'the last test failed';
  const tip=f&&f.first?'Make every deck joint the corner of a triangle, and get PREDICTED WORST BEAM under 75% before pressing GO.':f&&f.why.indexOf('stuck')>=0?'Keep the road nearly flat - the cart cannot climb steep road beams.':'The cart only drives on ROAD beams: lay road from cliff to cliff first, then support it.';
  return['Out of lives on gap '+S.level+': '+why+'.',tip];
}
function drawOver(){
  const c=ctx,o=S.over,a=ease(S.modeT/0.3),G=CFG.gaps;c.fillStyle='rgba(11,13,18,'+0.9*a+')';c.fillRect(0,0,VW,VH);c.save();c.globalAlpha=a;c.translate(0,(1-a)*16);

  title(o.ended?'ENDLESS RUN OVER':o.won?'ALL '+G+' GAPS CROSSED':'RUN OVER',480,112,32,o.won?COL.green:COL.red,'center');

  txt('SCORE '+fmt(sc)+(o.newBest?'   NEW BEST!':'')+'      gaps '+Math.min(o.gaps,G)+'/'+G+(o.ended?' +'+o.endlessGaps:'')+'      vs par '+(S.totalSaved>=0?'+':'')+fmt(S.totalSaved)+'      failed tests '+S.fails+'      best '+fmt(S.best),480,412,15,COL.gold,'center',700);
  txt('Bronze: '+bronzeAt()+'+ gaps   Silver: finish   Gold: finish with '+fmt(goldAt())+'+ left',480,438,14,COL.dim,'center');
  const ids=overButtons();button(R.retry,'RETRY',true,'R');if(ids.includes('endless'))button(R.endless,'KEEP GOING',false,'E - endless, score is banked');button(R.menu,'MENU',false,'Esc');
  c.restore();
}
function miniBridge(x,y,good,t){
  const c=ctx,n=4,seg=44,sag=good?2:16+Math.sin(t*2)*4,pts=[];for(let i=0;i<=n;i++)pts.push([x+i*seg,y+Math.sin(i/n*Math.PI)*sag]);
  c.fillStyle=COL.rock;c.strokeStyle=COL.edge;c.lineWidth=2;for(const s of [-1,1]){const ex=s<0?x:x+n*seg;c.beginPath();c.moveTo(ex+s*40,y);c.lineTo(ex,y);c.lineTo(ex,y+70);c.lineTo(ex+s*40,y+70);c.closePath();c.fill();c.stroke()}
  const col=good?COL.green:COL.red;
  if(good){const lo=[[x,y+46]];for(let i=0;i<n;i++)lo.push([x+i*seg+seg/2,y+34]);lo.push([x+n*seg,y+46]);
    for(let i=0;i<n;i++){drawBeamStyle('strut',pts[i][0],pts[i][1],lo[i+1][0],lo[i+1][1],col,-2);drawBeamStyle('strut',lo[i+1][0],lo[i+1][1],pts[i+1][0],pts[i+1][1],col,-2);if(i)drawBeamStyle('strut',lo[i][0],lo[i][1],lo[i+1][0],lo[i+1][1],col,-2)}
    drawBeamStyle('strut',lo[0][0],lo[0][1],lo[1][0],lo[1][1],col,-2);drawBeamStyle('strut',lo[n][0],lo[n][1],lo[n+1][0],lo[n+1][1],col,-2)}
  for(let i=0;i<n;i++)drawBeamStyle('road',pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],col,-3);
  for(const p of pts){c.beginPath();c.arc(p[0],p[1],4.5,0,7);c.fillStyle='#fff';c.fill()}
  const u=good?(t*0.25)%1:0.5,cx=x+u*n*seg,ci=Math.min(n-1,u*n|0),f=u*n-ci,cy=pts[ci][1]+(pts[ci+1][1]-pts[ci][1])*f;
  c.save();c.translate(cx,cy-7);c.scale(0.62,0.62);drawCart(0,0,0,false,!good,t,'');drawWheel(-14,0,cx/5);drawWheel(14,0,cx/5);c.restore();
  if(!good)mark(x+2*seg,y+sag+2,'!','');
  txt(good?'triangles hold':'a flat deck snaps',x+n*seg/2,y+92,15,col,'center',700);
}
function drawStart(){
  const c=ctx,a=ease(UI.t/0.3),help=UI.screen==='help',t=UI.t;c.fillStyle='rgba(11,13,18,'+(help?0.93:1)+')';if(help)c.fillRect(0,0,VW,VH);c.save();c.globalAlpha=a;c.translate(0,(1-a)*14);
  title('HAIRLINE',40,76,46,'#fff');txt('Build every bridge barely strong enough.',42,104,17,COL.cyan,'left',600);
  txt('GOAL: get the cart across '+CFG.gaps+' gaps on ONE shared purse. The money you have left at the end is your score.',42,134,15.5,'#fff','left',600);
  // diagram of the core verb, drawn with the game's own shapes
  miniBridge(90,196,false,t);miniBridge(394,196,true,t);c.strokeStyle=COL.cyan;c.lineWidth=3;c.beginPath();c.moveTo(296,222);c.lineTo(360,222);c.moveTo(350,214);c.lineTo(360,222);c.lineTo(350,230);c.stroke();txt('add struts',328,204,14,COL.cyan,'center',700);
  const dx=640,dy=176;card(dx,dy,280,128,false,0.9);txt('THE VERB: drag node to node',dx+14,dy+24,14,COL.dim,'left',700);
  const u=(t*0.5)%1.4,k=clamp(u,0,1),ax=dx+50,ay=dy+96,bx=dx+200,by=dy+50,mx=ax+(bx-ax)*k,my=ay+(by-ay)*k;
  c.strokeStyle=COL.cyan;c.lineWidth=4;c.setLineDash([8,6]);beamPath(ax,ay,mx,my);c.setLineDash([]);drawAnchor({dx:ax,dy:ay,fixed:true},true);drawAnchor({dx:bx,dy:by,fixed:false},k>=1);
  c.fillStyle='#fff';c.beginPath();c.moveTo(mx,my);c.lineTo(mx+4,my+16);c.lineTo(mx+8,my+11);c.lineTo(mx+15,my+10);c.closePath();c.fill();txt('$ per px',dx+214,dy+100,14,COL.gold,'left',600);
  card(40,322,424,156);card(496,322,424,156);
  txt('CONTROLS',58,348,14,COL.cyan,'left',800);
  [['Drag','from a white node to build a beam'],['1  2  3','pick ROAD / STRUT / CABLE (cable is an upgrade)'],['Right-click / X','delete a beam      U  undo'],['SPACE','GO - the cart tests your bridge   (F fast-forward)'],['G G','give up the run and bank your medal']].forEach((r,i)=>{txt(r[0],58,372+i*21,14,'#fff','left',800);txt(r[1],168,372+i*21,14,COL.dim)});
  txt('SCORE / LOSE',514,348,14,COL.gold,'left',800);
  ['Score = money left after the last gap. Beams cost $ per pixel.','Green beam = relaxed, red = about to snap. Watch WORST BEAM.','A failed test costs '+fmt(CFG.fee)+' and 1 of '+CFG.lives+' lives. No lives = run over.','Win an upgrade (1 of 3) after every gap. Gap '+CFG.gaps+' is the FINALE.',UI.hard?'HARD: 10 gaps, no stress preview, purse below par. Good luck.':'NORMAL: stress preview is on, and gap 1 is free practice.'].forEach((s,i)=>txt(s,514,372+i*21,14,i<2?'#fff':COL.dim));
  button(R.play,help?'RESUME':'PLAY',true,help?'H or click':'click or SPACE');
  if(!help){txt('difficulty',R.diffN.x,R.diffN.y-8,14,COL.dim);for(const [r,h] of [[R.diffN,false],[R.diffH,true]]){const on=UI.hard===h,hv=inRect(mouse,r);rr(r.x,r.y,r.w,r.h,9);c.fillStyle=on?'rgba(124,245,255,.14)':COL.panel;c.fill();c.strokeStyle=on||hv?COL.cyan:COL.border;c.lineWidth=on?2:1;c.stroke();txt(h?'HARD':'NORMAL',r.x+r.w/2,r.y+23,14,on?'#fff':COL.dim,'center',800)}
    const md=lsGet('proto_'+GID+'_medal');if(md){drawMedal(md,880,84,0.55);txt('best '+fmt(loadBest()),880,134,14,COL.dim,'center')}}
  txt('H help     R restart     M '+(UI.mute?'unmute':'mute')+'     Esc menu',480,582,14,COL.dim,'center');c.restore();
}
function render(){
  const c=ctx;drawBackdrop();
  c.setTransform(scale,0,0,scale,offX,offY);
  c.save();rr(0,0,VW,VH,14);c.clip();
  const pg=c.createLinearGradient(0,0,0,VH);if(pg&&pg.addColorStop){pg.addColorStop(0,'#10141f');pg.addColorStop(1,'#0b0d12')}c.fillStyle=pg||COL.bg;c.fillRect(0,0,VW,VH);
  if(UI.screen!=='start'){
    calcDraw();const sh=Math.min(6,S.shake);c.save();c.translate((Math.random()-0.5)*sh,(Math.random()-0.5)*sh);drawWorld();c.restore();
    drawHUD();
    if(S.mode==='result')drawResult();if(S.mode==='pick')drawPick();if(S.mode==='over')drawOver();
  }
  if(UI.screen)drawStart();
  c.restore();
  c.save();c.shadowColor='rgba(124,245,255,.10)';c.shadowBlur=24;rr(0,0,VW,VH,14);c.strokeStyle=COL.border;c.lineWidth=1.5;c.stroke();c.restore();
}

// ---------------- input ----------------
function setMouse(e){mouse.x=(e.clientX-offX)/scale;mouse.y=(e.clientY-offY)/scale}
function resize(){cv.width=window.innerWidth||VW;cv.height=window.innerHeight||VH;scale=Math.min(cv.width/VW,cv.height/VH)*0.97;offX=(cv.width-VW*scale)/2;offY=(cv.height-VH*scale)/2;
  const g=ctx.createRadialGradient(cv.width/2,cv.height/2,0,cv.width/2,cv.height/2,Math.max(cv.width,cv.height)*0.7);if(g&&g.addColorStop){g.addColorStop(0,'#141a2b');g.addColorStop(1,'#0b0d12');bgGrad=g}}
function openScreen(s){UI.screen=s;UI.t=0;drag=null}
function play(){const fresh=UI.screen==='start';UI.screen=null;if(fresh)startRun();blip(523)}
function onDown(x,y,button){
  mouse.x=x;mouse.y=y;
  if(UI.screen){if(button===2)return;if(UI.screen==='start'&&inRect(mouse,R.diffN)){UI.hard=false;CFG=DIFF.normal;blip(440)}else if(UI.screen==='start'&&inRect(mouse,R.diffH)){UI.hard=true;CFG=DIFF.hard;blip(330)}else play();return}
  if(button===2){if(drag)drag=null;else if(S.mode==='build'){const b=hoverBeam();if(b){removeBeam(b);blip(196,0.06)}}return}
  if(S.mode==='pick'){if(S.modeT>0.3)for(let i=0;i<3;i++)if(inRect(mouse,pickRect(i)))pick(i);return}
  if(S.mode==='over'){if(S.modeT<0.5)return;const ids=overButtons();if(inRect(mouse,R.retry))startRun();else if(ids.includes('endless')&&inRect(mouse,R.endless))keepGoing();else if(inRect(mouse,R.menu))location.href='index.html';return}
  if(S.mode==='result'){if(S.resT>0.5)afterResult();return}
  if(S.mode!=='build')return;
  if(inRect(mouse,R.go)){go();return}
  const ks=Object.keys(TYPES);for(let i=0;i<ks.length;i++)if(inRect(mouse,legendRow(i))){if(ks[i]!=='cable'||S.up.cable){S.type=ks[i];blip(494,0.05)}else flash('CABLE is locked - it can appear as an upgrade after a gap.');return}
  let n=nodeAt(x,y,10);if(n){drag=n;return}
  const g=hoverGhost();if(g){if(addBeam(g[0],g[1],g[2],g[3],'strut')){tone(PENTA[3-ghosts().length]||784,0,0.14,'sine',0.1);if(!ghosts().length&&S.tut)S.tut.step=2}return}
  n=nodeAt(x,y,16);if(n)drag=n;
}
function onUp(x,y){
  mouse.x=x;mouse.y=y;if(!drag||S.mode!=='build'||UI.screen){drag=null;return}
  const end=clampEnd(drag,x,y,maxLen(S.type)),a=drag;drag=null;
  if(end.x===a.x&&end.y===a.y)return;
  if(addBeam(a.x,a.y,end.x,end.y,S.type)){blip(440+Math.random()*60,0.06);if(S.tut&&S.tut.step===1&&!ghosts().length)S.tut.step=2}
}
function onKey(k,e){
  if(k==='escape'){location.href='index.html';return}
  if(k==='m'){setMute(!UI.mute);return}
  if(UI.screen){if(k===' '||k==='enter'||(k==='h'&&UI.screen==='help')){if(e)e.preventDefault();play()}else if(UI.screen==='start'&&(k==='arrowleft'||k==='arrowright'||k==='tab')){if(e)e.preventDefault();UI.hard=!UI.hard;CFG=UI.hard?DIFF.hard:DIFF.normal}else if(k==='r'&&UI.screen==='help'){UI.screen=null;startRun()}return}
  if(k==='h'){openScreen('help');return}
  if(k==='r'){startRun();return}
  if(k==='f')S.fast=true;
  if((k==='z'&&e&&(e.ctrlKey||e.metaKey))||k==='u'){undo();if(e)e.preventDefault();return}
  if(S.mode==='over'){if(k===' '&&S.modeT>0.5)startRun();else if(k==='e')keepGoing();return}
  if(S.mode==='pick'&&'123'.includes(k)){pick(+k-1);return}
  if(S.mode==='result'&&(k===' '||k==='enter')&&S.resT>0.5){if(e)e.preventDefault();afterResult();return}
  if(S.mode!=='build')return;
  if(k===' '){if(e)e.preventDefault();go()}
  else if(k==='t'){go(true)}
  else if(k==='1')S.type='road';else if(k==='2')S.type='strut';else if(k==='3'){if(S.up.cable)S.type='cable';else flash('CABLE is locked - it can appear as an upgrade after a gap.')}
  else if(k==='x'){const b=hoverBeam();if(b)removeBeam(b)}
  else if(k==='g'){if(S.confirmG>0)gameOver('gaveup');else S.confirmG=2.5}
}
cv.addEventListener('mousedown',e=>{initAudio();setMouse(e);mouse.down=true;onDown(mouse.x,mouse.y,e.button)});
window.addEventListener('mousemove',setMouse);
window.addEventListener('mouseup',e=>{setMouse(e);mouse.down=false;onUp(mouse.x,mouse.y)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{initAudio();onKey(e.key.toLowerCase(),e)});
window.addEventListener('keyup',e=>{if(e.key.toLowerCase()==='f')S.fast=false});
window.addEventListener('resize',resize);
let last=0;function frame(t){const dt=(t-last)/1000;last=t;update(dt>0?dt:0);render();window.requestAnimationFrame(frame)}
window.HL={S,UI,DIFF,UPS,startRun,addBeam,removeBeam,clearDesign,designCost,go,update,render,pick,undo,computeXray,limit,TYPES,ghosts,roadConnected,keepGoing,gameOver,afterResult,onKey,onDown,onUp,openScreen,medalFor};
resize();startRun();window.requestAnimationFrame(frame);
</script></body></html>
