'use strict';
// ============ LADDERBLADE — drag a chain through monsters. The blade climbs a STAIRCASE (it only grows on kills near its power). ============
// ============ You stop on the last cell; the monsters beside it hit you and ENRAGE. Descend 5 floors, then cut the Hydra's heads in order. ============
const GID = 'ladderblade', N = 6, NC = N * N;
const FONT = '"Segoe UI Variable Display","Segoe UI",ui-rounded,system-ui,sans-serif';
const C = { bg:'#0b0d12', bg2:'#121726', panel:'#121622', border:'#232a3d', player:'#7cf5ff', danger:'#ff5d73', gold:'#ffd166', safe:'#9dff8a', text:'#e8ecf5', dim:'#aab3c5', ink:'#0b0d12' };
const NAMES = ['', 'Imp', 'Rat', 'Goblin', 'Orc', 'Ogre', 'Troll', 'Giant', 'Drake', 'Titan'];

const MODES = {                                                        // HARD = the old bot-tuned pressure: less HP, fewer turns, denser walls, bigger heads

  hard:  { label:'HARD',   hp:18, refill:6, turns:7, quotaMul:1.1, modChance:.24, wallAdd:2, bossTurns:10, heads:[3,3,4,4,5,5,6,6,7] } };
// ---------- run structure: 5 floors (kill quota within N turns, one new piece per floor) then the boss ----------
const FLOORS = [
  { name:'THE CELLAR',  quota:24, maxVal:6, wallCap:5, mods:'' },
  { name:'THE VAULT',   quota:28, maxVal:7, wallCap:6, mods:'A',   intro:'A' },
  { name:'THE FURNACE', quota:30, maxVal:8, wallCap:7, mods:'AB',  intro:'B' },
  { name:'THE MARKET',  quota:32, maxVal:9, wallCap:8, mods:'ABT', intro:'T' },
  { name:'THE PIT',     quota:34, maxVal:9, wallCap:9, mods:'ABT' },
  { name:'THE HYDRA',   boss:true, maxVal:5, wallCap:5, mods:'A' } ];
const INTRO = { A:'NEW: ARMOURED (shield) - it needs blade power = value + 1.', B:'NEW: BOMB - killing it deals 2 to all 8 neighbours (they score +1 each). Do not END next to the blast.',
  T:'NEW: THIEF ($) - beside your end cell it steals 5 points instead of hurting you.', H:'THE HYDRA: cut its 9 heads in ascending order - lowest number first, at most 2 per turn. Locked heads cannot be cut yet.' };
const MEDALS = [['gold', 3000], ['silver', 1200], ['bronze', 400]];        // score thresholds: Bronze = median run of the short-chain human-ish bot, Gold = a winning run

// ---------- data: perks (data row + one rule hook). 'how' perks change how you path ----------
const PERKS = [
  { id:'start2',   glyph:'2', name:'KEEN EDGE',    desc:'The blade starts every turn at power 2.',                              why:'Rats die first; the staircase begins one step higher.', how:1 },

  { id:'ghost',    glyph:'G', name:'GHOST STEP',   desc:'Your chain may cross ONE empty cell per turn.',                        why:'Reach clusters that are not touching.', how:1 },
  { id:'lockpick', glyph:'K', name:'LOCKPICK',     desc:'Armoured monsters need no extra power.',                              why:'Shields stop being walls in your staircase.', how:1 },
  { id:'bombsuit', glyph:'B', name:'BOMB SUIT',    desc:'Bomb blasts no longer hurt you.',                                     why:'Stand in the blast and let it clear the neighbours.', how:1 },
  { id:'thorns',   glyph:'!', name:'SHOCKWAVE',    desc:'Your end cell deals 2 to its orthogonal neighbours before they hit.', why:'Ending beside 1s and 2s becomes safe and thins the board.', how:1 },
  { id:'fourth',   glyph:'4', name:'WHETSTONE',    desc:'Every 4th kill in a chain grows the blade even if it is small.',      why:'Hoovering Imps still climbs the staircase.', how:1 },
  { id:'bull',     glyph:'>', name:'BULLRUSH',     desc:'SHOVE recharges in 2 turns and deals 1 damage to the shoved monster.', why:'Reposition twice as often.', how:1 },
  { id:'ones',     glyph:'1', name:'THICK BOOTS',  desc:'Value-1 monsters beside you deal no damage (and do not enrage).',     why:'Imps become free to stop beside.' },
  { id:'leech',    glyph:'+', name:'LEECH',        desc:'Killing a 1 heals 1 HP (max 3 per turn).',                           why:'Steady healing from the monsters you kill most.' },
  { id:'patience', glyph:'R', name:'PATIENCE',     desc:'REST heals 3 instead of 1.',                                          why:'A safe corner becomes a real recovery.' },
  { id:'vital',    glyph:'H', name:'VITALITY',     desc:'+6 max HP and heal 6 now.',                                           why:'Simple and strong.' },
  { id:'wind',     glyph:'W', name:'SECOND WIND',  desc:'Once per floor, a lethal hit leaves you at 1 HP instead.',            why:'One free mistake per floor.' },
  { id:'pact',     glyph:'$', name:'DARK BARGAIN', desc:'Lose 6 HP now. Every kill scores +1 for the rest of the run.',        why:'Risk now, a big score later.', risk:1 } ];
const DELAY = { move:170, boom:230, thorn:200, score:330, hit:280, steal:280, rage:240, rest:220, shove:240, shoveHit:160, end:0 };

// ---------- grid helpers / rng / storage ----------
const X = c => c % N, Y = c => (c / N) | 0, NB8 = [], NB4 = [];

function dailySeed() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
let rng = Math.random;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get:(k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set:(k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let best = +store.get('proto_' + GID + '_best', 0) || 0, bestMedal = store.get('proto_' + GID + '_medal', ''), wins = +store.get('proto_' + GID + '_wins', 0) || 0;
const UI = { screen:'start', help:false, hard:false, daily:false, t0:0, now:0, mx:-1, my:-1, down:null, btns:[], tutDone: store.get('proto_' + GID + '_tut', '') === '1', motes:[], instant:false };
for (let i = 0; i < 28; i++) UI.motes.push({ x:Math.random(), y:Math.random(), v:.004 + Math.random() * .008, r:1 + Math.random() * 1.6, a:.05 + Math.random() * .1, p:Math.random() * 6.28 });
let G = null;

// ---------- audio: soft synth, master gain, shared mute ----------
let AC = null, MG = null, muted = store.get('proto_mute', '0') === '1';
function initAudio() { if (AC || typeof window === 'undefined') return; const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
  try { AC = new A(); MG = AC.createGain(); MG.gain.value = muted ? 0 : .5; MG.connect(AC.destination); } catch (e) { AC = null; } }
function setMute(m) { muted = m; store.set('proto_mute', m ? '1' : '0'); if (MG) MG.gain.value = m ? 0 : .5; }
function tone(f, d = .12, type = 'sine', v = .12, slide = 0, delay = 0) { if (!AC || (G && G.instant)) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(MG); o.start(t); o.stop(t + d + .03); }
function noise(d = .12, freq = 900, v = .1) { if (!AC || (G && G.instant)) return; const n = Math.floor(AC.sampleRate * d), b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v; s.connect(f); f.connect(g); g.connect(MG); s.start(); }
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26], pent = i => 330 * Math.pow(2, PENTA[Math.min(i, 11)] / 12);
const jingle = (notes, type = 'triangle', v = .1) => notes.forEach((n, i) => tone(pent(n), .26, type, v, 0, i * .09));

// ---------- run setup ----------
function floorDef(f = G.floor) { if (f < FLOORS.length) { const F = FLOORS[f]; return Object.assign({ turns:F.boss ? G.M.bossTurns : G.M.turns, quota:F.quota ? Math.round(F.quota * G.M.quotaMul) : 0 }, F); }
  const e = f - FLOORS.length + 1; return { name:'ENDLESS ' + e, quota:Math.round((34 + 2 * e) * G.M.quotaMul), turns:G.M.turns, maxVal:9, wallCap:Math.min(13, 9 + e), mods:'ABT', endless:true }; }
function startRun(opts = {}) {
  const hard = UI.hard, M = MODES[hard ? 'hard' : 'normal'];
  const seed = opts.seed != null ? opts.seed : UI.daily ? dailySeed() : (Math.random() * 2147483647) | 0; rng = mulberry(seed);
  UI.screen = 'game'; UI.help = false; UI.t0 = UI.now;
  G = { hard, M, seed, daily:UI.daily, instant:UI.instant, grid:Array(NC).fill(null), hero:14, hx:2, hy:2, state:'play',
    hp:M.hp, maxHp:M.hp, score:0, shown:0, turn:0, floor:0, floorTurn:0, floorKills:0, kills:0, perks:{}, offer:[], queue:[], qt:0, freeze:0,
    path:[], sim:null, blade:1, shoveCd:0, shoveMode:false, hover:-1, killer:-1, killerV:0, killerRage:0, lastDmg:0, deadT:0, cause:'', endless:false, won:false, ended:false, screenT:0, windUsed:false, headsTotal:0,
    parts:[], pops:[], shake:0, time:0, stats:{ longest:0, chains:0, chainSum:0, rests:0, shoves:0, hits:0, dmg:0, heads:0, floors:0 }, seen:{}, tip:null, banner:null, tut:opts.tutorial ? { step:1 } : null, lastNodes:0 };
  if (G.tut) tutBoard(); else { newBoard(); floorBanner(); }
}
function floorBanner() { const F = floorDef(); G.banner = { text:F.boss ? 'FINALE - ' + F.name : (F.endless ? F.name : 'FLOOR ' + (G.floor + 1) + ' - ' + F.name), sub:F.boss ? 'Cut all 9 heads in ' + F.turns + ' turns' : 'Kill ' + F.quota + ' in ' + F.turns + ' turns', t0:UI.now };
  if (F.boss) tip(INTRO.H, 'H'); else if (F.intro) tip(INTRO[F.intro], F.intro); else if (G.floor === 0) tip('Drag from a bright monster beside you through its neighbours. Release to strike.', 'first'); }
function newBoard() { const F = floorDef(); G.grid.fill(null); G.floorTurn = 0; G.floorKills = 0; G.windUsed = false; G.headsTotal = 0; G.shoveCd = 0; G.shoveMode = false;
  if (F.boss) {                                                          // 3x3 Hydra inset one cell from every edge so each ring head touches open board; the biggest head sits in the centre
    const corner = (rng() * 4) | 0, bx = corner & 1 ? 2 : 1, by = corner & 2 ? 2 : 1; G.hero = (by === 1 ? 5 : 0) * N + (bx === 1 ? 5 : 0);
    const vals = G.M.heads.slice().sort((a, b) => a - b), centre = vals.pop(); shuffle(vals); let i = 0;
    for (let y = by; y < by + 3; y++) for (let x = bx; x < bx + 3; x++) G.grid[y * N + x] = { v:(x === bx + 1 && y === by + 1) ? centre : vals[i++], mod:'', head:1, s:0, sh:0, rage:0 }; G.headsTotal = 9; }
  G.hx = X(G.hero); G.hy = Y(G.hero); refill(true); }
function tutBoard() { G.grid.fill(null); G.hero = 14; G.hx = 2; G.hy = 2; const put = (c, v) => { G.grid[c] = { v, mod:'', s:0, sh:0, rage:0 }; };
  put(15, 1); put(22, 1); put(29, 2); put(34, 3); put(7, 1); put(0, 1); put(1, 2); put(2, 2); put(21, 5); put(18, 4); put(33, 4); put(11, 3); put(5, 1); put(30, 1);
  tip('TUTORIAL 1/2: drag from the Imp 1 beside you, through 1 - 2 - 3, then release. Nothing can hurt you here.', 'tut1'); }
const isBig = m => m && !m.head && m.v >= (G.turn < CFG.gentleTurns ? CFG.gentleMax : CFG.bigFrom);
function spawn(wall) { const F = floorDef(); let max = F.maxVal; if (G.turn < CFG.gentleTurns) max = Math.min(max, CFG.gentleMax);
  let lo = wall ? CFG.bigFrom : 1, hi = wall ? max : Math.min(max, CFG.bigFrom - 1); if (lo > hi) lo = hi = max;   // gentle opening: the "big" monsters are soft 4s
  const w = (F.boss && !wall ? CFG.bossWeights : CFG.weights).slice(lo - 1, hi), tot = w.reduce((a, b) => a + b, 0);   // the Hydra floor spawns staircase rungs (3s, 4s) so heads of 5+ are reachable
  let r = rng() * tot, v = hi; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) { v = lo + i; break; } }
  let mod = ''; if (F.mods && rng() < G.M.modChance) mod = F.mods[(rng() * F.mods.length) | 0]; return { v, mod, s:0, sh:0, rage:0 }; }
function refill(all) {                                                   // limited refill: only M.refill cells come back per turn
  const F = floorDef(), empty = []; for (let c = 0; c < NC; c++) if (!G.grid[c] && c !== G.hero) empty.push(c); shuffle(empty);
  const base = G.M.refill + (F.boss ? 3 : 0), minB = CFG.minBoard + (F.boss ? 5 : 0);                                   // the Hydra floor feeds more fodder: heads need a staircase every turn
  const n = all ? CFG.startFill + (F.boss ? 4 : 0) : Math.max(base, minB - (NC - 1 - empty.length)), fresh = empty.slice(0, n), cap = F.wallCap + G.M.wallAdd;   // limited refill, but never below a playable board
  let walls = Math.max(0, cap - G.grid.filter(isBig).length); if (!all) walls = Math.min(walls, Math.ceil(n / 2));    // director: restock big monsters toward the floor cap, at most half a refill
  for (const c of fresh) { const wall = walls > 0; if (wall) walls--; G.grid[c] = spawn(wall); }
  // guarantee: a killable 1 beside the hero, plus a second 1 touching the first, so a 2-chain always exists
  const isOne = c => G.grid[c] && G.grid[c].v === 1 && !G.grid[c].head && G.grid[c].mod !== 'A' && G.grid[c].mod !== 'B';
  const force = cands => { let pool = cands.filter(c => !G.grid[c]); if (!pool.length) pool = cands.filter(c => fresh.includes(c)); if (!pool.length) pool = cands.filter(c => G.grid[c] && !G.grid[c].head);
    if (!pool.length) return -1; const c = pool[(rng() * pool.length) | 0]; G.grid[c] = { v:1, mod:'', s:0, sh:0, rage:0 }; return c; };
  let a = NB8[G.hero].find(c => isOne(c) && NB8[c].some(d => d !== G.hero && isOne(d))); if (a == null) a = NB8[G.hero].find(isOne); if (a == null) a = force(NB8[G.hero]);

// ---------- rules ----------
const need = m => m.v + (m.mod === 'A' && !G.perks.lockpick ? 1 : 0);
const bladeStart = () => G.perks.start2 ? 2 : 1;
const stairWidth = () => G.perks.temper ? 2 : 1;
const grows = (pw, val, k) => val >= pw - stairWidth() || (G.perks.fourth && k % 4 === 0);   // STAIRCASE: only kills near the blade's power grow it
function headCounts(g) { const a = new Array(12).fill(0); for (const m of g) if (m && m.head) a[m.v]++; return a; }
function minHead(a) { for (let v = 1; v < 12; v++) if (a[v]) return v; return 99; }
const killable = (m, pw, hm, hk = 0) => need(m) <= pw && (!m.head || (m.v <= hm && hk < CFG.headsPerTurn));   // Hydra: ascending order, at most headsPerTurn cuts per turn
function stepsFor(path) { const g = G.grid, out = []; let pw = bladeStart(), k = 0; for (const c of path) { const m = g[c];
  if (m) { k++; const val = need(m), grow = grows(pw, m.v, k); if (grow) pw++; out.push({ c, kill:1, val, v:m.v, pw, grow, head:!!m.head }); } else out.push({ c, kill:0, pw, grow:0 }); } return out; }
function pathLegal(path) { if (!path.length) return false; const g = G.grid, alive = headCounts(g), used = new Set([G.hero]); let pw = bladeStart(), k = 0, ghost = 0, prev = G.hero, hk = 0;
  for (const c of path) { if (c < 0 || c >= NC || used.has(c) || !NB8[prev].includes(c)) return false; used.add(c); const m = g[c];
    if (!m) { if (!G.perks.ghost || ghost) return false; ghost++; } else { if (!killable(m, pw, minHead(alive), hk)) return false; k++; if (grows(pw, m.v, k)) pw++; if (m.head) { alive[m.v]--; hk++; } } prev = c; }
  return k > 0; }
function simulate(act) {                                                 // pure: state -> event list + summary. Shared by preview, bots and playback
  const g = G.grid.map(m => m ? { v:m.v, mod:m.mod, head:m.head, rage:m.rage } : null), ev = [], P = G.perks, booms = [], safeMode = !!G.tut, alive = headCounts(g);
  let pos = G.hero, k = 0, pw = bladeStart(), heals = 0, coll = 0, headsK = 0, ghost = 0, heal = 0;
  const hurt = (list, c0, type) => { const q = [[list, c0, type]];
    while (q.length) { const [cells, src, t] = q.shift(), vic = [];
      for (const c of cells) { const m = g[c]; if (!m || m.head) continue; m.v -= (t === 'thorn' ? CFG.thornDmg : CFG.bombDmg);
        if (m.v <= 0) { g[c] = null; coll++; if (m.mod === 'B') { booms.push(c); q.push([NB8[c], c, 'boom']); } } vic.push({ c, v:Math.max(0, m.v) }); }
      ev.push({ t, c:src, vic }); } };
  if (act.type === 'chain') {
    for (const c of act.path) { const m = g[c];
      if (m) { if (!killable(m, pw, minHead(alive), headsK)) break; g[c] = null; k++; const grow = grows(pw, m.v, k); if (grow) pw++; pos = c;
        let h = 0; if (P.leech && m.v === 1 && heals < 3) { heals++; h = 1; heal++; } if (m.head) { headsK++; alive[m.v]--; }
        ev.push({ t:'move', c, kill:1, k, pw, grow, heal:h, v:m.v, head:!!m.head }); if (m.mod === 'B') { booms.push(c); hurt(NB8[c], c, 'boom'); } }
      else { if (!P.ghost || ghost) break; ghost++; pos = c; ev.push({ t:'move', c, kill:0, k, pw, grow:0, heal:0 }); } }
    if (P.thorns && k) hurt(NB4[pos], pos, 'thorn');
  } else if (act.type === 'rest') { heal += P.patience ? 3 : 1; ev.push({ t:'rest', heal }); }
  else if (act.type === 'shove') { const c = act.c, m = g[c]; g[c] = null; g[G.hero] = m; pos = c; ev.push({ t:'shove', from:G.hero, to:c });
    if (P.bull && m) { m.v -= 1; if (m.v <= 0) { g[G.hero] = null; coll++; } ev.push({ t:'shoveHit', c:G.hero, v:Math.max(0, m.v) }); } }
  const chainHeal = k >= CFG.healFrom ? Math.min(CFG.healCap, k - CFG.healFrom + 1) : 0; heal += chainHeal;
  const pts = k * k + coll + headsK * CFG.headBonus + (P.pact ? k + coll : 0);
  ev.push({ t:'score', n:k, pts, heal:chainHeal, coll, c:pos, heads:headsK });
  let dmg = 0, steal = 0; const hits = [], rage = [];
  if (!safeMode) {
    for (const b of booms) if (cheb(b, pos) <= 1 && !P.bombsuit) { dmg += CFG.bombDmg; hits.push({ c:b, dmg:CFG.bombDmg, bomb:1 }); ev.push({ t:'hit', c:b, dmg:CFG.bombDmg, bomb:1 }); }
    for (const c of NB4[pos]) { const m = g[c]; if (!m) continue;
      if (m.mod === 'T') { steal++; hits.push({ c, steal:1 }); ev.push({ t:'steal', c }); }
      else if (P.ones && m.v === 1) continue;
      else { dmg += m.v; hits.push({ c, dmg:m.v, v:m.v, head:!!m.head, rage:!!m.rage }); ev.push({ t:'hit', c, dmg:m.v }); if (!m.head && m.v < CFG.maxVal) rage.push(c); } } }
  if (rage.length) ev.push({ t:'rage', cells:rage }); ev.push({ t:'end' });
  const lethal = dmg >= G.hp + heal && !(P.wind && !G.windUsed);
  const util = pts + 5 * heal - CFG.hpValue * dmg - CFG.thiefSteal * steal - 4 * rage.length - (lethal ? 1000 : 0) - (act.type === 'shove' ? 1 : 0);   // risk-adjusted value used by previews' colour and by bots
  return { type:act.type, path:act.path || [], c:act.c, ev, n:k, pts, heal, dmg, steal, hits, rage:rage.length, end:pos, coll, headsK, lethal, util }; }
const canAct = () => G && G.state === 'play' && !G.queue.length && UI.screen === 'game' && !UI.help;
function run(sim) { G.queue = sim.ev; G.qt = 0; G.path = []; G.sim = null; G.shoveMode = false; G.blade = bladeStart(); if (G.instant) flush(); return true; }
function flush() { while (G.queue.length) doEvent(G.queue.shift()); G.freeze = 0; }
function act(a) { if (!canAct()) return false;
