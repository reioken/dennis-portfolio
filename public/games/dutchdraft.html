// ============================ STORAGE / AUDIO ============================

let ac = null, master = null, noiseBuf = null;
function initAudio() { if (ac) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try { ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, 4410, 44100); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) { ac = null; } }

}

  s.buffer = noiseBuf; fl.type = 'lowpass'; fl.frequency.value = freq; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d); s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02); }

// ============================ UNITS / PURCHASE BONUSES (pure) ============================
let uid = 0;
function makeUnit(d) { return { id: ++uid, name: d.name, tribe: d.tribe, atk: d.atk, hp: d.hp, value: d.value, kw: d.kw, paid: 0, bAtk: 0, bHp: 0, legend: !!d.legend, lvl: 0 }; }
// elapsed is kept in the signature for compatibility; all price-aware keywords now depend only on the PRICE so they read the same at any tick speed.
// start = the price the lot started at (20, or 30 for a legendary lot) so PATIENT reads "for every 3 gold the price has dropped".
function purchaseBonus(kw, price, elapsed, goldAfter, otherGolds, start) {
  start = start || CFG.startPrice;
  switch (kw) {
    case 'Bargain': return price <= 8 ? { a: 2, h: 2 } : { a: 0, h: 0 };
    case 'Prestige': return price >= 15 ? { a: 3, h: 0 } : { a: 0, h: 0 };
    case 'Spite': { const n = otherGolds.filter(g => g < goldAfter).length; return { a: n, h: n }; }
    case 'Patient': { const n = Math.floor((start - price) / 3); return { a: n, h: n }; }
    case 'Impulse': return price >= 18 ? { a: 0, h: 4 } : { a: 0, h: 0 };
  } return { a: 0, h: 0 };
}
function playerBonus(u, price) { // keyword bonus + upgrade hooks (haggler / showman), used for BOTH the preview and the purchase
  const b = purchaseBonus(u.kw, price, 0, G.gold - price, G.rivals.map(r => r.gold), G.lotStart);
  if (has('haggler') && price <= 8) { b.a++; b.h++; } if (has('showman') && price >= 15) b.a += 2; return b;
}
function applyPurchase(u, price, b) { u.paid = price; u.bAtk = b.a; u.bHp = b.h; u.atk += b.a; u.hp += b.h; return u; }

// ============================ BATTLE (pure functions) ============================
function prepTeam(team, mods) {
  mods = mods || {}; const need = mods.need || 3;
  const f = team.map(u => ({ id: u.id, name: u.name, tribe: u.tribe, kw: u.kw, atk: Math.max(1, u.atk), hp: u.hp, dbl: false, revive: false, tb: false, bAtk: 0, bHp: 0, legend: !!u.legend, lvl: u.lvl || 0 }));
  const n = {}; f.forEach(u => n[u.tribe] = (n[u.tribe] || 0) + 1);
  f.forEach(u => { if (n[u.tribe] >= need && u.tribe !== 'Token') { u.tb = true;
    if (u.tribe === 'Beast') { u.atk++; u.hp++; } else if (u.tribe === 'Undead') u.revive = true;
    else if (u.tribe === 'Machine') u.hp += 2; else if (u.tribe === 'Mage') u.dbl = true; } });
  f.forEach((u, i) => { if (u.kw === 'Rally' && f[i + 1]) f[i + 1].atk++; });
  if (mods.all) f.forEach(u => { u.atk += mods.all; u.hp += mods.all; });
  if (f.length) { f[0].hp += mods.front || 0; f[f.length - 1].atk += mods.rear || 0; f[f.length - 1].hp += mods.rear || 0; }
  return f;
}
function battleStep(A, B) { // mutates fighter arrays, returns events for animation
  const ev = [], hits = [];
  const strike = (src, T, side) => { const d = src.atk * (src.dbl ? 2 : 1); src.dbl = false;
    for (let i = 0; i < (src.kw === 'Cleave' ? 2 : 1) && i < T.length; i++) hits.push({ side, idx: i, dmg: d, u: T[i] }); };
  strike(A[0], B, 'B'); strike(B[0], A, 'A');
  hits.forEach(h => { h.u.hp -= h.dmg; ev.push({ side: h.side, idx: h.idx, dmg: h.dmg }); });
  [[A, 'A'], [B, 'B']].forEach(([T, side]) => { for (let i = T.length - 1; i >= 0; i--) { const u = T[i]; if (u.hp > 0) continue;
    if (u.revive) { u.revive = false; u.hp = 1; ev.push({ side, idx: i, note: 'REVIVED' }); }
    else if (u.kw === 'Deathrattle') { T[i] = { id: ++uid, name: 'Token', tribe: 'Token', kw: '', atk: 2, hp: 2, dbl: false, revive: false, bAtk: 0, bHp: 0 }; ev.push({ side, idx: i, note: 'TOKEN' }); }
    else { T.splice(i, 1); ev.push({ side, idx: i, note: 'DEFEATED' }); } } });

}
function forecast(teamA, teamB, mA, mB) { // deterministic battle => exact preview
  const A = prepTeam(teamA, mA), B = prepTeam(teamB, mB); let steps = 0; const hp = T => T.reduce((s, u) => s + Math.max(0, u.hp), 0), a0 = hp(A), b0 = hp(B);
  while (A.length && B.length && steps < 300) { battleStep(A, B); steps++; }
  const winner = A.length && !B.length ? 'A' : B.length && !A.length ? 'B' : 'draw';
  const margin = winner === 'A' ? hp(A) / Math.max(1, a0) : winner === 'B' ? hp(B) / Math.max(1, b0) : 0;
  return { winner, steps, capped: steps >= 300, left: winner === 'A' ? A.length : winner === 'B' ? B.length : 0, share: winner === 'A' ? 0.55 + 0.4 * margin : winner === 'B' ? 0.45 - 0.4 * margin : 0.5 };
}
function resolveBattle(teamA, teamB, mA, mB) { return forecast(teamA, teamB, mA, mB); }

// ============================ GAME FLOW ============================
const UI = { screen: 'start', help: false, page: 0, hard: false, fadeT: 0, overT: 0 };
const seenTips = {};
let G = null, BTNS = [], mx = -1, my = -1, mouseDown = false;
const rnd = (a, b) => a + Math.random() * (b - a);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function has(id) { return !!(G && G.perks[id]); }
function setPhase(p) { G.phase = p; UI.fadeT = 0; }
function tip(id, text, force) { if (seenTips[id] && !force) return; seenTips[id] = 1; G.tip = { id, text, t: 0 }; }

function score() { return G ? 100 * G.stats.wins + (G.wonAt ? 50 * G.wonAt.lives : 0) : 0; }
function medalFor(s) { for (const m of MEDALS) if (s >= m[1]) return m[0]; return ''; }
function playerMods() { return { front: has('front') ? 4 : 0, rear: has('rear') ? 2 : 0, need: has('banner') ? 2 : 3 }; }
function oppMods() { return { all: G.finale ? CFG.finaleBoost : 0 }; }
function strength(u) { return u.atk + u.hp; }
function weakestIdx(team, key) { let k = 0; team.forEach((u, i) => { if (key(u) < key(team[k])) k = i; }); return k; }

function startRun() {
  Object.assign(CFG, MODES[UI.hard ? 'HARD' : 'NORMAL']); UI.screen = 'game'; UI.help = false;
  G = { phase: 'lot', round: 0, lives: CFG.lives, maxLives: CFG.lives, gold: 0, goldShown: 0, cap: CFG.cap, team: [], sel: -1, time: 0, fx: [], shake: 0, banner: null, deny: -9, ff: false,

    rivals: RIVALS.map(r => Object.assign({}, r, { mult: r.mult * CFG.multScale, gold: 0, team: [], val: 0, lean: false, leanAmt: 0, reactT: 0, leanRange: CFG.leanRange, bluff: null, champion: null })),
    stats: { lots: 0, bought: 0, spent: 0, sniped: 0, discarded: 0, wins: 0, losses: 0, leveled: 0, merged: 0, legends: 0, bluffed: 0 }, won: false, lastResult: null, cause: '', advice: '', lotStart: CFG.startPrice };
  G.rivals.forEach(r => { r.team = shuffle(UNITS.filter(u => u.value <= CFG.rivalStartMaxValue)).slice(0, CFG.rivalStartUnits).map(makeUnit).sort((a, b) => b.hp - a.hp); });

function finaleAt(round) { return !G.endless && (CFG.goalType === 'wins' ? G.stats.wins === CFG.goalN - 1 : round === CFG.goalN); }

// Opponent for a normal round on NORMAL: round 1 Moss (the slow buyer), then the weaker of Vex/Blaze, then the stronger, then the 2nd strongest line overall (so round 4 is not a lull). HARD/endless rotate.
function oppFor(round) { if (G.endless || !CFG.staged) return G.rivals[(round - 1) % 3]; const s = G.rivals.slice().sort((a, b) => teamStr(a) - teamStr(b)), o = s.filter(r => r !== G.rivals[0]);
  return [G.rivals[0], o[0], o[1], s[1]][(round - 1) % 4]; }
function startRound() {
  G.round++; G.gold = Math.min(G.cap, G.gold + CFG.income + (has('pockets') ? 6 : 0) + (has('invest') ? 8 : 0)); G.slamUsed = false; G.history = [];
  G.finale = finaleAt(G.round);
  G.opp = G.nextOpp || oppFor(G.round); G.nextOpp = null;
  G.rivals.forEach(r => { // rivals also use the gold sink: once per round, spare gold above a reserve levels their strongest unit (+2/+2)
    if (G.round > 1 && r.team.length) { const b = r.team.reduce((m, u) => strength(u) > strength(m) ? u : m); const c = levelCost(b); if (b.lvl < LEVEL_MAX && r.gold >= c + CFG.rivalReserve) { r.gold -= c; b.lvl++; b.atk += 2; b.hp += 2; r.trained = b.name; } else r.trained = null; }
    r.gold = Math.min(CFG.cap, r.gold + CFG.rivalIncome + CFG.rivalGrowth * (G.round - 1)); });
  if (G.finale) { G.opp = G.rivals.slice().sort((a, b) => teamStr(b) - teamStr(a))[0]; // champion = strongest line
    if (!G.opp.champion) { const ch = makeUnit(shuffle(LEGENDS)[0]); G.opp.champion = ch; // the champion rival brings one legendary unit
      if (G.opp.team.length >= CFG.maxTeam) G.opp.team.splice(weakestIdx(G.opp.team, x => x.value), 1); G.opp.team.push(ch); G.opp.team.sort((a, b) => b.hp - a.hp); } }
  const pool = CFG.staged ? UNITS.filter(u => KW_STAGE[u.kw] <= G.round && (G.round > 1 || u.value <= 11)) : UNITS;
  G.lotIdx = 0; G.lots = shuffle(pool).slice(0, CFG.lots).map(makeUnit);
  if (G.finale) { const leg = shuffle(LEGENDS).slice(0, 2).map(makeUnit); G.lots[1] = leg[0]; G.lots[4] = leg[1]; } // Grand Auction: 2 legendary lots (2nd and last)
  if (G.finale) tip('finale' + G.round, FINALE_NAME + ': ' + G.opp.name + ' brings a champion (' + G.opp.champion.name + ') and every unit in their line gets +' + CFG.finaleBoost + '/+' + CFG.finaleBoost + '. Two LEGENDARY units go on sale (price starts at ' + LEGEND_START + '). Win this battle to win the run!', true);
  else if (CFG.staged && G.round >= 2 && G.round <= 4) { const kws = Object.keys(KW_STAGE).filter(k => KW_STAGE[k] === G.round); tip('stage' + G.round, 'NEW in round ' + G.round + ': ' + kws.join(' and ').toUpperCase() + ' units. Their bonus depends on the PRICE you pay - read the card.'); }
  startLot();
}
function startLot() {
  const u = G.lot = G.lots[G.lotIdx]; G.lotStart = u.legend ? LEGEND_START : CFG.startPrice; G.price = G.lotStart; G.elapsed = 0; setPhase('lot'); G.banner = null; G.stats.lots++;
  G.guide = G.round === 1 && G.lotIdx === 0; G.practice = G.guide && CFG.practice;
  G.rivals.forEach(r => { r.reactT = 0; r.lean = false; r.bluff = null;
    const wants = r.team.length < CFG.maxTeam || u.value > r.team[weakestIdx(r.team, x => x.value)].value;
    const syn = r.team.filter(x => x.tribe === u.tribe).length >= 2 ? CFG.synergy : 1;
