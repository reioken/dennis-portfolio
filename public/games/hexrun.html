(function buildBoard(){const a=[];for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++)if(Math.abs(q+r)<=2)a.push({q,r});

 a.forEach((c,i)=>{KEY[c.q+','+c.r]=i;G.cells.push({q:c.q,r:c.r,stack:[],stamp:0,hidden:0,drop:0,locked:0,edge:Math.max(Math.abs(c.q),Math.abs(c.r),Math.abs(c.q+c.r))===2});});})();

function row(b){const T=TABLES[G.hard?'hard':'normal'];if(b<=T.length)return T[b-1];

// ---------- stack rules ----------
function runColor(s){for(let i=s.length-1;i>=0;i--)if(s[i]!==WILD)return s[i];return WILD;}

const match=(a,b)=>a===b||a===WILD||b===WILD;
const threshold=col=>(col===BLUE&&has('blue7'))?CLEAR_AT-2:CLEAR_AT; // hook: blue7
function links(i,B){const C=(B||G).cells,c=C[i],out=[]; // neighbours holding stacks (hook: jump over one empty cell)
 for(const[dq,dr]of DIRS){let j=KEY[(c.q+dq)+','+(c.r+dr)];if(j===undefined)continue;
  if(C[j].locked)continue; // locked cells block flows (no jumping over them either)
  if(!C[j].stack.length){if(!has('jump'))continue;j=KEY[(c.q+2*dq)+','+(c.r+2*dr)];if(j===undefined||!C[j].stack.length)continue;}
  out.push(j);}

function genStack(){const T=row(G.blind),nc=T[2],n=T[3]+rnd(T[4]-T[3]+1);let bands=Math.min(n,T[5][rnd(T[5].length)]);

 const sizes=Array(bands).fill(1);for(let k=bands;k<n;k++)sizes[rnd(bands)]++;
 const s=[];let prev=-9;for(const z of sizes){let c;do{c=rnd(nc);}while(c===prev);prev=c;for(let k=0;k<z;k++)s.push(c);}
 if(has('wild'))s[0]=WILD; // hook: wild base
 return s;}
function ensureMatch(){if(G.hard)return; // NORMAL fairness: at least one offered top colour matches a top colour on the board
 const tops=new Set(G.cells.filter(c=>c.stack.length).map(c=>runColor(c.stack))),idx=G.offers.map((o,i)=>o?i:-1).filter(i=>i>=0);
 if(!tops.size||!idx.length||idx.some(i=>tops.has(runColor(G.offers[i]))||runColor(G.offers[i])===WILD))return;
 for(let k=0;k<30;k++){const s=genStack();if(tops.has(runColor(s))){G.offers[idx[rnd(idx.length)]]=s;return;}}}
function deal(){G.offers=Array.from({length:has('plus1')?4:3},genStack);ensureMatch();G.dealId++;G.sel=0;} // hook: plus1
function reroll(){if(G.phase!=='play'||G.tut||G.help||G.rerolls<=0)return false;G.rerolls--;
 G.offers=G.offers.map(o=>o?genStack():null);ensureMatch();G.dealId++;G.pv=null;G.sel=G.offers.findIndex(o=>o);tone(660,0.08,'triangle',0.06);tone(880,0.1,'triangle',0.05,0.06);return true;}
// ---------- run / blind flow ----------
function startRun(){G.tut=null;G.help=false;G.endless=false;G.owned=[];G.carry=0;G.blind=0;G.cleared=0;G.total=0;G.runTime=0;G.tip=null;G.newMedal=false;G.stats={flows:0,clears:0,guard:0,discs:0,maxCascade:0};nextBlind();}

// ---------- resolve loop (deterministic state machine) ----------
function findFlow(B){const C=B.cells;let best=null,bk=-1;
 for(let i=0;i<C.length;i++){if(!C[i].stack.length)continue;
  for(const j of links(i,B)){if(j<i||!match(runColor(C[i].stack),runColor(C[j].stack)))continue;

function doClear(i){const R=G.R,p=cellPos(i),r=applyClear(G,i,++R.cascade),n=r.n;

function boardSig(){return G.cells.map(c=>c.stack.join('')).join('|');}
function stepResolve(dt){const R=G.R;R.t-=dt*(G.fast?8:1);

 if(G.phase==='pick'){if((G.pickT||0)<0.35)return;G.choices.forEach((m,k)=>{if(G.phase==='pick'&&inR(cardRect(k,G.choices.length)))pickMod(k);});return;}

 if(G.phase==='resolve'){G.fast=true;return;}
 if(inR(L.rerollBtn)){if(G.tut)endTutorial();else if(!reroll())sfx.bad();return;}
 const o=offerAt(G.mx,G.my);if(o>=0){G.sel=o;G.drag=true;sfx.ui();return;}
 if(G.sel!==null&&G.sel>=0&&G.hover>=0){if(!place(G.sel,G.hover)){sfx.bad();G.shake=3;}}}
function up(e){xy(e);G.isDown=false;if(!G.drag)return;G.drag=false;if(G.sel!==null&&G.hover>=0&&!G.cells[G.hover].stack.length)place(G.sel,G.hover);}
function key(k){if(k.length===1)k=k.toLowerCase();
 if(k==='Escape'){menu();return;}
 if(k==='m'){setMute(!G.muted);return;}
 if(k==='r'){if(G.phase!=='start')startRun();return;}
 if(k==='h'){if(G.phase!=='start')G.help=!G.help;return;}
 if(G.help){if(k==='Enter'||k===' ')G.help=false;return;}
 if(G.phase==='start'){if(k==='d')setHard(!G.hard);else if(k==='t')startTutorial();else if(k==='Enter'||k===' ')begin();return;}
 if(G.tut&&k==='s'){endTutorial();return;}
 if(G.tut&&G.tut.step===4){if(k==='Enter'||k===' ')endTutorial();return;}
 if(G.phase==='win'||G.phase==='over'){if(k==='d')setHard(!G.hard);else if(k==='Enter'||k===' '){if(G.phase==='win')keepGoing();else startRun();}return;}
 if(G.phase==='pick'){if(k>='1'&&k<='3'&&(G.pickT||0)>=0.35)pickMod(+k-1);return;}
 if(k==='x'){if(!reroll())sfx.bad();return;}
 if(k>='1'&&k<='4'&&G.phase==='play'&&G.offers[+k-1])G.sel=+k-1;}
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',xy);window.addEventListener('pointerup',up);
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>key(e.key));

for(let i=0;i<36;i++)G.motes.push({x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.006,vy:-0.002-Math.random()*0.005,r:1+Math.random()*1.5,a:0.08+Math.random()*0.14});
let last=0;function frame(ts){const dt=Math.min(0.05,((ts-last)/1000)||0);last=ts;update(dt);render();requestAnimationFrame(frame);}
window.HEXRUN={G,L:()=>L,MODS,TABLES,WIN_AT,row,budget,simulate,startRun,nextBlind,startTutorial,endTutorial,tutAllowed,place,pickMod,reroll,keepGoing,setHard,setMute,begin,toStart,update,render,resize,links,runColor,runLen,findFlow,down,up,key,medal,cellPos,offerPos,cardRect};
resize();requestAnimationFrame(frame);
