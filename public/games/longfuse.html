<body><canvas id="c"></canvas><script>
'use strict';
// ====================== CONFIG / DATA ======================
const N = 8, STEP = 0.2, GAMEID = 'longfuse';
const C = { bg: '#0b0d12', cyan: '#7cf5ff', red: '#ff5d73', gold: '#ffd166', green: '#9dff8a', text: '#e8ecf5', dim: '#aab3c5', panel: '#121622', line: '#232a3d' };
const MODES = {
  normal: { startHp: 6, freshTick: false, shove: true, windup: true, lunge: true, selfSafe: 1, lureFuse: 3, rate: 1, hpBonus: 0, healOnClear: 1 },
  hard:   { startHp: 4, freshTick: true,  shove: false, windup: false, lunge: false, selfSafe: 0, lureFuse: 1, rate: .75, hpBonus: 1, healOnClear: 0 },
};
const CFG = Object.assign({ mode: 'normal', firstTier: 40 /* score-reward tiers: 40, 160, 520, 1600... (score is squared, so tiers triple) */, medkitMax: 2, lurePips: 4, lureRange: 2, kickDist: 3, fuseCap: 9, spawnMinDist: 4, defuseMax: 2,
  minRegion: 10 /* a bomb may not shrink your reachable area below this: no bomb-wall fortress */, shoveCd: 3, mopUp: 5, bronze: 60, silver: 300, gold: 800 }, MODES.normal);
const TYPES = {
  walker:   { name: 'Walker',   tag: 'W', w: 6, hp: [1, 6], speed: 1, col: '#ff5d73', desc: 'moves 1 tile a turn' },
  runner:   { name: 'Runner',   tag: 'R', w: 3, hp: [1, 2], speed: 2, col: '#ff8552', desc: 'moves 2 tiles a turn' },
  defuser:  { name: 'Defuser',  tag: 'D', w: 2, hp: [2, 2], speed: 1, col: '#e0529c', defuse: 2, desc: 'adds +2 fuse to a bomb it touches' },
  shielded: { name: 'Shielded', tag: 'S', w: 2, hp: [3, 3], speed: 1, col: '#c9405a', minDmg: 3, desc: 'ignores bombs of 1-2 pips' },
  warden:   { name: 'Warden',   tag: 'X', w: 0, hp: [12, 12], speed: 1, col: '#ff3b4e', slow: true, heavy: true, dmg: 2, armour: 5, desc: '12 HP, armour caps each blast at 5 damage, moves every other turn (every turn once below half HP), hits for 2, too heavy to shove' },
  dummy:    { name: 'Training dummy', tag: 'T', w: 0, hp: [2, 2], speed: 0, col: '#8d94a6', still: true, desc: 'harmless - blow it up' },
};
const WAVES = [
  // every = turns per spawn (NORMAL); tuned with the handicapped bot: W1 ~100%, W2 ~90%, W3 ~75%, win ~45% (a human reads the forecast less reliably)
  { name: 'WAVE 1', len: 15, every: 1.6, types: ['walker'], hpMax: 2 },
  { name: 'WAVE 2', len: 15, every: 1.1, types: ['walker', 'runner'], hpMax: 3 },
  { name: 'WAVE 3', len: 15, every: .9,  types: ['walker', 'runner', 'defuser'], hpMax: 4 },
  { name: 'WAVE 4', len: 16, every: .8,  types: ['walker', 'runner', 'defuser', 'shielded'], hpMax: 5 },
  { name: 'FINALE: THE WARDEN', len: 30, every: 1, types: ['walker', 'runner', 'defuser', 'shielded'], hpMax: 3, boss: true },
];
const ITEMS = [ // data row + one rule hook each (grep "items.<id>")
  { id: 'even',   g: 'x2', name: 'DOUBLE TIME',  desc: 'Even-numbered bombs tick twice per turn.', hint: 'Changes timing: a 6 blows as fast as a 3.' },
  { id: 'plus',   g: '+',  name: 'CROSSFIRE',    desc: 'Blasts become a plus shape with reach = pips.', hint: 'Changes aiming: snipe down rows and columns.' },
  { id: 'kick',   g: '>>', name: 'BOOT',         desc: 'Moving into a bomb kicks it 3 tiles.', hint: 'Deliver a ticking bomb into a crowd.' },
  { id: 'remote', g: '!!', name: 'DETONATOR',    desc: 'Once per wave, F blows every bomb right now.', hint: 'Cash in a big die the moment the crowd is right.' },
  { id: 'reroll', g: '?',  name: 'BLOOD DICE',   desc: 'X re-rolls your die for 1 HP.', hint: 'Risky: pay health now for the right number.' },
  { id: 'greed',  g: '$',  name: 'GREED',        desc: 'Lose 2 HP now. Every blast scores +50%.', hint: 'Risk now, reward for the rest of the run.' },
  { id: 'arm',    g: '<>', name: 'STRONG ARM',   desc: 'Shove pushes 2 tiles and recharges in 2 turns.', hint: 'Throw enemies into your own blasts.' },
  { id: 'magnet', g: '@',  name: 'MAGNET',       desc: 'Lure works from 3 tiles, and for 3-pip bombs too.', hint: 'Bigger crowds per blast = squared score.' },
  { id: 'loaded', g: '6',  name: 'WEIGHTED DICE', desc: 'Every 1 you roll becomes a 6.', hint: 'No more duds, more slow heavy bombs.' },
  { id: 'immune', g: '()', name: 'THICK SKIN',   desc: 'Your own bombs of 3 pips or fewer cannot hurt you.', hint: 'Fight at point-blank range with small dice.' },
  { id: 'vest',   g: '[]', name: 'BLAST VEST',   desc: 'The first own-blast hit each wave is ignored.', hint: 'Forgives one mistake per wave.' },
  { id: 'stash',  g: '+1', name: 'DEEP POCKET',  desc: '+1 stash slot.', hint: 'Save more big dice for the right moment.' },
  { id: 'hp',     g: '+2', name: 'MEDKIT',       desc: '+2 max HP and heal 2.', hint: 'Plain and reliable (offered twice per run).' },
  { id: 'heal',   g: 'HP', name: 'PATCH UP',     desc: 'Heal 2 HP.', hint: 'Often on offer: take it when a wave went badly.' },
];
const D4 = [[0, -1], [1, 0], [0, 1], [-1, 0]], D8 = [...D4, [1, -1], [1, 1], [-1, 1], [-1, -1]];
const PIPS = { 1: [[.5, .5]], 2: [[.27, .27], [.73, .73]], 3: [[.27, .27], [.5, .5], [.73, .73]], 4: [[.27, .27], [.73, .27], [.27, .73], [.73, .73]],
  5: [[.27, .27], [.73, .27], [.5, .5], [.27, .73], [.73, .73]], 6: [[.27, .25], [.73, .25], [.27, .5], [.73, .5], [.27, .75], [.73, .75]] };

// ====================== PURE-ISH GAME LOGIC (operates on a plain JSON state S) ======================
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inB = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const bombAt = (S, x, y) => S.bombs.find(b => b.x === x && b.y === y);
const enemyAt = (S, x, y) => S.enemies.find(e => e.x === x && e.y === y);
const free = (S, x, y) => inB(x, y) && !bombAt(S, x, y) && !enemyAt(S, x, y) && !(S.px === x && S.py === y);
const md = (S, e) => Math.abs(e.x - S.px) + Math.abs(e.y - S.py);
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const ticksOf = (S, b) => (S.items.even && b.pips % 2 === 0) ? 2 : 1;
const turnsLeft = (S, b) => Math.max(1, Math.ceil(b.fuse / ticksOf(S, b)) + (b.fresh && !CFG.freshTick ? 1 : 0));   // 1 = explodes when this turn ends

const tierAt = n => CFG.firstTier * (3 ** (n + 1) - 1) / 2;
const canShove = S => !!(CFG.shove || S.items.arm);
function draw(S) { if (!S.bag.length) S.bag = shuffle([1, 2, 3, 4, 5, 6, 1, 2, 3, 4, 5, 6]); const v = S.bag.pop(); return v === 1 && S.items.loaded ? 6 : v; }
function waveDef(S) {
  if (S.wave < WAVES.length) return WAVES[S.wave];
  const k = S.wave - WAVES.length; return { name: 'ENDLESS ' + (k + 1), len: 16, every: Math.max(.5, .8 - k * .05), types: ['walker', 'runner', 'defuser', 'shielded'], hpMax: 6, boss: k % 3 === 2 };
}
function newState(tut) {
  const S = { phase: 'player', turn: 1, score: 0, tier: 0, hp: CFG.startHp, maxHp: CFG.startHp, px: 3, py: 4, bombs: [], enemies: [], marks: [], stash: [], items: {}, bag: [], nid: 1,
    wave: 0, wt: 1, spawnAcc: 0, seen: {}, picks: [], pickWhy: '', shoveCd: 0, detReady: false, vest: false, kills: 0, blasts: 0, maxChain: 0, bestBlast: 0, cause: null, offer: null,
    sim: false, won: false, winHow: '', endless: false, tut: tut ? 1 : 0, cleared: 0 };
  S.die = draw(S); S.next = draw(S);
  if (tut) { S.die = 2; S.next = 3; S.enemies.push({ id: S.nid++, x: 5, y: 4, type: 'dummy', hp: 2, max: 2 }); } else startWave(S);
  return S;
}
function startWave(S) {
  const W = waveDef(S); S.wt = 1; S.spawnAcc = 0; S.detReady = !!S.items.remote; S.vest = !!S.items.vest;
  if (W.boss) addMark(S, 'warden');
  addMark(S, W.types.find(t => !S.seen[t]));   // a wave's new enemy type always shows up first so it can be introduced
  fx(S, 'wave', W);
}
function addMark(S, force) {
  const W = waveDef(S), pool = W.types; let tot = 0; for (const k of pool) tot += TYPES[k].w;
  let r = Math.random() * tot, type = pool[0]; for (const k of pool) { r -= TYPES[k].w; if (r < 0) { type = k; break; } }
  if (force) type = force;
  const [lo, hi] = TYPES[type].hp, cap = Math.max(lo, Math.min(hi, W.hpMax + CFG.hpBonus));
  for (let i = 0; i < 40; i++) {
    const k = rnd(N), [x, y] = [[k, 0], [k, N - 1], [0, k], [N - 1, k]][rnd(4)];
    if (free(S, x, y) && !S.marks.some(m => m.x === x && m.y === y) && Math.abs(x - S.px) + Math.abs(y - S.py) >= CFG.spawnMinDist) {
      const m = { x, y, type, hp: lo + rnd(cap - lo + 1) }; S.marks.push(m); if (!S.seen[type]) { S.seen[type] = 1; fx(S, 'newtype', m); } return;
    }
  }
}
function spawnMarks(S) {
  for (const m of [...S.marks]) if (free(S, m.x, m.y)) { // a blocked marker simply waits
    S.marks.splice(S.marks.indexOf(m), 1);
    const e = { id: S.nid++, x: m.x, y: m.y, type: m.type, hp: m.hp, max: m.hp }; S.enemies.push(e); fx(S, 'spawn', e);
  }
}
function blastCells(S, x, y, p) {
  const c = [];
  if (S.items.plus) { c.push([x, y]); for (const [dx, dy] of D4) for (let i = 1; i <= p; i++) if (inB(x + dx * i, y + dy * i)) c.push([x + dx * i, y + dy * i]); }
  else for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) if (inB(x + i, y + j)) c.push([x + i, y + j]);
  return c;
}
function kickDest(S, b, dx, dy) { let x = b.x, y = b.y, n = 0; while (n < CFG.kickDist && free(S, x + dx, y + dy)) { x += dx; y += dy; n++; } return n ? [x, y] : null; }
function enclosed(S, bx, by) { // would a bomb at bx,by leave the player a reachable area smaller than CFG.minRegion?
  const seen = new Uint8Array(N * N), q = [S.py * N + S.px]; seen[q[0]] = 1; let n = 0;
  while (q.length) {
    const c = q.pop(), cx = c % N, cy = c / N | 0; if (++n >= CFG.minRegion) return false;
    for (const [dx, dy] of D4) { const x = cx + dx, y = cy + dy, i = y * N + x; if (!inB(x, y) || seen[i] || (x === bx && y === by) || bombAt(S, x, y)) continue; seen[i] = 1; q.push(i); }
  }
  return true;
}
function legalActions(S) {
  if (S.phase === 'pick') return S.offer.map((_, i) => ({ t: 'pick', i }));
  if (S.phase === 'won') return [{ t: 'continue' }];
  if (S.phase !== 'player') return [];
  const A = [{ t: 'wait' }];
  for (const [dx, dy] of D4) {
    const x = S.px + dx, y = S.py + dy; if (!inB(x, y)) continue;
    const e = enemyAt(S, x, y); if (e) { if (canShove(S) && !S.shoveCd && !TYPES[e.type].heavy) A.push({ t: 'shove', dx, dy }); continue; }
    const b = bombAt(S, x, y); if (!b || (S.items.kick && kickDest(S, b, dx, dy))) A.push({ t: 'move', dx, dy });
  }
  for (const [dx, dy] of D8) if (free(S, S.px + dx, S.py + dy) && !enclosed(S, S.px + dx, S.py + dy)) for (let src = S.die ? 0 : 1; src <= S.stash.length; src++) A.push({ t: 'place', x: S.px + dx, y: S.py + dy, src });
  if (S.die && S.stash.length < stashCap(S)) A.push({ t: 'stash' });
  if (S.items.reroll && S.hp > 1) A.push({ t: 'reroll' });
  if (S.items.remote && S.detReady && S.bombs.length) A.push({ t: 'det' });
  return A;
}
const isLegal = (S, a) => { const k = JSON.stringify(a); return legalActions(S).some(b => JSON.stringify(b) === k); };

// Applies the player's action. Returns true if it consumes the turn.
function applyAction(S, a) {
  if (a.t === 'pick') {
    const id = S.offer[a.i];
    if (id === 'hp') { S.maxHp += 2; S.hp += 2; S.medkits = (S.medkits || 0) + 1; } else if (id === 'heal') S.hp = Math.min(S.maxHp, S.hp + 2); else { S.items[id] = (S.items[id] || 0) + 1; if (id === 'greed') S.hp = Math.max(1, S.hp - 2); if (id === 'remote') S.detReady = true; if (id === 'vest') S.vest = true; }
    S.offer = null; fx(S, 'pick'); nextPhase(S); return false;
  }
  if (a.t === 'continue') { S.endless = true; nextPhase(S); return false; }
  if (a.t === 'reroll') { S.hp--; S.die = draw(S); fx(S, 'reroll'); return false; }
  if (a.t === 'move') {
    const x = S.px + a.dx, y = S.py + a.dy, b = bombAt(S, x, y);
    if (b) { const d = kickDest(S, b, a.dx, a.dy); b.x = d[0]; b.y = d[1]; fx(S, 'kick'); }
    S.px = x; S.py = y; fx(S, 'move');
  } else if (a.t === 'shove') {
    const e = enemyAt(S, S.px + a.dx, S.py + a.dy); let n = S.items.arm ? 2 : 1;
    while (n-- && free(S, e.x + a.dx, e.y + a.dy)) { e.x += a.dx; e.y += a.dy; }
    e.dazed = 1; e.wind = 0; S.shoveCd = S.items.arm ? 2 : CFG.shoveCd; fx(S, 'shove', e);
  } else if (a.t === 'place') {
    const p = a.src ? S.stash.splice(a.src - 1, 1)[0] : S.die; if (!a.src) S.die = 0;
    const b = { id: S.nid++, x: a.x, y: a.y, pips: p, fuse: p, fresh: true }; S.bombs.push(b); fx(S, 'place', b);
  } else if (a.t === 'stash') { S.stash.push(S.die); S.die = 0; fx(S, 'stash'); }
  else if (a.t === 'det') { S.detReady = false; for (const b of S.bombs) { b.fuse = 0; b.fresh = false; } fx(S, 'det'); }
  return true;
}
function nextPhase(S) {
  while (S.score >= tierAt(S.tier)) { S.tier++; S.picks.push('score'); }
  if (S.won && !S.endless) { S.phase = 'won'; return; }
  if (S.picks.length) {
    S.pickWhy = S.picks.shift();
    const pool = ITEMS.filter(it => it.id === 'hp' ? (S.medkits || 0) < CFG.medkitMax : it.id === 'stash' ? (S.items.stash || 0) < 2 : it.id === 'greed' ? !S.items.greed && S.hp > 2 : it.id !== 'heal' && !S.items[it.id]).map(it => it.id);
    S.offer = shuffle(pool).slice(0, 2 + (pool.length >= 3 && Math.random() < .5 ? 1 : 0)); S.offer.push('heal'); S.offer = shuffle(S.offer).slice(0, 3);   // PATCH UP is on the table about half the time, always once the pool runs low
    S.phase = 'pick'; fx(S, 'offer');
  } else S.phase = 'player';
}
function lureBomb(S, e) { // LURE: enemies near a big bomb that is about to blow get curious and drift toward it
  if (TYPES[e.type].still) return null; const lp = S.items.magnet ? 3 : CFG.lurePips, lr = CFG.lureRange + (S.items.magnet ? 1 : 0); let best = null, bd = 99;
  for (const b of S.bombs) { if (b.pips < lp || Math.ceil(b.fuse / ticksOf(S, b)) > CFG.lureFuse) continue; const d = cheb(e, b); if (d <= lr && d < bd) { bd = d; best = b; } }
  return best;
}
function willLure(S, b) { // UI helper: will this bomb lure during the coming enemy phase?
  const f = b.fuse - (b.fresh && !CFG.freshTick ? 0 : ticksOf(S, b)); return b.pips >= (S.items.magnet ? 3 : CFG.lurePips) && f > 0 && Math.ceil(f / ticksOf(S, b)) <= CFG.lureFuse;
}
// End-of-turn sequence as a generator: each yield = seconds to wait before the next step. Simulation just drains it.
function* endTurn(S) {
  for (const b of S.bombs) { if (CFG.freshTick || !b.fresh) b.fuse -= ticksOf(S, b); b.fresh = false; }   // (1) tick
  fx(S, 'tick'); yield S.bombs.length ? STEP : 0.03;
  let due; while ((due = S.bombs.find(b => b.fuse <= 0))) { yield* blastGroup(S, due); if (S.hp <= 0) { S.phase = 'dying'; return; } }

  for (const e of order) {
    const T = TYPES[e.type]; e.lured = 0;
    if (e.dazed) { e.dazed = 0; e.wind = 0; continue; }
    if (T.still) continue;
    const lb = lureBomb(S, e);
    if (lb) {
      e.lured = 1; e.wind = 0; fx(S, 'lure', e); let best = null, bc = cheb(e, lb), bm = Math.abs(e.x - lb.x) + Math.abs(e.y - lb.y);
      if (bc > 1) for (const [dx, dy] of D4) { const p = { x: e.x + dx, y: e.y + dy }, c = cheb(p, lb), m = Math.abs(p.x - lb.x) + Math.abs(p.y - lb.y); if (free(S, p.x, p.y) && (c < bc || (c === bc && m < bm))) { bc = c; bm = m; best = p; } }
      if (best) { e.x = best.x; e.y = best.y; moved = true; } continue;
    }

    const lunge = e.wind && CFG.lunge; e.wind = 0; if (T.slow && e.hp * 2 > e.max) { e.rest = e.rest ? 0 : 1; if (e.rest) continue; }   // the Warden rests every other turn until it is below half HP: then it is enraged and moves every turn
    for (let i = 0; i < (lunge ? 1 : T.speed); i++) { if (md(S, e) === 1) break; const s = enemyStep(S, e); if (!s) break; e.x = s[0]; e.y = s[1]; moved = true; }

function waveCheck(S) {
  if (S.tut) {
    const d = S.enemies.find(e => e.type === 'dummy');

    else S.tut = S.bombs.some(b => blastCells(S, b.x, b.y, b.pips).some(c => c[0] === d.x && c[1] === d.y)) ? 2 : 1;

}
function clearWave(S, how) {
  for (const e of S.enemies) fx(S, 'flee', e); S.enemies = []; S.marks = [];
  S.hp = Math.min(S.maxHp, S.hp + CFG.healOnClear); S.cleared++; fx(S, 'clear', { how, n: S.wave });

}
function* blastGroup(S, root) {

  while (queue.length) {
    const b = queue.shift(), cells = blastCells(S, b.x, b.y, b.pips); S.bombs.splice(S.bombs.indexOf(b), 1); ids.push(b.id);
    for (const [x, y] of cells) {

}

// ====================== INPUT ======================
const KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
function moveOrShove(dx, dy) { const e = S.phase === 'player' && enemyAt(S, S.px + dx, S.py + dy); return act(e ? { t: 'shove', dx, dy } : { t: 'move', dx, dy }); }
function press(id) {

  else if (id === 'resume') V.help = false; else if (id === 'retry' || id === 'restart') startRun(); else if (id === 'menu') window.location.href = 'index.html';
  else if (id === 'endless') { V.wonShown = true; act({ t: 'continue' }); V.fade = 0; }

}
function onKey(key, shift) {

  if (k === 'h') { V.help = !V.help; V.fade = 0; return; }
  if (k === 'r') { startRun(); return; }
  if (V.help) { if (k === 'Enter' || k === ' ') V.help = false; return; }

  if (S.phase === 'won') { if (k === 'Enter') press('endless'); return; }
  if (S.phase === 'anim') { V.fast = true; return; }
  if (KEYS[k]) { const [dx, dy] = KEYS[k]; if (shift) act({ t: 'place', x: S.px + dx, y: S.py + dy, src: V.sel }); else moveOrShove(dx, dy); }
  else if (k === ' ') act({ t: 'wait' });
  else if (k === 'e') act({ t: 'stash' });
  else if (k === 'q') { if (S.stash.length) { V.sel = (V.sel + 1) % (S.stash.length + 1); tone(600, .04, 'sine', .04); } }

const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function cellAt(mx, my) { const x = Math.floor((mx - L.gx) / L.cs), y = Math.floor((my - L.gy) / L.cs); return inB(x, y) ? [x, y] : null; }
function onMove(mx, my) { V.mx = mx; V.my = my; V.hover = V.screen === 'play' && !V.help ? cellAt(mx, my) : null; }
function onDown(mx, my, btn) {
  audio(); onMove(mx, my); V.down = true;
  const b = V.btns.find(r => inRect(r, mx, my)); if (b) { press(b.id); return; }
  if (V.screen !== 'play' || V.help) return;
  if (S.phase === 'pick') { const c = V.cards.find(r => inRect(r, mx, my)); if (c && V.fade > .6) act({ t: 'pick', i: c.i }); return; }
  if (S.phase === 'anim') { V.fast = true; return; }
  const h = V.hud.find(r => r.sel >= 0 && inRect(r, mx, my)); if (h && h.sel <= S.stash.length && (h.sel > 0 || S.die)) { V.sel = h.sel; tone(600, .04, 'sine', .04); return; }
  const c = cellAt(mx, my); if (!c || S.phase !== 'player') return;
  const dx = c[0] - S.px, dy = c[1] - S.py, adj4 = Math.abs(dx) + Math.abs(dy) === 1;
  if (adj4 && enemyAt(S, c[0], c[1])) act({ t: 'shove', dx, dy });                       // either button on an adjacent enemy = shove
  else if (btn === 2) { if (adj4) act({ t: 'move', dx, dy }); else tip(null, 'Right-click moves 1 tile: pick a cell directly above, below, left or right of you.', 4); }   // RIGHT = move
  else act({ t: 'place', x: c[0], y: c[1], src: V.sel });                               // LEFT = place die
}
window.addEventListener('keydown', ev => { if (ev.key === 'Tab' || ev.key === ' ' || ev.key.startsWith('Arrow')) ev.preventDefault(); onKey(ev.key, ev.shiftKey); });
cv.addEventListener('mousemove', ev => onMove(ev.clientX, ev.clientY));

  get S() { return S; }, get V() { return V; }, get L() { return L; }, get mode() { return mode; }, get busy() { return !!runner; } };
